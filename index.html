1 hr", "type": "prep", "type_source": "file"}, {"n": 14, "section": "Day 2 — bake", "text": "**Serve** wedges warm or at room temperature with soft whipped cream or ice cream.", "time": "~2 min", "type": "prep", "type_source": "file", "uses": ["Skillet and finish::Whipped cream or ice cream, to serve"]}], "times_cooked": 0, "title": "Brown Butter Cornmeal Cake", "total_minutes": 825, "total_time": "1 hr 45 min plus 12 hrs' batter rest (up to 3 days)", "updated": "2026-10-12", "variations": "- Fresh or frozen sour Bing cherries in place of dark sweet, depending on season. Frozen holds its shape better and is what the source specifies.\n- The original Radio Bakery version is scooped into individual portions rather than baked in a skillet — sprinkle each with turbinado before baking. Skillet trades portability for a crisp caramelized wall.", "version": 5}, "crisp-flat-bacon": {"active_time": "~10 min (estimate)", "changes": "", "cook_notes": [], "cook_notes_placeholder": "_No cooks yet._", "cuisine": "American", "date_added": "2026-10-10", "extra_front_matter": {}, "filename": "crisp-flat-bacon_2026-10-10_v1.md", "first_cooked": "by August 2026 (date not recorded)", "icon": "ham", "ingredient_groups": [{"items": ["Bacon strips, thin- or thick-cut — enough for one 13 × 18\" sheet in a single layer, overlapping as little as possible"], "name": "Bacon"}, {"items": ["2 rimmed baking sheets, 13 × 18\"", "1 sheet aluminum foil", "2 sheets parchment paper", "Tongs and an oven mitt", "Paper towel–lined plate"], "name": "Equipment"}], "intro": "Bacon baked between two sheet pans so it renders flat instead of curling. For sandwiches and burgers, where a wavy strip slides out of the build.", "last_cooked": "August 2026", "method": "oven 400°F, pressed between two sheet pans", "notes": "- 400°F is Tim's, not the source's — the pasted recipe gave no temperature at all. Confirm it against the bake window on the first cook.\n- Start checking at 20 min (Tim's preference). The source's windows are 25–30 min thin-cut and 30–35 min thick-cut.\n- Scaling is by tray, not by person — the source gives no serving count. Each extra tray needs its own foil, two more sheets of parchment, and its own second pan to press with.\n- Assembly stack: bottom pan → foil → parchment → bacon → parchment → top pan.\n- Gaps the source is silent on: bacon quantity and how many a tray feeds; rack position; whether to rotate, or how to handle two trays at once; whether the bacon goes in fridge-cold or at room temperature.\n- Active and total times above are estimates, not from the source.", "omitted": "- Nothing. Single source, taken whole.", "protein": "pork", "protein_group": "pork", "scaling": {"base": 1, "enabled": false, "note": "Scaling is by tray, not by person — the source gives no serving count. Each extra tray needs its own foil, two more sheets of parchment, and its own second pan to press with.", "unit": "trays"}, "section": "sides", "serves": "no count given — scales by tray (one 13 × 18\" sheet, single layer)", "side_type": "protein", "slug": "crisp-flat-bacon", "source": "pasted text, 2026-10-10, no attribution given. Oven temperature supplied by Tim, not the source.", "source_comparison": "", "steps": [{"cue": "The trays go in cold and the bake window below assumes a hot oven.", "n": 1, "section": null, "text": "Heat the oven to 400°F.", "time": "~10 min", "type": "prep", "type_source": "guess"}, {"cue": "Foil handles the rendered fat; parchment is the release layer between fat and bacon.", "n": 2, "section": null, "text": "Line one sheet pan with foil, then lay a sheet of parchment over the foil.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::2 rimmed baking sheets, 13 × 18\"", "Equipment::1 sheet aluminum foil", "Equipment::2 sheets parchment paper"]}, {"cue": "Anywhere strips overlap they stay soft and never press flat.", "n": 3, "section": null, "text": "Arrange the strips on the parchment in a single layer, overlapping as little as possible.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Bacon::Bacon strips, thin- or thick-cut — enough for one 13 × 18\" sheet in a single layer, overlapping as little as possible"]}, {"cue": "The top tray is the whole method — it holds every strip flat as the fat renders.", "n": 4, "section": null, "text": "Lay the second sheet of parchment over the bacon, then set the second sheet pan on top.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::2 sheets parchment paper", "Equipment::2 rimmed baking sheets, 13 × 18\""]}, {"cue": "Doneness is by eye, not by clock, and the top tray hides it — start checking at 20 min and keep going in short stretches.", "n": 5, "section": null, "text": "Bake at 400°F until as crisp as you want it. Start checking at 20 min. Thin-cut usually needs 25–30 min, thick-cut 30–35 min.", "time": "20–35 min", "timer_min": 20, "type": "active heat", "type_source": "guess"}, {"n": 6, "section": null, "text": "Pull both trays. With tongs and an oven mitt, lift the top tray off and away from you — it's hot and there's rendered fat underneath.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::Tongs and an oven mitt"]}, {"n": 7, "section": null, "text": "Move the strips to a paper towel–lined plate to drain. Serve.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Bacon::Bacon strips, thin- or thick-cut — enough for one 13 × 18\" sheet in a single layer, overlapping as little as possible", "Equipment::Paper towel–lined plate"]}], "times_cooked": "1+ (count not recorded)", "title": "Crisp Flat Bacon", "total_minutes": 45, "total_time": "~45 min (estimate — oven heat-up plus the bake window; source clocks only the bake)", "updated": "2026-10-12", "variations": "- Thin-cut vs thick-cut timing is the only variation the source offers.", "version": 6}, "dairy-free-fish-chowder": {"active_time": "~35 min (estimate)", "changes": "Adapted from Guiding Stars' Dairy-Free Fish Chowder; amounts, times and the purée method are the source's unless noted.\n- **Clam juice for stock.** 1 quart clam juice replaces the low-sodium vegetable stock, for a seafood broth.\n- **Bacon fat for olive oil.** The aromatics cook in rendered bacon fat; the bacon amount and cut are from Food & Wine (Grace Parisi). The crisp bacon on top is mine.\n- **Scrod and butter potatoes.** Scrod for \"flakey white fish\"; butter potatoes, which Tim has on hand, for \"waxy potatoes.\"\n- **Salt and pepper added.** The source lists none.\n- **Cold water for the second batch of potatoes.** From Unpeeled Journal.\n- **Steps split.** The source's 5 steps are 13 here, one action each, with the bacon first and the carrot and fish prep moved inside the simmers.", "cook_notes": [], "cuisine": "American, New England-style, dairy-free", "date_added": "2026-10-17", "extra_front_matter": {}, "filename": "", "first_cooked": "not yet", "icon": "soup", "ingredient_groups": [{"items": ["3 thick-cut slices bacon, cut into ½\" pieces — amount and cut from Food & Wine (Grace Parisi)", "2 Tbsp olive oil — only to top up if the bacon gives less than 2 Tbsp fat", "1 onion, chopped", "1 clove garlic, minced", "2 celery stalks, chopped — half with the onion, half later", "4 medium butter potatoes, peeled and diced — half for the purée, half later", "¼ cup white wine", "1 quart clam juice — in place of the source's low-sodium vegetable stock", "1 carrot, peeled and diced", "1 lb scrod, cut into chunks — the source says flakey white fish", "1 tsp white wine vinegar", "Kosher salt and black pepper, to taste — not in the source"], "name": ""}, {"items": ["Large, heavy-bottomed pot", "Immersion blender"], "name": "Equipment"}], "intro": "Half the potatoes simmer soft in the broth and get blended in, so the body comes from potato instead of cream. Clam juice and bacon fat give it the New England taste. The rest of the potatoes, carrot and celery go back in for chunks, and the scrod goes in last for just a few minutes.", "last_cooked": "never", "method": "stovetop, one pot plus an immersion blender", "notes": "- Scrod is young cod: thin and delicate, so handle it gently once it's in.\n- Clam juice is much saltier than low-sodium stock. Season only at the end.\n- The source lists the stock as \"divided\" but its method adds it all at once. This follows the method.\n- The source calls for waxy potatoes. If the butter potatoes are on the starchy side, the second batch may soften more and thicken the chowder a little.\n- **Gap:** no serving count in the source.\n- **Gap:** pot size given only as \"large, heavy-bottomed.\"\n- **Gap:** no dice size for the potatoes or carrot, and no piece size for the fish.\n- **Gap:** no heat level for the boil in step 5.\n- **Gap:** no cook time for the bacon; ~8 min is an estimate.\n- **Gap:** no salt or pepper amounts.", "omitted": "- Low-sodium vegetable stock — swapped for clam juice so the broth tastes of the sea.\n- Olive oil as the cooking fat — swapped for bacon fat; kept only as a top-up.", "protein": "flakey white fish (scrod)", "protein_group": "fish", "scaling": {"base": 1, "enabled": false, "note": "The source gives no serving count, so this scales by batch, not servings.", "unit": "batch"}, "section": "mains", "serves": "source gives no count", "slug": "dairy-free-fish-chowder", "source": "Base: Guiding Stars, \"Dairy-Free Fish Chowder\" — https://guidingstars.com/recipes/dairy-free-fish-chowder/ (read from its search listing; the page redirected when fetched). Bacon amount and cut: Food & Wine (Grace Parisi), \"New England Fish Chowder\", via Sitka Seafood Market — https://sitkaseafoodmarket.com/blogs/recipes/new-england-fish-chowder. Cold-water potato tip: Unpeeled Journal (Moody's Diner) — https://unpeeledjournal.com/fish-chowder-recipe/. Fish-last approach also from The View from Great Island — https://theviewfromgreatisland.com/new-england-fish-chowder/. Adapted by Tim: clam juice, bacon fat, scrod, butter potatoes.", "source_comparison": "", "steps": [{"n": 1, "section": null, "text": "Chop the onion, mince the garlic and chop the celery. Split the celery into two piles.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["::1 onion, chopped", "::1 clove garlic, minced", "::2 celery stalks, chopped — half with the onion, half later"]}, {"cue": "The water keeps cut potatoes from browning (Unpeeled Journal).", "n": 2, "section": null, "text": "Peel and dice the potatoes and split them into two equal piles. Cover the second pile with cold water until it goes in.", "time": "~8 min", "type": "prep", "type_source": "guess", "uses": ["::4 medium butter potatoes, peeled and diced — half for the purée, half later"]}, {"cue": "You want about 2 Tbsp of fat. If there's less, top it up with olive oil.", "n": 3, "section": null, "text": "Cook the bacon in the pot over medium heat until crisp. Lift it out with a slotted spoon and keep the fat in the pot.", "time": "~8 min", "type": "active heat", "type_source": "guess", "uses": ["::3 thick-cut slices bacon, cut into ½\" pieces — amount and cut from Food & Wine (Grace Parisi)", "::2 Tbsp olive oil — only to top up if the bacon gives less than 2 Tbsp fat", "Equipment::Large, heavy-bottomed pot"]}, {"n": 4, "section": null, "text": "Over medium heat, cook the onion, garlic and the first half of the celery in the fat until soft.", "time": "5–8 min", "timer_min": 5, "type": "active heat", "type_source": "guess", "uses": ["::1 onion, chopped", "::1 clove garlic, minced", "::2 celery stalks, chopped — half with the onion, half later"]}, {"combine": {"heat": "boil", "inputs": [{"cat": "aromatic", "label": "Softened aromatics"}, {"cat": "wet", "label": "White wine"}, {"cat": "wet", "label": "Clam juice"}, {"cat": "dry", "label": "Half the potatoes"}], "result": "Potato broth", "vessel": "Pot"}, "n": 5, "section": null, "text": "Add the wine, clam juice and the first half of the potatoes. Bring to a boil.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["::¼ cup white wine", "::1 quart clam juice — in place of the source's low-sodium vegetable stock", "::4 medium butter potatoes, peeled and diced — half for the purée, half later"]}, {"cue": "Very soft means they crush against the side of the pot with a spoon. Peel and dice the carrot during this wait.", "n": 6, "section": null, "text": "Drop the heat to medium-low and simmer until the potatoes are very soft.", "time": "15–20 min", "timer_min": 15, "type": "waiting", "type_source": "guess"}, {"n": 7, "section": null, "text": "Peel and dice the carrot (inside the simmer above).", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["::1 carrot, peeled and diced"]}, {"cue": "This purée is what replaces the cream, so blend it fully smooth.", "n": 8, "section": null, "text": "Take the pot off the heat and blend until smooth with the immersion blender.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::Immersion blender"]}, {"combine": {"heat": "simmer", "inputs": [{"cat": "wet", "label": "Potato purée"}, {"cat": "dry", "label": "Remaining potatoes"}, {"cat": "aromatic", "label": "Carrot"}, {"cat": "aromatic", "label": "Remaining celery"}], "result": "Chunky chowder base", "vessel": "Pot"}, "n": 9, "section": null, "text": "Bring it back to a simmer. Drain the second pile of potatoes and add them with the carrot and the rest of the celery.", "time": "~3 min", "type": "active heat", "type_source": "guess", "uses": ["::4 medium butter potatoes, peeled and diced — half for the purée, half later", "::1 carrot, peeled and diced", "::2 celery stalks, chopped — half with the onion, half later"]}, {"cue": "Just tender: a knife goes in with a little resistance. Cut the scrod during this wait.", "n": 10, "section": null, "text": "Simmer until the potato chunks are just tender.", "time": "12–15 min", "timer_min": 12, "type": "waiting", "type_source": "guess"}, {"n": 11, "section": null, "text": "Cut the scrod into chunks and feel for pin bones (inside the simmer above).", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["::1 lb scrod, cut into chunks — the source says flakey white fish"]}, {"cue": "Done when it's opaque and flakes. Scrod is thin and breaks up, so nudge it under rather than stirring hard.", "n": 12, "section": null, "text": "Lay the scrod into the chowder and simmer gently until cooked through.", "time": "3–5 min", "timer_min": 3, "type": "active heat", "type_source": "guess", "uses": ["::1 lb scrod, cut into chunks — the source says flakey white fish"]}, {"combine": {"heat": "off", "inputs": [{"cat": "wet", "label": "Vinegar"}, {"cat": "dry", "label": "Salt"}, {"cat": "aromatic", "label": "Pepper"}, {"cat": "protein", "label": "Crisp bacon"}], "result": "Finished chowder", "vessel": "Pot, then bowls"}, "cue": "Clam juice is salty, so taste before adding any salt.", "n": 13, "section": null, "text": "Gently stir in the vinegar. Taste, then season with salt and pepper. Serve with the bacon on top.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["::1 tsp white wine vinegar", "::Kosher salt and black pepper, to taste — not in the source", "::3 thick-cut slices bacon, cut into ½\" pieces — amount and cut from Food & Wine (Grace Parisi)"]}], "times_cooked": 0, "title": "Dairy-Free Fish Chowder (potato purée, scrod)", "total_minutes": 75, "total_time": "~1 hr 15 min (my sum; the source gives no total)", "updated": "2026-10-17", "variations": "- **Meatless (as the source has it)**: 1 quart low-sodium vegetable stock instead of clam juice, and 2 Tbsp olive oil instead of bacon fat.\n- **Other fish**: haddock, cod, pollock or hake all work (The View from Great Island).", "version": 1}, "gamjatang": {"active_time": "30 min", "changes": "Compared against Maangchi's page as updated 2023-04-08. Seasoning amounts, temperatures and cook times (30 min soak, 7 min blanch, 90 min broth, 30–40 min finish) are unchanged.\n- **Rice added as a side step, labeled A.** She only mentions it when serving. It sits before step 1 and isn't part of the cook; start it first if you want it, since brown rice takes the longest.\n- **Dried red chili and soybean sprouts marked optional.** She lists both as required. Cook 1 skipped both and Tim didn't miss them.\n- **Scale.** She writes it for 2–3 servings on 2½–3 lb of bones with 11 cups of water. Cook 1 used 2.3 lb and 9 cups (about 0.85×), recorded under Variations. The scaling is mine, not hers.\n- **Shiitake sliced earlier.** She takes them out, adds the vegetables, then slices and returns them. This file slices them before the vegetables go in. Same result.\n- **Scallions.** She lists 4 for the pot but her method adds 3. The ingredient list keeps 4; cook 1 used 3 at the 0.85× scale.\n- **Paste water.** She lists ½ cup. Her method puts ¼ cup in the paste and says to add ¼ cup water after the paste goes into the pot. This file has you rinse the paste bowl with that second ¼ cup, as cook 1 did.\n- **Bones wording.** The ingredient line says only \"pork neck bones\". Her tips to pick meaty bones and that spine bones work moved to Notes.\n- **Bone state called out in the steps** (soaked, blanched, washed) so each step says which bones you're handling.\n- **Wording and tags only:** step-type tags, the phone-alarm reminder at 90 min, and my own phrasing throughout.\n- **Ingredient · Seasoning paste.** Tim used 9 to 10 cloves because he likes more garlic. (after the Oct 13, 2026 cook)", "cook_notes": [{"date": "2026-10-10", "heading": "2026-10-10 — cook 1", "text": "Turned out great, even without the bean sprouts and that dried red chili (we didn't need it hotter). Cooked the 2.3 lb / 3 servings scale with 9 cups of water.\nRemind me to make rice next time, since that is a common side dish."}, {"applied": 3, "date": "2026-10-13", "follow_ups": [{"a": "about 15 min", "date": "2026-10-14", "q": "How long was the final simmer (step 11) with the smaller potato chunks?"}, {"a": "yeah, honestly depends on what is available in the supermarket", "date": "2026-10-14", "q": "Should pre-sliced dried shiitake become the default, with step 9 removed?"}, {"a": "I also added more than 6 garlic gloves - I used 9-10 since I like more garlic", "date": "2026-10-14", "q": ""}], "heading": "2026-10-13 — cook 2", "logged_from": "page", "reviewed": "2026-10-14", "text": "Shortened last cook time (when I add potatoes) because I had less time but made up for it by cutting potatoes up into smaller chunks; I also used pre-sliced dried shitakes which saved that step as well"}], "cook_notes_placeholder": "", "cuisine": "Korean", "date_added": "2026-10-08", "extra_front_matter": {}, "filename": "gamjatang_2026-10-08_v2.md", "first_cooked": "2026-10-10", "icon": "soup", "ingredient_groups": [{"items": ["2½ to 3 lb pork neck bones"], "name": "Bones"}, {"items": ["11 cups water", "1 oz ginger, sliced", "2 Tbsp doenjang (Korean fermented soybean paste)", "2 dried shiitake", "1 medium onion, sliced", "1 large dried red chili (or a few red chili peppers) — optional; skipped on cook 1, not missed, didn't need it hotter"], "name": "Broth"}, {"items": ["6 garlic cloves, minced — Tim used 9 to 10 on cook 2, likes more garlic", "3 Tbsp gochugaru", "1 Tbsp gochujang", "3 Tbsp fish sauce", "¼ cup perilla seed powder (deulkkae-garu), fine and hulled", "½ tsp ground black pepper", "¼ cup water"], "name": "Seasoning paste"}, {"items": ["1 lb napa cabbage, core removed", "2 to 3 medium potatoes, peeled, whole", "8 oz soybean sprouts, rinsed and drained — optional; skipped on cook 1, not missed", "4 scallions, cut 2\"", "8 to 12 perilla leaves", "¼ cup water", "1 scallion, chopped, to garnish"], "name": "Stew and finish"}, {"items": ["Rice, cooked — a side, not part of the cook; start it first (step A)"], "name": "Serve with"}], "intro": "Maangchi's 2023 version, as written. Raw potatoes cook in the broth, doenjang simmers with the bones, and perilla seed carries the paste.", "last_cooked": "2026-10-13", "method": "stovetop, one stockpot plus a mixing bowl", "notes": "- Buy the meatiest pork neck bones you can find. Spine bones also work (Maangchi).\n- Doenjang is Korean fermented soybean paste. Saltier, chunkier and funkier than miso; not a 1:1 swap.\n- Dried red chili: Maangchi doesn't specify a variety. Korean dried red pepper (geon-gochu) is the default read. Chile de árbol works but runs hotter.\n- Soybean sprouts (kongnamul) have big yellow heads. Mung bean sprouts are a different thing and won't hold up for 35 min.\n- **Gap:** Maangchi lists 4 scallions for the pot but her method adds 3. This file uses all 4.\n- **Gap:** pot size not given. 11 cups plus 3 lb of bone needs a big stockpot.\n- **Gap:** paste water — ingredient list says ½ cup, method uses ¼ cup in the paste and ¼ cup into the pot. Treated as the same ½ cup split.\n- Tim remembers making Maangchi's version before with good results. That earlier cook isn't recorded; times_cooked counts only cook 1 below.\n- Rice is the standard side, not part of the soup. It's step A so it doesn't get forgotten; start it before the soak if it's brown rice, which takes a long time.", "omitted": "- Buchu (Asian chives) and cooking wine — Maangchi dropped both in her 2017 remake.\n- The combined-recipe changes (less water, longer soak, seasoned cabbage, garlic and scallion in the broth) — preference for Maangchi as written. They're in the Source comparison section below if needed.", "protein": "pork neck bones", "protein_group": "pork", "scaling": {"base_high": 3, "base_low": 2, "enabled": true, "unit": "servings"}, "section": "dinner", "serves": "2 to 3", "slug": "gamjatang", "source": "Maangchi, \"Pork bones soup (Gamjatang)\", updated 2023-04-08 — https://www.maangchi.com/recipe/gamjatang. Followed as written. Korean Bapsang and My Korean Kitchen were compared but not merged in (comparison is the Source comparison section below).", "source_comparison": "Written when the plan was a combined recipe. The recipe above follows Maangchi as written, so the \"Took…\" lines below describe that earlier plan, not what the recipe does.\n\nThree sources, normalized per pound of bone.\n\n### Sources\n- **Maangchi** — https://www.maangchi.com/recipe/gamjatang (2023 update of her 2009 post). 2½–3 lb bones, serves 2–3.\n- **Korean Bapsang** (Hyosun) — https://www.koreanbapsang.com/gamjatang-spicy-pork-bone-stew/. 2 lb bones, serves 3.\n- **My Korean Kitchen** (Sue) — https://mykoreankitchen.com/gamjatang-pork-bone-soup/. 3 lb bones, serves 4.\n\n### Per pound of bone\n\n**Soak** — Maangchi 30 min min. Bapsang 1 hr+, change water halfway. MKK 1 hr+, change every 15 min.\n**Blanch** — Maangchi 7 min covered. Bapsang until it returns to a boil (~7–8 min). MKK ~10 min covered. All three: rinse each bone after.\n**Water** — Maangchi ~4 cups/lb (11 cups). Bapsang 4 cups/lb (8 cups → ~5 cups broth). MKK ~2⅓ cups/lb (7 cups → just under 5 cups).\n**Bone cook time** — Maangchi 90 min + 30–40 min with veg. Bapsang 10 min hard boil + 50–60 min. MKK 90 min + 10–15 min.\n**Gochugaru** — Maangchi ~1 Tbsp/lb. Bapsang ½. MKK 1.\n**Fish sauce / soy** — Maangchi ~1 Tbsp/lb. Bapsang ½. MKK ⅓.\n**Perilla powder** — Maangchi ~1½ Tbsp/lb (in the paste). Bapsang ½ (at the end). MKK ⅓, sesame or perilla (at the end).\n\n### What they agree on\nSoak, then blanch and scrub each bone. Long boil with ginger, onion and garlic-family aromatics. Seasoning built on gochugaru, gochujang and doenjang, with fish sauce or soup soy for salt. Blanched napa, potatoes, perilla leaves at the end, perilla seed for nuttiness.\n\n### The real disagreements, and why\n\n**1. Where the doenjang goes.** Maangchi simmers it with the bones; Bapsang and MKK put it in the finishing paste. In the broth it works on the pork smell for 90 minutes and mellows; in the paste it stays sharper and more fermented. Took Maangchi's — she's also the one who skips straining, so the broth carries it.\n\n**2. Potatoes raw vs. par-boiled.** Maangchi drops them in raw for 30–40 min; the others par-boil separately and finish 10–15 min. Separate boiling keeps the broth clearer and the timing tighter. Raw-in-pot gives potatoes that taste of the soup and a slightly thicker body, and gives the bones 30 more minutes. Took Maangchi's.\n\n**3. Water and seasoning strength.** Maangchi runs the most water *and* the heaviest seasoning — the two offset. Her comment thread still has \"watery / flat\" complaints, and Bapsang and MKK converge on ~5 cups of finished broth. Took 3 cups/lb (between MKK and Maangchi) plus Bapsang's 10-min uncovered hard boil for emulsification, and kept Maangchi's paste ratio. Taste-and-adjust step added before serving.\n\n*Correction from the cook chat:* the comment-thread claim above was overstated. On a fresh read of her page there was one watery-broth question and one flat-broth report from a pressure cooker user.\n\n### Small borrowings\n- Bapsang: toss blanched cabbage with 1 Tbsp of paste before it goes in.\n- Bapsang / MKK: whole garlic and scallion white in the broth; longer soak with a water change.\n\n### Deliberately left out\nRice wine (MKK), buchu (Maangchi's old version), straining the broth (Bapsang, MKK), separate potato par-boil (Bapsang, MKK), mung sprouts and crown daisy (MKK), Dashida (ahnesty.com). Reasons are in the recipe file.", "steps": [{"cue": "Brown rice takes the longest of anything on the table, so start it before the soak. White rice can wait until the final simmer.", "n": "A", "section": null, "text": "**Optional side: rice.** Not part of the soup. Start it first if you want it with dinner.", "time": "~45 min", "type": "waiting", "type_source": "file", "uses": ["Serve with::Rice, cooked — a side, not part of the cook; start it first (step A)"]}, {"n": 1, "section": null, "text": "**Soak** the pork neck bones, rinsed a couple of times, in cold water at least 30 min.", "time": "30+ min", "timer_min": 30, "type": "waiting", "type_source": "file", "uses": ["Bones::2½ to 3 lb pork neck bones"]}, {"n": 2, "section": null, "text": "**Blanch the cabbage.** Big pot of water at a boil, cabbage in for 1 min, lift out with tongs. Keep the water boiling for the bones.", "time": "~12 min", "timer_min": 1, "type": "active heat", "type_source": "file", "uses": ["Stew and finish::1 lb napa cabbage, core removed"]}, {"n": 3, "section": null, "text": "Rinse the cabbage cold, drain, tear each leaf lengthwise once or twice into long bite-size strips.", "time": "~3 min", "type": "prep", "type_source": "file", "uses": ["Stew and finish::1 lb napa cabbage, core removed"]}, {"cue": "The water goes dark and foams.", "n": 4, "section": null, "text": "**Blanch the soaked bones** in the boiling water, covered, medium-high, 7 min.", "time": "7 min", "timer_min": 7, "type": "active heat", "type_source": "file", "uses": ["Bones::2½ to 3 lb pork neck bones"]}, {"n": 5, "section": null, "text": "Drain. Wash each **blanched bone** under cold running water, rubbing off fat, dark foam and bone chips. Set the bones aside. Wash out the blanching pot, or grab a second clean large pot.", "time": "~12 min", "type": "prep", "type_source": "file", "uses": ["Bones::2½ to 3 lb pork neck bones"]}, {"combine": {"heat": "medium-high", "inputs": [{"cat": "protein", "label": "Bones"}, {"cat": "aromatic", "label": "Ginger"}, {"cat": "aromatic", "label": "Doenjang"}, {"cat": "aromatic", "label": "Shiitake"}, {"cat": "aromatic", "label": "Onion"}, {"cat": "aromatic", "label": "Dried chili"}, {"cat": "wet", "label": "Water"}], "result": "Broth", "vessel": "Clean large pot, covered"}, "n": 6, "section": null, "text": "**Build the broth.** Put the **soaked, blanched, washed bones** back into the clean pot to simmer with everything else. Add ginger, doenjang, shiitake, onion, dried chili and 11 cups water. Cover, medium-high.", "time": "~5 min", "type": "active heat", "type_source": "file", "uses": ["Bones::2½ to 3 lb pork neck bones", "Broth::1 oz ginger, sliced", "Broth::2 Tbsp doenjang (Korean fermented soybean paste)", "Broth::2 dried shiitake", "Broth::1 medium onion, sliced", "Broth::1 large dried red chili (or a few red chili peppers) — optional; skipped on cook 1, not missed, didn't need it hotter", "Broth::11 cups water"]}, {"alarm": "90 min", "n": 7, "section": null, "text": "**Cook the bones in the broth 90 min.** Set a phone alarm. Make the paste inside this wait.", "time": "90 min", "type": "waiting", "type_source": "file"}, {"combine": {"heat": "none", "inputs": [{"cat": "aromatic", "label": "Garlic"}, {"cat": "aromatic", "label": "Gochugaru"}, {"cat": "aromatic", "label": "Gochujang"}, {"cat": "wet", "label": "Fish sauce"}, {"cat": "dry", "label": "Perilla powder"}, {"cat": "aromatic", "label": "Pepper"}, {"cat": "wet", "label": "Water"}], "result": "Creamy paste", "vessel": "Bowl, stirred"}, "n": 8, "section": null, "text": "**Paste.** Stir garlic, gochugaru, gochujang, fish sauce, perilla powder, pepper and ¼ cup water until creamy.", "time": "~3 min", "type": "prep", "type_source": "file", "uses": ["Seasoning paste::6 garlic cloves, minced — Tim used 9 to 10 on cook 2, likes more garlic", "Seasoning paste::3 Tbsp gochugaru", "Seasoning paste::1 Tbsp gochujang", "Seasoning paste::3 Tbsp fish sauce", "Seasoning paste::¼ cup perilla seed powder (deulkkae-garu), fine and hulled", "Seasoning paste::½ tsp ground black pepper", "Seasoning paste::¼ cup water"]}, {"n": 9, "section": null, "text": "Pull the 2 shiitake out and slice thin.", "time": "~3 min", "type": "prep", "type_source": "file", "uses": ["Broth::2 dried shiitake"]}, {"combine": {"heat": "medium-high", "inputs": [{"cat": "aromatic", "label": "Cabbage"}, {"cat": "aromatic", "label": "Sprouts"}, {"cat": "aromatic", "label": "Scallions"}, {"cat": "dry", "label": "Potatoes"}, {"cat": "aromatic", "label": "Shiitake"}, {"cat": "aromatic", "label": "Paste"}, {"cat": "wet", "label": "Water"}], "result": "Stew", "vessel": "Broth pot, covered"}, "n": 10, "section": null, "text": "Add cabbage, sprouts, scallions and potatoes. Return the sliced shiitake and add the paste. Rinse the paste bowl with ¼ cup water, pour that in too, and cover.", "time": "~5 min", "type": "active heat", "type_source": "file", "uses": ["Stew and finish::1 lb napa cabbage, core removed", "Stew and finish::8 oz soybean sprouts, rinsed and drained — optional; skipped on cook 1, not missed", "Stew and finish::4 scallions, cut 2\"", "Stew and finish::2 to 3 medium potatoes, peeled, whole", "Broth::2 dried shiitake", "Stew and finish::¼ cup water"]}, {"n": 11, "section": null, "text": "Medium-high 30–40 min, until a chopstick slides straight through a potato.", "time": "30–40 min", "timer_min": 30, "type": "waiting", "type_source": "file"}, {"n": 12, "section": null, "text": "Stir in the perilla leaves.", "time": "~1 min", "type": "active heat", "type_source": "file", "uses": ["Stew and finish::8 to 12 perilla leaves"]}, {"n": 13, "section": null, "text": "Serve in bowls topped with chopped scallion, with rice. Or reheat portions in earthenware bowls and bring them out bubbling.", "time": "~5 min", "type": "prep", "type_source": "file", "uses": ["Stew and finish::1 scallion, chopped, to garnish", "Serve with::Rice, cooked — a side, not part of the cook; start it first (step A)"]}], "times_cooked": 2, "title": "Gamjatang (Korean pork bone soup)", "total_minutes": 165, "total_time": "about 2 hr 45 min (30 min soak, ~2 hr 15 min on the stove)", "updated": "2026-10-14", "variations": "- **No perilla**: basil for the leaves, ground sesame seeds for the powder (Maangchi).\n- **Only coarse dark perilla powder or whole seeds**: mix with water, strain and squeeze, use the milky liquid, discard the solids (Maangchi).\n- **4–6 servings**: double everything and cook longer (Maangchi; she doesn't say how much longer).\n- **If it comes out watery or flat**: from the comparison, cut water toward 9 cups and boil hard uncovered 10 min before covering (Korean Bapsang). Not part of the base recipe.\n- **Pressure cooker**: Maangchi advises against it — the depth comes from long, slow boiling.\n- **Cooked at 2.3 lb / 3 servings (cook 1, worked):** 2.3 lb bones, 9 cups water, ¾ oz ginger, 2 Tbsp doenjang, 2 shiitake, 1 onion, 5 garlic cloves, 2½ Tbsp gochugaru, 1 Tbsp gochujang, 2½ Tbsp fish sauce, 3 Tbsp perilla powder, ½ tsp pepper, 3 Tbsp water in the paste, 13 oz napa, 2 potatoes, 3 scallions in the pot plus 1 to garnish, 8 perilla leaves, 3 Tbsp water to rinse the paste bowl. About 0.85× the recipe. The scaling is mine, not Maangchi's.\n- **Short on time**: cut the potatoes into smaller chunks instead of leaving them whole; the final simmer (step 11) then takes ~15 min. Still test with a chopstick (cook 2, worked).\n- **Pre-sliced dried shiitake**: if the store has them, use them in place of whole dried shiitake and skip step 9 (cook 2).", "version": 13}, "joanne-chang-sticky-buns": {"active_time": "1 hr prep, 40 min bake (Food Network)", "changes": "Cherry Bombe's full page, which is the book text loaded from your PDF, is now the base. Food Network and The Kitchn were compared against it. Amounts, temperatures and times follow the book; where Food Network differs it's noted on the ingredient line.\n- **Order.** The book puts the goo after the buns; here the dough comes first, since it chills 6+ hr, and the goo and pecans are made inside that wait.\n- **Steps split.** The book's 14 numbered steps became 28, one action each.\n- **Divide the dough.** The book does this in step 5, after the chill; same here, as its own step.\n- **Pecan toasting.** The ingredient line says toasted; no source gives a method, so it's its own step with a gap.\n- **Strain step.** Kept from Food Network, labeled as Food Network's; the book doesn't strain.\n- **Oven preheat.** Stays after the proof, as the book has it, with a cue to overlap it with the last of the proof.\n- **Day-old reheat.** The book's step 13 and headnote both moved to Variations.\n- **Wording and tags only:** step-type tags, phone-alarm reminders on the waits, and my own phrasing throughout.", "cook_notes": [], "cuisine": "American (Boston bakery classic)", "date_added": "2026-10-12", "extra_front_matter": {}, "filename": "", "first_cooked": "by 2020-07-04 (date not recorded)", "icon": "croissant", "ingredient_groups": [{"items": ["2½ cups (350 g) all-purpose flour", "2½ cups (375 g) high-gluten bread flour — Food Network gives 2¼ cups (340 g)", "1½ packages (3¼ tsp) active dry yeast, or 28 g fresh cake yeast", "⅓ cup plus 2 Tbsp (92 g) sugar — Food Network gives ⅓ cup plus 1 Tbsp (82 g)", "1 Tbsp salt — Food Network specifies kosher", "⅔ cup cold water — Food Network gives ½ cup", "5 large eggs", "22 Tbsp (2¾ sticks; 310 g) unsalted butter, at room temperature, cut into 10 to 12 pieces"], "name": "Brioche dough"}, {"items": ["¾ cup (1½ sticks; 168 g) unsalted butter", "1½ cups (345 g) light brown sugar", "⅓ cup (110 g) honey", "⅓ cup (80 g) heavy cream", "⅓ cup (75 g) water — Food Network gives 80 g", "¼ tsp salt"], "name": "Goo"}, {"items": ["¼ cup (60 g) light brown sugar — Food Network gives 55 g", "¼ cup (50 g) granulated sugar", "⅛ tsp ground cinnamon", "1 cup (100 g) pecan halves, toasted and chopped — half in the filling, half over the goo"], "name": "Filling and topping"}, {"items": ["Stand mixer with dough hook", "9 × 13\" baking dish", "Bench scraper or chef's knife", "Plastic wrap", "Wire rack", "Serving platter"], "name": "Equipment"}], "intro": "Joanne Chang's famous Flour Bakery sticky buns: brioche rolled up with brown sugar, a little cinnamon and pecans, then baked in a deep pool of honey-brown-sugar caramel (\"goo\") and flipped out of the dish. The brioche recipe makes two loaves' worth of dough; half of it makes this pan of 8 big buns.\n\nStart the day before. The dough chills at least 6 hours and up to overnight, and the goo can be made while it rests or up to 2 weeks ahead.", "last_cooked": "2020-07-04", "method": "stand mixer brioche, stovetop caramel, oven 350°F", "notes": "- Made July 4, 2020 from Joanne Chang's cookbook. That cook isn't recorded (which book or edition, any changes, how it went), so there are no cook notes. Cherry Bombe credits this text to Flour: Spectacular Recipes from Boston's Flour Bakery + Café. This version is rebuilt from three web pages, not from your copy of the book.\n- Start a day ahead: the dough chills 6 hr minimum, up to overnight.\n- The brioche recipe makes two loaves' worth of dough. Half makes this pan; the other half is \"reserved for another use\" and the sources name none.\n- Buns bake uncovered, so the side facing up in the oven crisps and becomes the bottom once inverted (Kitchn).\n- Best right away or within 4 hr of baking; the book says Flour doesn't serve the day-old version.\n- Kitchn's review: very large buns, caramel flavor dominates over a hint of cinnamon; rated 10/10, baked at the 35 min end of the window.\n- **Gap:** no temperature or time for toasting the pecans.\n- **Gap:** \"room temperature\" is all the sources say for the butter; no time or target.\n- **Gap:** flour for dusting the work surface isn't measured.\n- **Gap:** \"warm room temperature\" for the proof, no number.\n- **Gap:** sources don't say whether goo stored in the fridge should come back to room temperature before it goes in the dish.\n- **Gap:** baking dish material (glass or metal) isn't given, only 9 × 13 inches.\n- **Gap:** stand mixer size isn't given, and the dough is a two-loaf batch.\n- **Gap:** the book and Food Network disagree on the dough's bread flour, sugar and water. Which amounts the July 4, 2020 cook used isn't recorded.", "omitted": "- 1 egg for egg wash — the book's dough list includes it, but no step in the bun method uses it; Food Network folds it into \"6 eggs.\"\n- Parchment-lined baking sheet — book step 5 says to line one, and nothing later uses it.\n- Food Network's different dough amounts (bread flour, sugar, water), 55 g filling sugar and 80 g goo water — the book's amounts are used; Food Network's are noted on each line.\n- Kitchn's cover-halfway and extra-cinnamon tips — Kitchn's own advice, so they sit under Variations rather than in the method.\n- The reserved half of the dough — the book says \"another use\" and names none.", "protein": "none", "protein_group": "none", "scaling": {"base": 1, "enabled": false, "note": "The brioche recipe makes two loaves' worth of dough and half of it makes one pan of 8 buns, so the amounts don't scale with a servings control. Kitchn mentions the other half can make a second batch; the sources give no amounts for it.", "unit": "pan (8 buns)"}, "section": "desserts", "serves": "8 buns", "slug": "joanne-chang-sticky-buns", "source": "Joanne Chang, \"Joanne Chang's Sticky Sticky Buns\", Cherry Bombe, which credits the recipe to Flour: Spectacular Recipes from Boston's Flour Bakery + Café — https://cherrybombe.com/blogs/recipes/joanne-changs-sticky-sticky-buns (full page loaded from a PDF; this is the base). Cross-read against Food Network, \"Flour's Famous Sticky Buns\", recipe courtesy of Joanne Chang, from Throwdown with Bobby Flay — https://www.foodnetwork.com/recipes/joanne-changs-sticky-buns-recipe-1947951 and The Kitchn, Ann Taylor Pittman's review, 2023-05-21 — https://www.thekitchn.com/joanne-chang-sticky-buns-recipe-review-23536287 (loaded from a PDF). Made July 4, 2020 from Joanne Chang's cookbook; which book or edition is not recorded.", "source_comparison": "Three pages for one recipe: Cherry Bombe (the book text, full page loaded from your PDF), Food Network (full recipe) and The Kitchn (a review that summarizes the method). All credit Joanne Chang. Cherry Bombe names the book as Flour: Spectacular Recipes from Boston's Flour Bakery + Café.\n\n### What they agree on\nYields 8 buns from half the brioche dough, the other half set aside. 9 × 13 dish, oven at 350°F, rack in the middle. Goo of butter, brown sugar, honey, cream, water and salt, cooled to room temperature and good for 2 weeks in the fridge. Filling of brown sugar, granulated sugar, ⅛ tsp cinnamon and half the pecans, the other half over the goo. Dough chilled at least 6 hours or overnight, rolled to about 12 × 16 inches and ¼ inch thick, cut into 8 pieces about 1½ inches wide. Proofed about 2 hours until touching, baked 35 to 45 minutes uncovered, cooled 20 to 30 minutes, then inverted.\n\n### The real disagreements, and why\n\n**1. Dough amounts.** The book has 2½ cups (375 g) bread flour, ⅓ cup plus 2 Tbsp (92 g) sugar and ⅔ cup water. Food Network has 2¼ cups (340 g), ⅓ cup plus 1 Tbsp (82 g) and ½ cup. Neither page says why. Water is the biggest swing against the extra flour. Both give the same pull test and the same fix (a few Tbsp of flour if it's batter-like, more mixing if it tears), so either version self-corrects. Used the book's amounts and noted Food Network's on each line.\n\n**2. The sixth egg.** The book lists 5 large eggs plus 1 for egg wash. Food Network lists 6 and uses 5 in the method. Same dough; the sixth is the egg wash, which no bun step uses. Settles the open question from the first load.\n\n**3. The goo.** Yield is about 2 cups in the book and about 3 in Food Network, with water at 75 g vs 80 g and butter at 168 g vs 170 g. The book whisks the brown sugar until dissolved. Food Network cooks it \"to combine,\" says a separated look is fine, and strains out undissolved sugar. Used the book's amounts and kept the strain as a labeled step.\n\n**4. Filling brown sugar.** ¼ cup is 60 g in the book and 55 g in Food Network. Same volume; packed brown sugar varies by a few grams. Used 60 g.\n\n**5. Reheating.** The book gives two settings itself: the headnote says 300°F for 5–7 min, and step 13 says 325°F for 10–12 min (Food Network matches step 13). Neither says why. Both are listed under Variations.\n\n**6. Proofing.** The book says warm room temperature, about 2 hours. Food Network says a warm spot until almost tripled in size. Kitchn used an oven proof setting because the kitchen was chilly. None gives a temperature.\n\n**7. Butter timing.** The book and Food Network add the butter piece by piece and mix about 10 minutes. Kitchn says the butter goes in over about 10 minutes total. The wording is ambiguous; step 4's cue flags it.\n\n### Small differences\nFood Network says kosher salt and firmly packed brown sugar in the goo; the book says just salt and brown sugar.\n\n### Deliberately left out\nThe book's egg wash egg and its parchment-lined baking sheet (nothing uses either), Food Network's alternate amounts as the base, and Kitchn's cover-halfway and extra-cinnamon tips as default steps (the last two are under Variations).", "steps": [{"n": 1, "section": "Brioche dough", "text": "Cut the room-temperature butter into 10 to 12 pieces and set it next to the mixer.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Brioche dough::22 Tbsp (2¾ sticks; 310 g) unsalted butter, at room temperature, cut into 10 to 12 pieces"]}, {"combine": {"heat": "none", "inputs": [{"cat": "dry", "label": "All-purpose flour"}, {"cat": "dry", "label": "Bread flour"}, {"cat": "dry", "label": "Yeast"}, {"cat": "sweet", "label": "Sugar"}, {"cat": "dry", "label": "Salt"}, {"cat": "wet", "label": "Cold water"}, {"cat": "protein", "label": "5 eggs"}], "result": "Shaggy dough", "vessel": "Stand mixer, dough hook, low"}, "n": 2, "section": "Brioche dough", "text": "In the stand mixer with the dough hook, combine both flours, the yeast, sugar, salt, water and 5 eggs. Mix on low until everything has come together, scraping the bowl if needed so all the flour is wet.", "time": "3–4 min", "timer_min": 3, "type": "prep", "type_source": "guess", "uses": ["Brioche dough::2½ cups (350 g) all-purpose flour", "Brioche dough::2½ cups (375 g) high-gluten bread flour — Food Network gives 2¼ cups (340 g)", "Brioche dough::1½ packages (3¼ tsp) active dry yeast, or 28 g fresh cake yeast", "Brioche dough::⅓ cup plus 2 Tbsp (92 g) sugar — Food Network gives ⅓ cup plus 1 Tbsp (82 g)", "Brioche dough::1 Tbsp salt — Food Network specifies kosher", "Brioche dough::⅔ cup cold water — Food Network gives ½ cup", "Brioche dough::5 large eggs", "Equipment::Stand mixer with dough hook"]}, {"cue": "It will be very stiff and may seem quite dry (Food Network). That's correct.", "n": 3, "section": "Brioche dough", "text": "Once the dough has all come together, keep mixing on low.", "time": "3–4 min", "timer_min": 3, "type": "prep", "type_source": "guess"}, {"cue": "The book's wording could mean the 10 minutes in the next step includes the additions; Kitchn reads it that way.", "n": 4, "section": "Brioche dough", "text": "With the mixer on low, add the butter piece by piece, mixing after each piece until it disappears into the dough.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Brioche dough::22 Tbsp (2¾ sticks; 310 g) unsalted butter, at room temperature, cut into 10 to 12 pieces"]}, {"cue": "The butter has to mix in completely.", "n": 5, "section": "Brioche dough", "text": "Keep mixing on low, stopping now and then to scrape the sides of the bowl. If you need to, break up the dough with your hands to help the butter mix in.", "time": "10 min", "timer_min": 10, "type": "prep", "type_source": "guess"}, {"cue": "It looks shaggy and questionable at first, then turns smooth and silky (Food Network). Give it the full time.", "n": 6, "section": "Brioche dough", "text": "Once the butter is fully incorporated, turn the speed up to medium and mix until the dough is sticky, soft and somewhat shiny.", "time": "15 min", "timer_min": 15, "type": "prep", "type_source": "guess"}, {"cue": "You should hear a slap-slap-slap as the dough hits the sides of the bowl.", "n": 7, "section": "Brioche dough", "text": "Turn the speed to medium-high for about 1 minute.", "time": "1 min", "timer_min": 1, "type": "prep", "type_source": "guess"}, {"cue": "Ready when you can gather it all together and pick it up as one piece.", "n": 8, "section": "Brioche dough", "text": "Test the dough by pulling at it. It should stretch a bit and have a little give. If it's wet and loose, more like batter than dough, add a few tablespoons of flour and mix until it comes together. If it breaks off in pieces, mix on medium another 2–3 min until it stretches.", "time": "~3 min", "type": "prep", "type_source": "guess"}, {"alarm": "6 hr minimum, up to overnight", "cue": "Make the goo and toast the pecans while you wait.", "n": 9, "section": "Brioche dough", "text": "Put the dough in a large bowl or plastic container and press plastic wrap directly onto its surface. Refrigerate at least 6 hours, or overnight. Set a phone alarm.", "time": "6 hr+", "type": "waiting", "type_source": "guess", "uses": ["Equipment::Plastic wrap"]}, {"cue": "Food Network says it may look separated and that's fine.", "n": 10, "section": "Goo", "text": "Melt the butter in a medium saucepan over medium heat. Whisk in the brown sugar until it's dissolved.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Goo::¾ cup (1½ sticks; 168 g) unsalted butter", "Goo::1½ cups (345 g) light brown sugar"]}, {"combine": {"heat": "off", "inputs": [{"cat": "fat", "label": "Butter-sugar base"}, {"cat": "sweet", "label": "Honey"}, {"cat": "fat", "label": "Cream"}, {"cat": "wet", "label": "Water"}, {"cat": "dry", "label": "Salt"}], "result": "Goo", "vessel": "Saucepan, off the heat"}, "n": 11, "section": "Goo", "text": "Take the pan off the heat and whisk in the honey, cream, water and salt.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Goo::⅓ cup (110 g) honey", "Goo::⅓ cup (80 g) heavy cream", "Goo::⅓ cup (75 g) water — Food Network gives 80 g", "Goo::¼ tsp salt"]}, {"cue": "Food Network's step. The book doesn't mention straining.", "n": 12, "section": "Goo", "text": "Strain the goo to remove any undissolved lumps of brown sugar.", "time": "~2 min", "type": "prep", "type_source": "guess"}, {"cue": "The book says it makes about 2 cups, enough for 8 buns (Food Network says about 3). It keeps up to 2 weeks in an airtight container in the fridge.", "n": 13, "section": "Goo", "text": "Let it cool to room temperature before using, about 30 minutes.", "time": "30 min", "timer_min": 30, "type": "waiting", "type_source": "guess"}, {"cue": "The sources give no toasting temperature or time.", "n": 14, "section": "Filling and topping", "text": "Toast the pecan halves, then chop them. Do this while the dough chills.", "time": "~10 min", "type": "prep", "type_source": "guess", "uses": ["Filling and topping::1 cup (100 g) pecan halves, toasted and chopped — half in the filling, half over the goo"]}, {"n": 15, "section": "Filling and topping", "text": "Take the chilled dough out and divide it in half. Use one half for the buns and set the other half aside for another use.", "time": "~2 min", "type": "prep", "type_source": "guess"}, {"cue": "It feels like cold, damp Play-Doh and should be fairly easy to roll.", "n": 16, "section": "Filling and topping", "text": "On a floured work surface, roll the dough into a tall rectangle about 12 × 16 inches and ¼ inch thick, with a 12-inch edge at the top.", "time": "~8 min", "type": "prep", "type_source": "guess"}, {"combine": {"heat": "none", "inputs": [{"cat": "sweet", "label": "Brown sugar"}, {"cat": "sweet", "label": "Granulated sugar"}, {"cat": "aromatic", "label": "Cinnamon"}, {"cat": "dry", "label": "Half the pecans"}], "result": "Filling", "vessel": "Small bowl"}, "n": 17, "section": "Filling and topping", "text": "In a small bowl, mix together the brown sugar, white sugar, cinnamon and half of the chopped pecans.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Filling and topping::¼ cup (60 g) light brown sugar — Food Network gives 55 g", "Filling and topping::¼ cup (50 g) granulated sugar", "Filling and topping::⅛ tsp ground cinnamon", "Filling and topping::1 cup (100 g) pecan halves, toasted and chopped — half in the filling, half over the goo"]}, {"n": 18, "section": "Filling and topping", "text": "Sprinkle the filling evenly over the entire surface of the dough.", "time": "~2 min", "type": "prep", "type_source": "guess"}, {"cue": "Roll tightly so you get a nice round spiral.", "n": 19, "section": "Filling and topping", "text": "Starting from the top (12-inch edge) and working your way down, roll the dough up like a jelly roll until the whole sheet is rolled.", "time": "~3 min", "type": "prep", "type_source": "guess"}, {"n": 20, "section": "Filling and topping", "text": "Trim about ¼ inch off both ends of the roll so the ends are even.", "time": "~1 min", "type": "prep", "type_source": "guess"}, {"n": 21, "section": "Filling and topping", "text": "Cut the roll into 8 equal pieces, each about 1½ inches wide, with a bench scraper or chef's knife.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::Bench scraper or chef's knife"]}, {"n": 22, "section": "Assembly and bake", "text": "Pour the goo into a 9 × 13-inch baking dish. Sprinkle the remaining pecans evenly over the goo.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::9 × 13\" baking dish", "Filling and topping::1 cup (100 g) pecan halves, toasted and chopped — half in the filling, half over the goo"]}, {"n": 23, "section": "Assembly and bake", "text": "Place the 8 buns in the dish, evenly spaced.", "time": "~2 min", "type": "prep", "type_source": "guess"}, {"alarm": "about 2 hr", "cue": "Done when the dough is puffy, pillowy and soft and the buns are touching. Food Network adds almost tripled in size; Kitchn uses an oven proof setting if the kitchen is chilly.", "n": 24, "section": "Assembly and bake", "text": "Cover the dish with plastic wrap and let the buns proof at warm room temperature. Set a phone alarm.", "time": "2 hr", "type": "waiting", "type_source": "guess", "uses": ["Equipment::Plastic wrap"]}, {"cue": "Overlap this with the last stretch of the proof so the oven is ready when the buns are.", "n": 25, "section": "Assembly and bake", "text": "Position a rack in the middle of the oven and heat it to 350°F.", "time": "~15 min", "type": "prep", "type_source": "guess"}, {"cue": "Start checking at 35 min.", "n": 26, "section": "Assembly and bake", "text": "Bake until the buns are golden brown.", "time": "35–45 min", "timer_min": 35, "type": "active heat", "type_source": "guess"}, {"cue": "Food Network sets it on a wire rack.", "n": 27, "section": "Assembly and bake", "text": "Take the dish out of the oven and let it cool in the dish.", "time": "20–30 min", "timer_min": 20, "type": "waiting", "type_source": "guess", "uses": ["Equipment::Wire rack"]}, {"cue": "Best right away or within 4 hours of baking.", "n": 28, "section": "Assembly and bake", "text": "One at a time, invert the buns onto a serving platter. Spoon any extra goo and pecans on top. Serve warm.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::Serving platter"]}], "times_cooked": "1+ (count not recorded)", "title": "Flour's Famous Sticky Buns (Joanne Chang)", "total_minutes": 620, "total_time": "~10 hr 20 min with the 6 hr minimum dough chill (my sum); Food Network's own total, 3 hr 40 min, leaves the chill out", "updated": "2026-10-12", "variations": "- **Softer buns (Kitchn)**: cover the pan halfway through the bake for a consistently gooey texture. Kitchn's tip, not Chang's; untested here.\n- **More cinnamon (Kitchn)**: if you want more, use no more than 1 tsp so it doesn't overpower the goo. Kitchn's advice; untested here.\n- **Cool kitchen (Kitchn)**: use the oven or toaster oven's proof setting for the second rise.\n- **Make ahead, goo**: up to 2 weeks, airtight, in the fridge (book and Food Network).\n- **Make ahead, dough**: after the fridge rest, freeze it airtight up to 1 week (Food Network only).\n- **Make ahead, shaped buns**: after cutting, wrap tightly and freeze up to 1 week. Thaw still wrapped, in the fridge overnight or at room temperature 2–3 hr, then proceed from the pan (book and Food Network).\n- **Reheat a day-old batch**: the book gives two settings. The headnote says 300°F for 5–7 min; step 13 says 325°F for 10–12 min (Food Network says the same as step 13). Step 13 adds that Flour doesn't serve the day-old version. Airtight at room temperature up to 1 day (Food Network).\n- **Double batch (Kitchn)**: the other half of the dough makes a second pan. No amounts given.", "version": 2}, "miso-black-cod": {"active_time": "20 min", "changes": "", "cook_notes": [{"date": "2026-08-12", "heading": "2026-08-12 — cook 1", "text": "Worked. [Actual broil time, fillet thickness, how the film behaved, anything to change next time.]"}], "cuisine": "Japanese", "date_added": "2026-08-12", "extra_front_matter": {"derived_from": "miso-black-cod-comparison_2026-08-12_v1.md"}, "filename": "miso-black-cod_2026-08-12_v3.md", "first_cooked": "2026-08-12", "icon": "fish", "ingredient_groups": [{"items": ["3 Tbsp sake", "3 Tbsp mirin", "½ cup white miso paste", "⅓ cup granulated sugar", "2 tsp soy sauce"], "name": "Marinade"}, {"items": ["4 skin-on black cod / sablefish fillets, 5–7 oz each, 1–1½\" thick, center cut", "Kosher salt", "Neutral oil or cooking spray"], "name": "Fish"}], "intro": "Nobu-style saikyo-yaki. Three-day cure, thin film of marinade, straight under the broiler.", "last_cooked": "2026-08-12", "method": "broiler", "notes": "- Black cod is sablefish, not cod. High fat is why it's forgiving.\n- Alaskan black cod: \"Best Choice\" per Monterey Bay Aquarium Seafood Watch.\n- Marinade keeps a week refrigerated; good on salmon or Chilean sea bass.\n- Broil window depends entirely on your broiler. Calibrate on the first attempt and note it below.", "omitted": "- Oil in the marinade (Kenji) — drips off, does nothing.\n- Skinless fillets (Hikari) — skin shields the flesh under the broiler and crisps up.", "protein": "sablefish", "protein_group": "fish", "scaling": {"base": 4, "enabled": true, "unit": "servings"}, "section": "dinner", "serves": "4", "slug": "miso-black-cod", "source": "Hikari Miso (Nobu official), Food & Wine 2008, The Kitchn, Serious Eats (Kenji)", "source_comparison": "", "steps": [{"cue": "The target is volume, not time — this is what makes the marinade cling instead of run.", "n": 1, "section": null, "text": "Boil sake and mirin in a small saucepan, reduce to about 4 Tbsp total.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Marinade::3 Tbsp sake", "Marinade::3 Tbsp mirin"]}, {"combine": {"heat": "low", "inputs": [{"cat": "wet", "label": "Sake–mirin reduction"}, {"cat": "aromatic", "label": "White miso"}, {"cat": "sweet", "label": "Sugar"}, {"cat": "wet", "label": "Soy sauce"}], "result": "Thick, glossy marinade", "vessel": "Small saucepan"}, "cue": "Sugar scorches if you walk away.", "n": 2, "section": null, "text": "Lower heat. Whisk in miso, sugar, soy sauce. Cook 2–3 min, stirring constantly, until thick and glossy.", "time": "2–3 min", "timer_min": 2, "type": "active heat", "type_source": "guess", "uses": ["Marinade::½ cup white miso paste", "Marinade::⅓ cup granulated sugar", "Marinade::2 tsp soy sauce"]}, {"n": 3, "section": null, "text": "Cool completely to room temp (~20 min) before it touches the fish.", "time": "20 min", "timer_min": 20, "type": "waiting", "type_source": "guess"}, {"alarm": "3 days", "cue": "This is a cure, not a glaze.", "n": 4, "section": null, "text": "Pat fillets dry, coat every surface, seal, refrigerate 3 days.", "time": "3 days", "type": "waiting", "type_source": "guess", "uses": ["Fish::4 skin-on black cod / sablefish fillets, 5–7 oz each, 1–1½\" thick, center cut"]}, {"n": 5, "section": null, "text": "Brush off excess by hand, leaving a thin even film. Season lightly with kosher salt. Foil-line and grease a sheet pan.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Fish::Kosher salt", "Fish::Neutral oil or cooking spray"]}, {"n": 6, "section": null, "text": "Broil 6\" from the element, high, skin-side down, 8–12 min. Start checking at 8. Rotate the pan; shield burning spots with a foil scrap.", "time": "8–12 min", "timer_min": 8, "type": "active heat", "type_source": "guess", "uses": ["Fish::4 skin-on black cod / sablefish fillets, 5–7 oz each, 1–1½\" thick, center cut"]}, {"cue": "Skewer should slide through with zero resistance.", "n": 7, "section": null, "text": "Pull pin bones after cooking. Serve with rice, a green vegetable, pickled ginger.", "time": "~3 min", "type": "prep", "type_source": "guess"}], "times_cooked": 1, "title": "Miso Black Cod (saikyo-yaki)", "total_minutes": 4320, "total_time": "3 days", "updated": "2026-10-12", "variations": "- **Fillets under ¾\"**: 4\" from element, check at 6 min.\n- **Pan**: sear skin-side-*up* in an oiled grill pan 1–2 min, transfer browned-side-up to a parchment sheet, 400°F for 8–10 min. Never flip cooked fish.\n- **Air fryer**: 400°F preheated 10 min, 7–8 min per batch of two, undisturbed.\n- **Weeknight**: 30-min marinade. Good, but a glaze — not the cured texture.", "version": 8}, "pan-seared-skate-wing": {"active_time": "15 min", "changes": "", "cook_notes": [{"date": null, "heading": "Cook 1 — date not recorded (reported 2026-10-10)", "text": "\"Turned out pretty good, actually... more than okay, good, but one thing that we were struggling with was it sticking to the pan, even though we tried to make sure it was properly preheated and tried to make sure there was enough liquid.\""}], "cuisine": "French-style", "date_added": "2026-10-10", "extra_front_matter": {}, "filename": "pan-seared-skate-wing_2026-10-10_v1.md", "first_cooked": "before 2026-10-10 (date not recorded)", "icon": "fish-symbol", "ingredient_groups": [{"items": ["2 skate wing fillets, 6–8 oz each, skinned", "1 tsp kosher salt", "½ tsp black pepper, freshly ground", "3 Tbsp all-purpose flour, for dredging", "2 Tbsp neutral oil (vegetable or grapeseed)"], "name": "Fish"}, {"items": ["3 Tbsp unsalted butter"], "name": "Butter sauce (base)"}, {"items": ["1 Tbsp vinegar (sherry, red wine, or white wine)", "1 tsp capers, drained (optional)", "1 Tbsp chopped parsley (optional)"], "name": "Option A — vinegar"}, {"items": ["1 Tbsp tomato paste", "1 Tbsp vinegar, wine, or water, to loosen", "1 Tbsp chopped parsley (optional)"], "name": "Option B — tomato"}], "intro": "Floured skate seared in oil, then a butter pan sauce built in the same pan. Two finishes off the same browned butter: vinegar (stands in for lemon) or tomato paste.", "last_cooked": "date not recorded", "method": "stovetop pan sear", "notes": "- Skate is a ray/shark wing; naturally wet-surfaced, cooks fast, dries out fast.\n- Gaps: serving count assumed (2 fillets); no source gives a doneness temp — go by opacity and flake; pan type used (nonstick/stainless/cast iron) not recorded; which sauce option was cooked not recorded; vinegar type used not recorded.\n- Sticking — suggested fixes, NOT yet tried: air-dry fillets uncovered on a rack in the fridge 15–20 min, or salt ahead and re-pat right before flouring; leave undisturbed the first 60–90 sec and use the shimmy test (slides freely = released) instead of the clock; make sure oil film is even under the whole curved fillet; nonstick or well-seasoned cast iron over stainless for thin delicate fish. Insufficient heat shows as poor browning, not sticking.\n- No multi-source comparison doc exists for this dish.", "omitted": "- Milk soak before flouring (Serious Eats, Hooked on Fish) — extra step, not needed for a limited-pantry version.\n- Butter-basting during the sear (Mayfair Foodie) — sear in oil, keep the butter for the sauce so it doesn't burn.\n- Wine, shallot, smoked paprika, lemon — not on hand; Option A uses vinegar in place of the acid.", "protein": "skate wing", "protein_group": "other seafood", "scaling": {"base": 2, "enabled": true, "note": "Serving count assumed — no count given; 2 fillets.", "unit": "servings"}, "section": "dinner", "serves": "2 (assumed — no count given; 2 fillets)", "slug": "pan-seared-skate-wing", "source": "Technique synthesized from the classic dredge-sear-brown-butter preparation across Serious Eats (pan-fried skate with capers), Food Network (Emeril, Bobby Flay), Basil and Bubbly, Kitchen Sense, Simple et Bon, The Mayfair Foodie. Sauce options built pantry-first to Tim's constraints, not from one source.", "source_comparison": "", "steps": [{"combine": {"heat": "none", "inputs": [{"cat": "protein", "label": "Fillets"}, {"cat": "dry", "label": "Salt"}, {"cat": "aromatic", "label": "Pepper"}], "result": "Seasoned fillets", "vessel": "Board"}, "cue": "Wet fish won't sear.", "n": 1, "section": null, "text": "Pat the fillets completely dry. Season both sides with salt and pepper.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Fish::2 skate wing fillets, 6–8 oz each, skinned", "Fish::1 tsp kosher salt", "Fish::½ tsp black pepper, freshly ground"]}, {"cue": "Thin even film — too much goes gummy instead of crisp.", "n": 2, "section": null, "text": "Dredge in the flour, both sides, tap off excess.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Fish::3 Tbsp all-purpose flour, for dredging"]}, {"n": 3, "section": null, "text": "Heat the oil in a large skillet over medium-high until shimmering. Lay the fillets in gently, sear undisturbed until deep golden, 3–4 min.", "time": "3–4 min", "timer_min": 3, "type": "active heat", "type_source": "guess", "uses": ["Fish::2 Tbsp neutral oil (vegetable or grapeseed)", "Fish::2 skate wing fillets, 6–8 oz each, skinned"]}, {"cue": "Skate dries out fast — pull it when it flakes, don't chase color.", "n": 4, "section": null, "text": "Flip carefully, sear 2–3 min more until opaque and flaking easily. Plate and tent with foil.", "time": "2–3 min", "timer_min": 2, "type": "active heat", "type_source": "guess", "uses": ["Fish::2 skate wing fillets, 6–8 oz each, skinned"]}, {"cue": "Pull it the second it browns; burnt butter is bitter.", "n": 5, "section": null, "text": "Wipe out the pan. Add the butter over medium heat, swirl until it foams and the solids turn golden-brown and smell nutty, 2–3 min.", "time": "2–3 min", "type": "active heat", "type_source": "guess", "uses": ["Butter sauce (base)::3 Tbsp unsalted butter"]}, {"combine": {"heat": "off", "inputs": [{"cat": "fat", "label": "Browned butter"}, {"cat": "wet", "label": "Vinegar (A) or tomato paste (B)"}, {"cat": "wet", "label": "Capers or loosening liquid"}, {"cat": "aromatic", "label": "Parsley"}], "result": "Pan sauce", "vessel": "Same skillet"}, "n": 6, "section": null, "text": "**Option A:** off heat, stir in the vinegar (it sizzles), then capers if using. Season, finish with parsley.\n**Option B (instead of A):** stir the tomato paste into the hot butter, cook 30–60 sec until darker and sweet-smelling, not raw. Loosen with the vinegar/wine/water, season, finish with parsley.", "time": "~2 min", "type": "active heat", "type_source": "guess", "uses": ["Option A — vinegar::1 Tbsp vinegar (sherry, red wine, or white wine)", "Option A — vinegar::1 tsp capers, drained (optional)", "Option A — vinegar::1 Tbsp chopped parsley (optional)", "Option B — tomato::1 Tbsp tomato paste", "Option B — tomato::1 Tbsp vinegar, wine, or water, to loosen", "Option B — tomato::1 Tbsp chopped parsley (optional)"]}, {"n": 7, "section": null, "text": "Pour the sauce over the fish immediately and serve.", "time": "~1 min", "type": "prep", "type_source": "guess"}], "times_cooked": 1, "title": "Pan-Seared Skate Wing (butter pan sauce, two variations)", "total_minutes": 20, "total_time": "20 min", "updated": "2026-10-12", "variations": "- Pick one sauce path, not both. They're alternatives off the same browned butter.\n- If you have lemon, capers, a shallot, or white wine, the classic version drops straight into Option A.", "version": 6}, "radicchio-endive-anchovy-salad": {"active_time": "15 min (source: 10 min prep + 5 min cook)", "changes": "", "cook_notes": [{"applied": 1, "date": "2026-10-17", "follow_ups": [{"a": "just one off but this recipe is pretty good without croutons directly in the salad", "date": "2026-10-17", "q": "Should 'skip the crumbs and serve broiled cheesy toast on the side' be added as a variation, or was it just a one-off?"}], "heading": "2026-10-17 — cook 1", "logged_from": "page", "reviewed": "2026-10-17", "text": "skipped the croutons this time; had fresh bread and broiled to make cheesy toast sides"}], "cook_notes_placeholder": "", "cuisine": "Italian-American (New York pizzeria-style)", "date_added": "2026-10-17", "extra_front_matter": {}, "filename": "", "first_cooked": "2026-10-17", "icon": "salad", "ingredient_groups": [{"items": ["1 Tbsp (15 ml) extra-virgin olive oil", "3 Tbsp panko-style bread crumbs", "Kosher salt, to season the crumbs — source gives no amount"], "name": "Toasted bread crumbs"}, {"items": ["1 medium clove garlic", "1 small shallot (about 1½ oz, 42 g), sliced", "4 oil-packed anchovy fillets — to taste; start with fewer and add (see Notes)", "1 Tbsp (15 ml) fresh lemon juice, from half a lemon", "1 Tbsp (15 ml) sherry vinegar", "1 tsp (5 ml) Dijon mustard", "5 Tbsp (75 ml) extra-virgin olive oil"], "name": "Anchovy vinaigrette"}, {"items": ["1 stalk celery (about 4 oz, 115 g), peeled and sliced thinly on a bias", "1 small fennel bulb (about 8 oz, 225 g), trimmed, cored and sliced thinly", "1 head radicchio (about 8 oz, 225 g), leaves separated, large ones torn into 3\" pieces, small ones left whole, rinsed and spun dry", "2 Belgian endive (about 8 oz, 225 g), leaves separated and cut crosswise into 1\" pieces, rinsed and spun dry", "Handful of flat-leaf parsley leaves (about ½ oz, 14 g), rinsed and spun dry", "Kosher salt, for the greens — source gives no amount", "2 Tbsp (30 ml) fresh lemon juice, from 1 lemon — for the greens; you may not need all of it", "2 Tbsp (30 ml) extra-virgin olive oil — for the greens; you may not need all of it"], "name": "Salad"}, {"items": ["2 oz (57 g) Parmigiano-Reggiano, shaved", "Flaky salt, such as Maldon, for garnish"], "name": "For serving"}, {"items": ["Immersion blender (or a blender)", "Large mixing bowl", "Small nonstick skillet", "Paper towel–lined plate", "Serving bowl"], "name": "Equipment"}], "intro": "A chicory salad built in layers. Thinly sliced fennel and celery sit at the bottom, heavily dressed in a blended anchovy vinaigrette. Radicchio, endive and parsley dressed only with lemon and oil go on top, with toasted panko, flaky salt and shaved Parmigiano between the layers and over the last one.\n\nModeled on a salad at Una Pizza Napoletana in New York. The anchovy is meant to be loud: salty, savory and a little funky, which keeps the bitter greens in check and brings out the fennel's sweetness.", "last_cooked": "2026-10-17", "method": "stovetop crumbs, blender vinaigrette, layered cold salad", "notes": "- The anchovy count is to taste and depends on the brand. Higher-quality anchovies tend to be less aggressively salty. The source says it should taste strongly of anchovy; start conservatively and add.\n- The vinaigrette goes only on the fennel and celery at the bottom. The greens get just lemon and oil, which keeps them light instead of weighed down.\n- Two layers of dressed greens at most. A forkful should have crumbs, cheese and salt sandwiched between two layers of greens.\n- Source's own words on the recipe: the quantities and vegetables are suggestions; it's more a salad idea than a recipe.\n- Source nutrition, per serving: 280 calories, 24 g fat, 12 g carbs, 6 g protein.\n- Step times are my estimates apart from the 3-min toast, so they run a few minutes over the source's 15-min total.\n- **Gap:** no salt amounts for the crumbs or the greens.\n- **Gap:** how the greens, crumbs, cheese and flaky salt split between the two layers isn't given.\n- **Gap:** no size for the serving bowl, only \"a serving bowl\".\n- **Gap:** nothing on how far ahead the crumbs or the vinaigrette can be made.\n- Step types (prep, waiting, active heat) are my guesses; the source has none.", "omitted": "- Nothing — single source, taken whole.", "protein": "none — vegetable side", "protein_group": "none", "scaling": {"base_high": 6, "base_low": 4, "enabled": true, "note": "The source calls its quantities suggestions; the structure is what matters. Anchovy-dressed crisp vegetables on the bottom, two layers of lightly dressed greens above, crumbs, cheese and flaky salt between and on top. No more than two layers of dressed greens.", "unit": "servings"}, "section": "sides", "serves": "4 to 6", "side_type": "vegetable", "slug": "radicchio-endive-anchovy-salad", "source": "Sho Spaeth, \"Radicchio, Endive, and Anchovy Salad\", Serious Eats, updated 2025-03-03, first published February 2019 — https://www.seriouseats.com/radicchio-endive-and-anchovy-salad. Loaded from a PDF of the page.", "source_comparison": "", "steps": [{"cue": "Toasting now keeps the crumbs crisp even after the salad is dressed.", "n": 1, "section": "Toasted bread crumbs", "text": "Heat 1 Tbsp oil in a small nonstick skillet over medium. Add the panko and toast, stirring often, until golden brown.", "time": "3 min", "timer_min": 3, "type": "active heat", "type_source": "guess", "uses": ["Toasted bread crumbs::1 Tbsp (15 ml) extra-virgin olive oil", "Toasted bread crumbs::3 Tbsp panko-style bread crumbs", "Equipment::Small nonstick skillet"]}, {"n": 2, "section": "Toasted bread crumbs", "text": "Move the crumbs to a paper towel–lined plate and season with salt.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Toasted bread crumbs::Kosher salt, to season the crumbs — source gives no amount", "Equipment::Paper towel–lined plate"]}, {"combine": {"heat": "none", "inputs": [{"cat": "aromatic", "label": "Garlic"}, {"cat": "aromatic", "label": "Shallot"}, {"cat": "protein", "label": "Anchovies"}, {"cat": "wet", "label": "Lemon juice"}, {"cat": "wet", "label": "Sherry vinegar"}, {"cat": "aromatic", "label": "Dijon"}, {"cat": "fat", "label": "Olive oil"}], "result": "Vinaigrette, unblended", "vessel": "Blender cup"}, "n": 3, "section": "Anchovy vinaigrette", "text": "Put the garlic, shallot, anchovies, lemon juice, vinegar, mustard and oil in the cup of an immersion blender (or a blender canister).", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Anchovy vinaigrette::1 medium clove garlic", "Anchovy vinaigrette::1 small shallot (about 1½ oz, 42 g), sliced", "Anchovy vinaigrette::4 oil-packed anchovy fillets — to taste; start with fewer and add (see Notes)", "Anchovy vinaigrette::1 Tbsp (15 ml) fresh lemon juice, from half a lemon", "Anchovy vinaigrette::1 Tbsp (15 ml) sherry vinegar", "Anchovy vinaigrette::1 tsp (5 ml) Dijon mustard", "Anchovy vinaigrette::5 Tbsp (75 ml) extra-virgin olive oil", "Equipment::Immersion blender (or a blender)"]}, {"cue": "Anchovies vary in saltiness. Taste, and if you want more, drop in another fillet and blend again.", "n": 4, "section": "Anchovy vinaigrette", "text": "Blend until it forms a smooth, creamy emulsion. Set aside.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Equipment::Immersion blender (or a blender)"]}, {"n": 5, "section": "Salad", "text": "Peel the celery and slice it thinly on a bias. Trim, core and thinly slice the fennel.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Salad::1 stalk celery (about 4 oz, 115 g), peeled and sliced thinly on a bias", "Salad::1 small fennel bulb (about 8 oz, 225 g), trimmed, cored and sliced thinly"]}, {"n": 6, "section": "Salad", "text": "Separate the radicchio leaves, tearing large ones into 3\" pieces and leaving small ones whole. Cut the endive leaves crosswise into 1\" pieces. Rinse and spin dry along with the parsley.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Salad::1 head radicchio (about 8 oz, 225 g), leaves separated, large ones torn into 3\" pieces, small ones left whole, rinsed and spun dry", "Salad::2 Belgian endive (about 8 oz, 225 g), leaves separated and cut crosswise into 1\" pieces, rinsed and spun dry", "Salad::Handful of flat-leaf parsley leaves (about ½ oz, 14 g), rinsed and spun dry"]}, {"combine": {"heat": "none", "inputs": [{"cat": "aromatic", "label": "Celery"}, {"cat": "aromatic", "label": "Fennel"}, {"cat": "wet", "label": "Anchovy vinaigrette"}], "result": "Overdressed crisp base", "vessel": "Serving bowl"}, "cue": "They will look overdressed. That's the goal. Optional: spoon a line of vinaigrette around the inside of the bowl first.", "n": 7, "section": "Salad", "text": "In the serving bowl, toss the celery and fennel with all of the vinaigrette until thoroughly coated.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Salad::1 stalk celery (about 4 oz, 115 g), peeled and sliced thinly on a bias", "Salad::1 small fennel bulb (about 8 oz, 225 g), trimmed, cored and sliced thinly", "Equipment::Serving bowl"]}, {"combine": {"heat": "none", "inputs": [{"cat": "aromatic", "label": "Radicchio"}, {"cat": "aromatic", "label": "Endive"}, {"cat": "aromatic", "label": "Parsley"}, {"cat": "dry", "label": "Salt"}], "result": "Seasoned greens", "vessel": "Large mixing bowl"}, "n": 8, "section": "Salad", "text": "In a large mixing bowl, combine the radicchio, endive and parsley. Season with salt and toss to distribute evenly.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Salad::1 head radicchio (about 8 oz, 225 g), leaves separated, large ones torn into 3\" pieces, small ones left whole, rinsed and spun dry", "Salad::2 Belgian endive (about 8 oz, 225 g), leaves separated and cut crosswise into 1\" pieces, rinsed and spun dry", "Salad::Handful of flat-leaf parsley leaves (about ½ oz, 14 g), rinsed and spun dry", "Salad::Kosher salt, for the greens — source gives no amount", "Equipment::Large mixing bowl"]}, {"cue": "You may not need all the lemon juice and oil.", "n": 9, "section": "Salad", "text": "Add the lemon juice and oil a little at a time, tossing, until the leaves are well dressed but not dripping.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Salad::2 Tbsp (30 ml) fresh lemon juice, from 1 lemon — for the greens; you may not need all of it", "Salad::2 Tbsp (30 ml) extra-virgin olive oil — for the greens; you may not need all of it"]}, {"combine": {"heat": "none", "inputs": [{"cat": "aromatic", "label": "Dressed greens"}, {"cat": "dry", "label": "Flaky salt"}, {"cat": "dry", "label": "Toasted crumbs"}, {"cat": "fat", "label": "Parmigiano"}], "result": "First layer", "vessel": "Serving bowl, over the celery and fennel"}, "n": 10, "section": "Salad", "text": "Lay an even layer of the dressed greens over the celery and fennel. Sprinkle with flaky salt, some of the toasted crumbs and some of the cheese.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["For serving::2 oz (57 g) Parmigiano-Reggiano, shaved", "For serving::Flaky salt, such as Maldon, for garnish"]}, {"cue": "Extra layers throw off the balance.", "n": 11, "section": "Salad", "text": "Repeat: a second even layer of dressed greens, then the rest of the flaky salt, crumbs and cheese on top. Don't add any more layers.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["For serving::2 oz (57 g) Parmigiano-Reggiano, shaved", "For serving::Flaky salt, such as Maldon, for garnish"]}, {"cue": "Each forkful should have crumbs, cheese and salt between two layers of greens, plus a few bits of fennel and celery.", "n": 12, "section": "Salad", "text": "Serve immediately.", "time": "~1 min", "type": "prep", "type_source": "guess"}], "times_cooked": 1, "title": "Radicchio, Endive, and Anchovy Salad", "total_minutes": 15, "total_time": "15 min", "updated": "2026-10-17", "variations": "- **Other chicories**: Trevisano or another radicchio; frisée in place of the endive; or a mix of all of them.\n- **Herbs**: skip the parsley, or double the parsley leaves for a more herbal, bitter edge. Celery leaves would be a nice addition.\n- **Fewer anchovies**: one fillet, or none, if you don't like them. The source says the strong anchovy push is the point of the salad.\n- **Bread crumbs**: homemade works. They need real crunch, so no fine bread dust.\n- **No crumbs**: leave the toasted bread crumbs out of the salad; it's still pretty good without them.", "version": 3}, "steel-cut-oatmeal": {"active_time": "source: 10 min prep + 35 min cook", "changes": "Method is Alton Brown's Food Network recipe (toast in butter, then boiling water); ratios are from Bob's Red Mill's bag instructions. Both pages as loaded 2026-10-12.\n- **Whole milk dropped.** Alton stirs in ½ cup whole milk with half the buttermilk; it's out here.\n- **Check at about 10 min.** Alton says simmer 25 min without stirring and gives no check; this one is mine, split out as its own step.\n- **Finish by doneness.** Alton's last 10 min is tied to the milk and buttermilk. Here it's cook a bit longer to drive off excess water, and stop if the oats are already done.\n- **Rest partially covered.** Bob's rests the pot covered a couple of minutes; Alton doesn't rest it. Partially covered is my change.\n- **Salt at the end.** Alton has none; Bob's salts the water. Here a bit goes in at the end.\n- **Buttermilk, brown sugar, cinnamon optional.** Alton lists all three as required.\n- **Ratios.** From Bob's: 1 cup oats to 3 cups water at 4 servings (Alton's is the same). The 2 and 3 serving amounts are mine.\n- **Steps split.** Alton's 2 steps are 8 here, one action each, with the water boil as its own step since the source starts from boiling water.", "cook_notes": [], "cuisine": "American", "date_added": "2026-10-12", "extra_front_matter": {}, "filename": "", "first_cooked": "before 2026-10-12 (date not recorded)", "icon": "whe
