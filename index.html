<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Recipe Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-head:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --bg:#F1ECDF; --card:#FAF7EE; --surface-2:#E8E2D3; --border:#D8D1BF;
  --text:#1D1C18; --muted:#5C584D; --placeholder:#69655A;
  --accent:#23493C; --accent-press:#183429; --on-accent:#F5F8F4; --accent-ink:#23493C;
  --link:#1E5A73; --focus:#2D6B57;
  --prep:#435E14; --prep-soft:#E3EBD2; --prep-edge:#B7C997;
  --wait:#2A4F8F; --wait-soft:#DCE5F4; --wait-edge:#A9BEE3;
  --heat:#A8360C; --heat-soft:#F7E0D4; --heat-edge:#E6B39B;
  --done:#17663E; --done-soft:#D8EFE2; --done-edge:#9CD1B3;
  --err:#A3241C; --err-soft:#F8E1DE; --err-edge:#E3A8A2;
  --scrim:rgba(20,28,24,.45);
  --bar:var(--card);
  --sec-breakfast-bg:#F8E1CC; --sec-breakfast-fg:#7A3A12;
  --sec-dinner-bg:#DDEBE4; --sec-dinner-fg:#234B3D;
  --sec-sides-bg:#F1E7C8; --sec-sides-fg:#6E5208;
  --sec-desserts-bg:#F2DFE9; --sec-desserts-fg:#6B2F52;
  --sec-coffee-bg:#EADDD2; --sec-coffee-fg:#58392A;
  --acc-breakfast:#A84E14; --accp-breakfast:#8A3F0E; --ink-breakfast:#7A3A12;
  --acc-dinner:#23493C; --accp-dinner:#183429; --ink-dinner:#23493C;
  --acc-sides:#7A5B0A; --accp-sides:#614708; --ink-sides:#6E5208;
  --acc-desserts:#7B3A60; --accp-desserts:#622D4C; --ink-desserts:#6B2F52;
  --acc-coffee:#6B4631; --accp-coffee:#553725; --ink-coffee:#58392A;
  --tint-breakfast:#F3D2B4; --tint-dinner:#CFE3D6; --tint-sides:#EBDDA8; --tint-desserts:#E0C9E5; --tint-coffee:#DCCAB8;
  --tint:var(--sec-dinner-bg); --tint-fg:var(--sec-dinner-fg);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#111111; --surface-2:#1A1A1A; --border:#2A2A2A;
  --text:#F2F2F2; --muted:#A0A0A0; --placeholder:#8A8A8A;
  --accent:#3E7A63; --accent-press:#4C8E75; --on-accent:#F5F8F4; --accent-ink:#9CD3BB;
  --link:#8EC7DF; --focus:#6FB89B;
  --prep:#B9D184; --prep-soft:#252F19; --prep-edge:#45562A;
  --wait:#A6BFEC; --wait-soft:#1B2638; --wait-edge:#334A70;
  --heat:#F3A986; --heat-soft:#3A1E12; --heat-edge:#6A3622;
  --done:#6CD69C; --done-soft:#15301F; --done-edge:#2B5A3E;
  --err:#F2A69F; --err-soft:#3A1614; --err-edge:#6B2E29;
  --scrim:rgba(0,0,0,.6);
  --bar:var(--bg);
  --sec-breakfast-bg:#33200F; --sec-breakfast-fg:#F0A872;
  --sec-dinner-bg:#1C2E27; --sec-dinner-fg:#8FD0B6;
  --sec-sides-bg:#2E2810; --sec-sides-fg:#E3C676;
  --sec-desserts-bg:#34202B; --sec-desserts-fg:#E8A9CB;
  --sec-coffee-bg:#2D2119; --sec-coffee-fg:#D9B293;
  --acc-breakfast:#9A5A22; --accp-breakfast:#AC6A2E; --ink-breakfast:#F0B785;
  --acc-dinner:#3E7A63; --accp-dinner:#4C8E75; --ink-dinner:#9CD3BB;
  --acc-sides:#8A6A12; --accp-sides:#9C7A18; --ink-sides:#E3C676;
  --acc-desserts:#8F4A74; --accp-desserts:#A05A85; --ink-desserts:#E8A9CB;
  --acc-coffee:#7A5640; --accp-coffee:#8C654D; --ink-coffee:#D9B293;
  --tint-breakfast:#3B2515; --tint-dinner:#1F3A2E; --tint-sides:#3A3016; --tint-desserts:#3B2250; --tint-coffee:#3B2A1D;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111111; --surface-2:#1A1A1A; --border:#2A2A2A;
  --text:#F2F2F2; --muted:#A0A0A0; --placeholder:#8A8A8A;
  --accent:#3E7A63; --accent-press:#4C8E75; --on-accent:#F5F8F4; --accent-ink:#9CD3BB;
  --link:#8EC7DF; --focus:#6FB89B;
  --prep:#B9D184; --prep-soft:#252F19; --prep-edge:#45562A;
  --wait:#A6BFEC; --wait-soft:#1B2638; --wait-edge:#334A70;
  --heat:#F3A986; --heat-soft:#3A1E12; --heat-edge:#6A3622;
  --done:#6CD69C; --done-soft:#15301F; --done-edge:#2B5A3E;
  --err:#F2A69F; --err-soft:#3A1614; --err-edge:#6B2E29;
  --scrim:rgba(0,0,0,.6);
  --bar:var(--bg);
  --sec-breakfast-bg:#33200F; --sec-breakfast-fg:#F0A872;
  --sec-dinner-bg:#1C2E27; --sec-dinner-fg:#8FD0B6;
  --sec-sides-bg:#2E2810; --sec-sides-fg:#E3C676;
  --sec-desserts-bg:#34202B; --sec-desserts-fg:#E8A9CB;
  --sec-coffee-bg:#2D2119; --sec-coffee-fg:#D9B293;
  --acc-breakfast:#9A5A22; --accp-breakfast:#AC6A2E; --ink-breakfast:#F0B785;
  --acc-dinner:#3E7A63; --accp-dinner:#4C8E75; --ink-dinner:#9CD3BB;
  --acc-sides:#8A6A12; --accp-sides:#9C7A18; --ink-sides:#E3C676;
  --acc-desserts:#8F4A74; --accp-desserts:#A05A85; --ink-desserts:#E8A9CB;
  --acc-coffee:#7A5640; --accp-coffee:#8C654D; --ink-coffee:#D9B293;
  --tint-breakfast:#3B2515; --tint-dinner:#1F3A2E; --tint-sides:#3A3016; --tint-desserts:#3B2250; --tint-coffee:#3B2A1D;
}
:root{ color-scheme:light dark; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
a{ color:var(--link); }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:820px; margin:0 auto; padding:14px 16px 64px; }
h1,h2,h3{ font-family:var(--font-head); margin:0; letter-spacing:-.01em; }
.head{ display:flex; align-items:flex-start; gap:12px; padding:6px 0 14px; }
.head h1{ font-size:26px; font-weight:700; line-height:1.1; }
.head h1 a{ color:inherit; text-decoration:none; }
.head .upd{ font-size:13px; color:var(--muted); margin-top:3px; }
.head .sp{ flex:1; }
.tbtn{ min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font:600 15px/1 var(--font-body); cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.tbtn svg{ width:18px; height:18px; }
.tbtn:hover{ border-color:var(--accent); }
.tbtn.icon{ width:44px; padding:0; justify-content:center; }
.hbtns{ display:flex; gap:8px; align-items:center; }
@media (max-width:420px){ .tbtn .lbl{ display:none; } .tbtn{ padding:0 12px; } .tbtn.icon{ padding:0; } }
.ti-sun{ display:none; } .ti-moon{ display:inline-flex; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ti-sun{ display:inline-flex; } :root:not([data-theme="light"]) .ti-moon{ display:none; } }
:root[data-theme="dark"] .ti-sun{ display:inline-flex; } :root[data-theme="dark"] .ti-moon{ display:none; }
:root[data-theme="light"] .ti-sun{ display:none; } :root[data-theme="light"] .ti-moon{ display:inline-flex; }
:root[data-theme="dark"]{ color-scheme:dark; } :root[data-theme="light"]{ color-scheme:light; }
.rico{ flex:0 0 auto; width:38px; height:38px; border-radius:11px; background:var(--sb); color:var(--sf); display:inline-flex; align-items:center; justify-content:center; }
.rico svg{ width:21px; height:21px; }
.rico.sm{ width:32px; height:32px; border-radius:9px; } .rico.sm svg{ width:18px; height:18px; }
.rico.big{ width:46px; height:46px; border-radius:13px; } .rico.big svg{ width:26px; height:26px; }
.rc-top h3{ flex:1; min-width:0; }
.rtitle{ display:flex; align-items:center; gap:12px; }
.gtop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.gtop .ch{ margin:0; }
.gsel{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.gsel select{ height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:0 8px; font:400 15px var(--font-body); }
.gh{ display:flex; align-items:baseline; gap:8px; margin:16px 0 8px; }
.gh h3{ font-size:17px; }
.gh span{ font-size:13px; color:var(--muted); }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:340px){ .tiles{ grid-template-columns:1fr; } }
.tile{ position:relative; overflow:hidden; text-align:center; width:100%; min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:18px 12px; border-radius:20px; border:1px solid rgba(127,127,127,.28); background:var(--sb); color:var(--text); font:inherit; cursor:pointer; }
.tile:hover{ border-color:var(--sf); }
.s-breakfast{ --sb:var(--tint-breakfast); --sf:var(--sec-breakfast-fg); --tint:var(--tint-breakfast); --tint-fg:var(--sec-breakfast-fg); --accent:var(--acc-breakfast); --accent-press:var(--accp-breakfast); --accent-ink:var(--ink-breakfast); }
.s-dinner{ --sb:var(--tint-dinner); --sf:var(--sec-dinner-fg); --tint:var(--tint-dinner); --tint-fg:var(--sec-dinner-fg); --accent:var(--acc-dinner); --accent-press:var(--accp-dinner); --accent-ink:var(--ink-dinner); }
.s-sides{ --sb:var(--tint-sides); --sf:var(--sec-sides-fg); --tint:var(--tint-sides); --tint-fg:var(--sec-sides-fg); --accent:var(--acc-sides); --accent-press:var(--accp-sides); --accent-ink:var(--ink-sides); }
.s-desserts{ --sb:var(--tint-desserts); --sf:var(--sec-desserts-fg); --tint:var(--tint-desserts); --tint-fg:var(--sec-desserts-fg); --accent:var(--acc-desserts); --accent-press:var(--accp-desserts); --accent-ink:var(--ink-desserts); }
.s-coffee{ --sb:var(--tint-coffee); --sf:var(--sec-coffee-fg); --tint:var(--tint-coffee); --tint-fg:var(--sec-coffee-fg); --accent:var(--acc-coffee); --accent-press:var(--accp-coffee); --accent-ink:var(--ink-coffee); }
/* section pages: a tinted page in the section's colour (set on <html>); screens without a section stay white or black */
:root.th-breakfast{ --bg:#FBEBDC; --card:#FDF3E8; --surface-2:#F4DCC4; --border:#E6C2A0; }
:root.th-dinner{ --bg:#E3EFE7; --card:#F0F7F2; --surface-2:#D4E5DA; --border:#B9D2C2; }
:root.th-sides{ --bg:#F7EDCB; --card:#FBF4DC; --surface-2:#EEDFAE; --border:#DCC98C; }
:root.th-desserts{ --bg:#EFE2F1; --card:#F6EDF8; --surface-2:#E2CDE6; --border:#CDB0D4; }
:root.th-coffee{ --bg:#EDE2D6; --card:#F4ECE3; --surface-2:#E0D0BF; --border:#CDB8A2; }
@media (prefers-color-scheme:dark){
  :root.th-breakfast:not([data-theme="light"]){ --bg:#000000; --card:#261A0E; --surface-2:#301F10; --border:#4F3519; }
  :root.th-dinner:not([data-theme="light"]){ --bg:#000000; --card:#15241D; --surface-2:#1B2E25; --border:#2B4538; }
  :root.th-sides:not([data-theme="light"]){ --bg:#000000; --card:#241E0F; --surface-2:#2E2713; --border:#4A3F1E; }
  :root.th-desserts:not([data-theme="light"]){ --bg:#000000; --card:#251634; --surface-2:#2E1B40; --border:#47295F; }
  :root.th-coffee:not([data-theme="light"]){ --bg:#000000; --card:#251A12; --surface-2:#2F2217; --border:#4A3424; }
}
:root[data-theme="dark"].th-breakfast{ --bg:#000000; --card:#261A0E; --surface-2:#301F10; --border:#4F3519; }
:root[data-theme="dark"].th-dinner{ --bg:#000000; --card:#15241D; --surface-2:#1B2E25; --border:#2B4538; }
:root[data-theme="dark"].th-sides{ --bg:#000000; --card:#241E0F; --surface-2:#2E2713; --border:#4A3F1E; }
:root[data-theme="dark"].th-desserts{ --bg:#000000; --card:#251634; --surface-2:#2E1B40; --border:#47295F; }
:root[data-theme="dark"].th-coffee{ --bg:#000000; --card:#251A12; --surface-2:#2F2217; --border:#4A3424; }
.s-unsorted{ --sb:var(--surface-2); --sf:var(--muted); }
.tile .bub{ width:92px; height:92px; border-radius:50%; background:var(--card); color:var(--sf); display:flex; align-items:center; justify-content:center; border:1px solid rgba(127,127,127,.28); }
.tile .bub svg{ width:50px; height:50px; stroke-width:1.7; }
.tile h3{ font-size:22px; margin-top:6px; line-height:1.1; }
.tile .cnt{ font-size:14px; }
.tile .cnt b{ font:700 22px var(--font-head); margin-right:4px; font-variant-numeric:tabular-nums; }
.tabs{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); margin-bottom:14px; }
.tab{ border:0; background:none; padding:10px 12px; white-space:nowrap; font:600 15px/1.2 var(--font-body); color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; }
.tab[aria-selected="true"]{ color:var(--accent-ink); border-bottom-color:var(--accent); }
.tab .n{ font-weight:500; color:var(--muted); margin-left:4px; font-variant-numeric:tabular-nums; }
.status{ padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:15px; margin-bottom:12px; }
.status.err{ border-color:var(--err-edge); background:var(--err-soft); color:var(--err); }
.status.ok{ border-color:var(--done-edge); background:var(--done-soft); color:var(--done); }
/* controls */
.search{ width:100%; height:46px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:0 14px; font:400 16px var(--font-body); }
.search::placeholder, textarea::placeholder{ color:var(--placeholder); }
.ctrls{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:10px 0; }
.ctrls label{ display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
.ctrls select{ height:40px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:0 8px; font:400 15px var(--font-body); }
.active{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:4px 0 12px; min-height:8px; }
.fchip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; color:var(--text); cursor:pointer; }
.clear{ border:0; background:none; color:var(--link); font:600 14px var(--font-body); cursor:pointer; padding:4px 6px; }
.count{ font-size:13px; color:var(--muted); margin-bottom:8px; }
/* cards */
.grid{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:600px){ .grid{ grid-template-columns:1fr 1fr; } }
.rcard{ text-align:left; width:100%; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:14px; padding:14px 15px; cursor:pointer; font:inherit; display:flex; flex-direction:column; gap:8px; }
.rcard:hover{ border-color:var(--accent); }
.rcard h3{ font-size:19px; font-weight:700; line-height:1.2; }
.rc-top{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
.never{ flex:0 0 auto; font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; border:1px dashed var(--muted); color:var(--muted); white-space:nowrap; }
.rc-tags{ display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:var(--muted); }
.rc-tags > span{ display:inline-flex; align-items:center; gap:5px; line-height:1.35; background:var(--surface-2); padding:2px 8px; border-radius:6px; }
.facts{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; font-size:14px; }
.facts dt{ color:var(--muted); }
.facts dd{ margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.empty{ padding:28px 16px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:14px; }
/* recipe page */
.back{ display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 18px 0 12px; margin:2px 0 10px; border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--text); font:600 15px var(--font-body); cursor:pointer; }
.back:hover{ border-color:var(--accent); }
.hbtns .back{ margin:0; padding:0 14px 0 10px; white-space:nowrap; }
.head.compact{ align-items:center; }
.head.compact h1{ font-size:20px; white-space:nowrap; }
.head.compact .upd{ display:none; }
@media (max-width:420px){ .head.compact h1{ font-size:18px; } .hbtns{ gap:6px; } }
.rtitle{ font-size:30px; font-weight:700; line-height:1.12; margin:4px 0 8px; }
.intro{ color:var(--text); margin:0 0 12px; }
.intro p{ margin:0 0 8px; }
.kf{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:12px 0; }
.kf div{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
.kf dt{ font-size:12px; color:var(--muted); }
.kf dd{ margin:2px 0 0; font-size:14px; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; }
.btn{ height:52px; padding:0 20px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--text); font:600 16px var(--font-body); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); flex:1 1 220px; font-size:18px; }
.btn-primary:hover{ background:var(--accent-press); }
.btn:disabled{ opacity:.45; cursor:default; }
section.blk{ margin-top:22px; }
section.blk > h2{ font-size:20px; font-weight:700; margin-bottom:8px; }
.ig h3{ font-size:15px; font-family:var(--font-body); font-weight:700; margin:12px 0 4px; }
.ig ul{ margin:0; padding-left:20px; }
.ig li{ margin:3px 0; }
.q{ font-weight:700; font-variant-numeric:tabular-nums; }
.steps{ list-style:none; padding:0; margin:0; }
.steps li{ display:grid; grid-template-columns:30px 1fr; gap:4px 10px; padding:10px 0; border-bottom:1px solid var(--border); }
.steps .num{ font:700 18px/1.3 var(--font-head); color:var(--muted); text-align:right; }
.steps .stx p{ margin:4px 0 0; }
.sect{ font:700 14px var(--font-body); color:var(--muted); margin:14px 0 0; }
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid; }
.badge svg{ width:14px; height:14px; }
.t-prep{ color:var(--prep); background:var(--prep-soft); border-color:var(--prep-edge); }
.t-waiting{ color:var(--wait); background:var(--wait-soft); border-color:var(--wait-edge); }
.t-heat{ color:var(--heat); background:var(--heat-soft); border-color:var(--heat-edge); }
.cue{ border-left:3px solid var(--border); padding:2px 0 2px 10px; color:var(--muted); font-size:14px; margin-top:6px; }
details.sec{ border:1px solid var(--border); border-radius:12px; background:var(--card); margin-top:10px; }
details.sec > summary{ cursor:pointer; padding:12px 14px; font:700 16px var(--font-head); list-style:none; display:flex; justify-content:space-between; align-items:center; }
details.sec > summary::after{ content:"+"; color:var(--muted); font-weight:500; }
details.sec[open] > summary::after{ content:"–"; }
details.sec .body{ padding:0 14px 12px; font-size:15px; color:var(--text); }
.body p{ margin:0 0 8px; }
.body ul{ margin:0 0 8px; padding-left:20px; }
.body li{ margin:3px 0; }
.body h4{ font:700 15px var(--font-body); margin:12px 0 4px; }
code{ font-size:.9em; background:var(--surface-2); padding:1px 4px; border-radius:4px; overflow-wrap:anywhere; }
.cooknote{ border-left:3px solid var(--accent); padding:4px 0 4px 12px; margin:10px 0; }

.cooknote .t{ white-space:pre-wrap; }
.src{ font-size:14px; color:var(--muted); overflow-wrap:anywhere; }
/* modal */

.sheet{ background:var(--card); color:var(--text); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; }

.sheet textarea{ min-height:120px; resize:vertical; }
.row{ display:flex; gap:8px; }
.row .btn{ flex:1; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:40; max-width:92vw; }
.sheet.rvw{ max-height:90vh; overflow-y:auto; max-width:560px; }
.rv-sum{ font-size:15px; margin:0; }
.rv-list{ display:flex; flex-direction:column; gap:8px; }
.sheet label.rv-item{ flex-direction:row; align-items:flex-start; gap:10px; border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--bg); color:var(--text); font-size:15px; cursor:pointer; }
.sheet .rv-item input{ width:22px; height:22px; flex:none; margin-top:1px; padding:0; accent-color:var(--accent); }

.rv-why{ color:var(--muted); font-size:13px; margin:2px 0 4px; }

.rv-b{ background:var(--surface-2); color:var(--muted); text-decoration:line-through; }
.rv-a{ background:var(--done-soft); border:1px solid var(--done-edge); color:var(--text); }
.rv-q{ border-left:3px solid var(--accent); padding:2px 0 2px 10px; font-size:14px; display:flex; flex-direction:column; gap:3px; }
.rv-act{ position:sticky; bottom:0; background:var(--card); padding-top:8px; display:flex; flex-direction:column; gap:8px; }

.rv-qa textarea, .rv-more textarea{ min-height:64px; }
.cfu{ font-size:14px; color:var(--muted); border-left:2px solid var(--border); padding-left:10px; margin:4px 0; }
.cmeta .nlink{ margin-left:8px; min-height:32px; }
.rvd{ font-weight:500; margin-left:8px; }
/* coffee */
.ccard{ border:1px solid var(--border); background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; }
.ccard h3{ font-size:18px; margin-bottom:6px; }
.ch{ font-size:20px; margin-bottom:8px; }
.bean{ border:1px solid var(--border); background:var(--card); border-radius:14px; padding:14px 15px; margin-bottom:12px; }
.bean h3{ font-size:20px; line-height:1.2; }
.bean .by{ color:var(--muted); font-size:14px; margin:2px 0 10px; }
.cfacts{ display:grid; grid-template-columns:minmax(90px,auto) 1fr; gap:4px 12px; margin:0 0 8px; font-size:14px; }
.cfacts dt{ color:var(--muted); }

.cfacts.mine{ background:var(--surface-2); border-radius:10px; padding:8px 10px; }
details.sub{ border-top:1px solid var(--border); padding:8px 0 2px; }

details.sub .body{ font-size:14px; padding-bottom:6px; overflow-wrap:anywhere; }
.gaps{ font-size:13px; color:var(--muted); border-left:3px solid var(--border); padding:2px 0 2px 10px; margin-top:8px; }
.ccard.setup .cfacts{ margin:0; }
/* tabbed recipe page */
.rsub{ color:var(--muted); font-size:14px; margin:2px 0 12px; }
.rtabs{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); margin:0 -16px 14px; padding:0 16px; }
.shopbar{ display:flex; align-items:center; gap:10px; min-height:48px; padding:6px 12px; border-radius:12px; background:var(--tint); color:var(--tint-fg); margin-bottom:10px; font-size:14px; }
.shopbar svg{ width:18px; height:18px; display:block; }
.shopbar .n{ flex:1; }
.shopbar .lnk{ border:0; background:none; color:inherit; font:700 14px var(--font-body); text-decoration:underline; cursor:pointer; min-height:40px; padding:0 6px; }
.isec{ border:1px solid var(--border); border-radius:14px; background:var(--card); margin-bottom:10px; overflow:hidden; }
.isec > summary{ list-style:none; display:flex; align-items:center; gap:8px; padding:6px 12px; min-height:52px; cursor:pointer; font-weight:600; }
.isec > summary::-webkit-details-marker{ display:none; }
.isec .chev{ display:flex; color:var(--muted); transition:transform .15s; }
.isec .chev svg{ width:18px; height:18px; }
.isec:not([open]) .chev{ transform:rotate(-90deg); }
.isec .cnt{ color:var(--muted); font-weight:400; font-size:13px; }
.secbtn{ margin-left:auto; display:inline-flex; align-items:center; gap:4px; min-height:40px; padding:0 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font:600 13px var(--font-body); cursor:pointer; }
.secbtn svg{ width:15px; height:15px; }
.secbtn.on{ background:var(--tint); color:var(--tint-fg); border-color:var(--tint-fg); }
.irow{ display:flex; align-items:center; gap:10px; padding:4px 12px; min-height:52px; border-top:1px solid var(--border); font-size:15px; }
.irow .it{ flex:1; min-width:0; }
.rowbtn{ flex:0 0 auto; width:44px; height:44px; margin-right:-8px; border:0; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.rb{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; }
.rb svg{ width:17px; height:17px; }
.rowbtn.on .rb{ background:var(--tint); border-color:var(--tint-fg); color:var(--tint-fg); }
.tapnote{ font-size:12px; color:var(--muted); }
.inote{ font-style:italic; color:var(--muted); font-size:13.5px; line-height:1.35; margin-top:2px; }
.ck-ing .inote{ font-size:14px; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:0 0 10px; }
.seg button{ min-height:40px; padding:0 14px; border:0; background:var(--card); color:var(--muted); font:600 14px var(--font-body); cursor:pointer; }
.seg button.on{ background:var(--tint); color:var(--tint-fg); }
.isec.flat .irow:first-child{ border-top:0; }
.rowbtn.part .rb{ border-color:var(--tint-fg); color:var(--tint-fg); }
.nh{ font-size:18px; margin:6px 0 6px; }
.uses{ border:1px solid var(--border); border-radius:12px; background:var(--surface-2); padding:8px 12px; margin:8px 0 6px; }
.ulab{ font:700 11.5px var(--font-body); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
.urow{ font-size:15px; padding:3px 0; }
.ugrp{ font-size:12.5px; font-weight:600; color:var(--muted); margin-top:6px; }
.flag{ display:inline-flex; align-items:center; height:1em; line-height:1; font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif; font-size:1em; vertical-align:-0.14em; }
.dur{ display:inline-flex; align-items:center; gap:4px; margin-left:8px; font:700 14px var(--font-body); vertical-align:middle; color:var(--text); }
.dur svg{ width:15px; height:15px; }
.dur.est{ color:var(--muted); font-weight:600; }
.nchips{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
.nchip{ min-height:42px; padding:0 15px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--text); font:600 14px var(--font-body); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.nchip .c{ font-weight:400; color:var(--muted); }
.nchip.on{ background:var(--tint); color:var(--tint-fg); border-color:var(--tint-fg); }
.nchip.on .c{ color:inherit; }
.nintro{ color:var(--muted); font-size:15px; margin:0 0 10px; }
.facts-row{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.fact{ border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:13px; background:var(--card); }
.ncard{ border:1px solid var(--border); border-radius:14px; background:var(--card); padding:12px 14px 6px; margin-bottom:12px; }
.nct{ display:flex; align-items:center; gap:8px; font:600 15px var(--font-body); margin-bottom:2px; }
.nct svg{ width:18px; height:18px; color:var(--tint-fg); flex:0 0 auto; }
.nrow{ display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--border); font-size:15px; }
.nct + .nrow, .nct + .nintro + .nrow{ border-top:0; }
.nrow.stack{ flex-direction:column; gap:2px; }
.nk{ flex:0 0 34%; max-width:160px; font-weight:600; }
.nrow.stack .nk{ flex:none; max-width:none; }
.nv{ flex:1; min-width:0; overflow-wrap:anywhere; }
.ncard.warn{ background:var(--sec-sides-bg); border-color:var(--sec-sides-fg); }
.ncard.warn .nct svg{ color:var(--sec-sides-fg); }
.ncard.warn .nrow{ border-top-color:rgba(127,127,127,.35); }
.ncard.warn .nct + .nrow{ border-top:0; }
.ncard .sec{ margin-bottom:6px; }
.nextup{ display:flex; gap:8px; align-items:flex-start; background:var(--tint); color:var(--tint-fg); border-radius:10px; padding:9px 11px; margin:8px 0 4px; font-size:15px; }
.nextup svg{ width:18px; height:18px; flex:0 0 auto; margin-top:2px; }
.nextup b{ display:block; font-weight:600; font-size:13px; }
.nlist .centry + .centry{ border-top:1px solid var(--border); }
.centry{ padding:8px 0; }
.cmeta{ font-size:13px; color:var(--muted); font-weight:600; }
.ctext p{ margin:3px 0 4px; font-size:15px; }
.nlink{ margin-left:auto; font:600 13px var(--font-body); color:var(--tint-fg); background:none; border:0; cursor:pointer; min-height:40px; padding:0 4px; }
details.ncard > summary{ list-style:none; cursor:pointer; min-height:36px; margin-bottom:0; }
details.ncard > summary::-webkit-details-marker{ display:none; }
details.ncard .cnt{ color:var(--muted); font-weight:400; font-size:13px; }
details.ncard .chev2{ margin-left:auto; display:flex; color:var(--muted); transition:transform .15s; }
details.ncard:not([open]) .chev2{ transform:rotate(-90deg); }
details.ncard:not([open]){ padding-bottom:12px; }
.ncard.quiet .nct, .ncard.quiet .nct svg{ color:var(--muted); }
.cbean{ display:flex; align-items:center; gap:10px; width:100%; min-height:64px; padding:10px 14px; margin-bottom:8px; border:1px solid var(--border); border-radius:14px; background:var(--card); color:var(--text); font:inherit; text-align:left; cursor:pointer; }
.cbean:hover{ border-color:var(--accent); }
.cb-t{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.cb-t b{ font-size:16px; font-weight:600; }
.cb-s{ font-size:13px; color:var(--muted); }
.cbean .sc-go{ color:var(--muted); display:flex; }
.cbean .sc-go svg{ width:20px; height:20px; }
.chipx{ border:0; background:none; color:inherit; font-size:18px; line-height:1; min-width:32px; min-height:32px; margin:-4px -8px -4px 0; cursor:pointer; }
.pill-in{ font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--done-soft); color:var(--done); border:1px solid var(--done-edge); margin-left:auto; margin-right:8px; }
/* shopping list */
.shopwrap{ padding-bottom:110px; }
.shopcard{ display:flex; align-items:center; gap:14px; width:100%; margin-top:12px; padding:14px; border-radius:18px; border:1px solid var(--border); background:var(--card); color:var(--text); font:inherit; text-align:left; cursor:pointer; }
.shopcard:hover{ border-color:var(--accent); }
.shopcard .sc-ico{ flex:0 0 auto; width:50px; height:50px; border-radius:14px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; }
.shopcard .sc-ico svg{ width:26px; height:26px; }
.shopcard .sc-t{ flex:1; min-width:0; }
.shopcard h3{ font-size:19px; }
.shopcard .sc-s{ font-size:13px; color:var(--muted); }
.shopcard .sc-go{ color:var(--muted); display:flex; }
.shopcard .sc-go svg{ width:20px; height:20px; }
.shead h2{ font-size:24px; margin:4px 0 4px; }
.shead p{ margin:0 0 12px; color:var(--muted); font-size:15px; }
.pick{ margin-bottom:8px; border:1px solid var(--border); border-radius:14px; background:var(--card); display:flex; align-items:center; }
.pick.on{ border-color:var(--accent); }
.pick.on .cbx{ background:var(--accent); border-color:var(--accent); }
.pick.on .cbx svg{ opacity:1; }
.pick .pmain{ flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:8px 12px; min-height:56px; border:0; background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer; }
.pick .pmain b{ font-weight:600; font-size:16px; }
.pstep{ display:none; align-items:center; border:1px solid var(--border); border-radius:12px; margin-right:10px; overflow:hidden; }
.pick.on .pstep{ display:inline-flex; }
.pstep button{ width:40px; height:44px; border:0; background:none; color:var(--text); font:600 20px var(--font-body); cursor:pointer; }
.pstep span{ min-width:44px; text-align:center; font-size:15px; font-variant-numeric:tabular-nums; }
.aisle{ font:700 13px var(--font-body); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
.srow{ display:flex; align-items:center; gap:12px; width:100%; min-height:58px; padding:8px 12px; margin-bottom:8px; border:1px solid var(--border); border-radius:14px; background:var(--card); color:var(--text); font:inherit; text-align:left; cursor:pointer; }
.cbx{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; color:var(--on-accent); }
.cbx svg{ width:16px; height:16px; opacity:0; }
.srow .stx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.srow .l1{ font-size:16px; overflow-wrap:anywhere; }
.srow .amt{ color:var(--muted); margin-right:4px; font-variant-numeric:tabular-nums; }
.srow .l1 b{ font-weight:600; }
.srow .rcp{ font-size:12.5px; color:var(--muted); }
.srow .hv{ display:none; font-size:12.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--done-soft); color:var(--done); border:1px solid var(--done-edge); }
.srow.have, .srow.done{ background:var(--surface-2); }
.srow.have .l1, .srow.done .l1{ text-decoration:line-through; color:var(--muted); }

.srow.have .cbx svg, .srow.done .cbx svg{ opacity:1; }
.srow.have .hv{ display:inline-block; }
.hidedone .srow.done{ display:none; }
.sprog{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
.sprog .row1{ display:flex; justify-content:space-between; align-items:baseline; font-size:15px; }
.sprog .row1 b{ font:700 22px var(--font-head); font-variant-numeric:tabular-nums; }
.sprog .bar{ margin-top:8px; }
.sctl{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.sctl .tbtn{ min-height:44px; }
.sbar{ position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--bar); border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
.sbar-in{ max-width:820px; margin:0 auto; display:flex; align-items:center; gap:10px; }
.sbar .btn{ flex:1; min-height:52px; }
.sbar .btn-primary{ flex:2; }
.sbar .ct{ font-size:14px; color:var(--muted); flex:1; font-variant-numeric:tabular-nums; }
/* cooking widget */
.cook{ position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); }
.ck-top{ padding:10px 14px 8px; border-bottom:1px solid var(--border); background:var(--bar); }
.ck-row{ display:flex; align-items:center; gap:10px; }
.ck-name{ flex:1; font:700 18px/1.2 var(--font-head); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ck-x{ width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:22px; line-height:1; cursor:pointer; }
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg); }
.stepper button{ width:44px; height:44px; border:0; background:none; color:var(--text); font:600 22px/1 var(--font-body); cursor:pointer; }
.stepper button:disabled{ opacity:.35; cursor:default; }
.stepper .v{ min-width:84px; text-align:center; font-size:14px; line-height:1.15; padding:0 4px; font-variant-numeric:tabular-nums; }
.stepper .v b{ display:block; font-size:17px; }
.ck-prog{ display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.bar{ flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.ck-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.ck-in{ max-width:640px; margin:0 auto; padding:16px 16px 24px; }
.ck-sect{ font-size:13px; color:var(--muted); font-weight:600; margin-bottom:6px; }
.chap{ display:flex; align-items:center; gap:12px; margin:24px 0 8px; padding:12px 14px; border-radius:14px; background:var(--accent); color:var(--on-accent); }
.chap-n{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:var(--on-accent); color:var(--accent); display:flex; align-items:center; justify-content:center; font:700 18px var(--font-head); }
.chap-m{ flex:1; min-width:0; }
.chap-k{ font:700 11.5px var(--font-body); letter-spacing:.06em; text-transform:uppercase; }
.chap-t{ font:700 20px/1.2 var(--font-head); overflow-wrap:anywhere; }
.chap-r{ font:600 13px var(--font-body); white-space:nowrap; }
.ck-chap{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; margin-bottom:10px; background:var(--accent); color:var(--on-accent); }
.ck-chap b{ font:700 11.5px var(--font-body); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.ck-chap span{ font:700 17px/1.2 var(--font-head); }

.ck-text p{ margin:0 0 8px; }
.ck-in .cue{ font-size:15px; }
.ck-ing h3{ font:700 15px var(--font-body); color:var(--muted); margin:14px 0 4px; }
.ck-ing ul{ list-style:none; padding:0; margin:0; }
.ck-ing li{ font-size:17px; padding:7px 0; border-bottom:1px solid var(--border); }
.scale-note{ font-size:14px; color:var(--muted); background:var(--surface-2); border-radius:10px; padding:8px 10px; margin:4px 0 10px; }
.ck-nav{ display:flex; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--bar); border-top:1px solid var(--border); }
.ck-nav .btn{ flex:1; min-height:52px; }
.ck-nav .btn-primary{ flex:2; }
.combine{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin:12px 0; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:14px; }
.chip svg, .carrow svg, .alarm svg, .tmr svg{ width:16px; height:16px; flex:0 0 auto; }
.carrow{ color:var(--muted); padding-left:10px; display:flex; }
.vessel{ background:var(--bg); }
.result{ border-style:dashed; font-weight:600; }
.tmr{ width:100%; min-height:72px; border-radius:16px; border:2px solid var(--wait-edge); background:var(--wait-soft); color:var(--wait); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; font:700 32px/1 var(--font-head); font-variant-numeric:tabular-nums; margin:12px 0; }

e, 250 g water)", "slug": "1-cup-v60-pourover", "source": "r/JamesHoffmann, \"A Better 1 Cup V60 Technique\" — https://www.reddit.com/r/JamesHoffmann/comments/z1uxzz/a_better_1_cup_v60_technique/", "source_comparison": "", "steps": [{"n": 1, "section": null, "text": "Grind 15 g coffee medium-fine into the filter. Tare the dripper and mug on the scale.", "time": "~1 min", "type": "prep", "type_source": "guess", "uses": ["Coffee and water::15 g coffee, ground medium-fine", "Equipment::Timemore Chestnut C3S Pro hand grinder — counted in clicks from fully clockwise; 13–16 is the pour-over range, higher is coarser"]}, {"n": 2, "section": null, "text": "0:00 — pour 50 g to bloom. Swirl gently 0:10–0:15. Bloom runs until 0:45.", "time": "45 sec", "timer_min": 0.75, "type": "waiting", "type_source": "guess", "uses": ["Coffee and water::250 g soft, filtered water, freshly boiled"]}, {"n": 3, "section": null, "text": "0:45–1:00 — pour up to 100 g total (40%).", "time": "15 sec", "timer_min": 0.25, "type": "active heat", "type_source": "guess"}, {"n": 4, "section": null, "text": "1:00–1:10 — pause.", "time": "10 sec", "timer_min": 0.1667, "type": "waiting", "type_source": "guess"}, {"n": 5, "section": null, "text": "1:10–1:20 — pour up to 150 g total (60%).", "time": "10 sec", "timer_min": 0.1667, "type": "active heat", "type_source": "guess"}, {"n": 6, "section": null, "text": "1:20–1:30 — pause.", "time": "10 sec", "timer_min": 0.1667, "type": "waiting", "type_source": "guess"}, {"n": 7, "section": null, "text": "1:30–1:40 — pour up to 200 g total (80%).", "time": "10 sec", "timer_min": 0.1667, "type": "active heat", "type_source": "guess"}, {"n": 8, "section": null, "text": "1:40–1:50 — pause.", "time": "10 sec", "timer_min": 0.1667, "type": "waiting", "type_source": "guess"}, {"n": 9, "section": null, "text": "1:50–2:00 — pour up to 250 g total (100%).", "time": "10 sec", "timer_min": 0.1667, "type": "active heat", "type_source": "guess"}, {"n": 10, "section": null, "text": "2:00–2:05 — swirl gently.", "time": "5 sec", "type": "active heat", "type_source": "guess"}, {"cue": "Expect variance. Taste is the judge.", "n": 11, "section": null, "text": "Drawdown should finish around 3:00.", "time": "~55 sec", "type": "waiting", "type_source": "guess"}], "times_cooked": "many (count not recorded)", "title": "1 Cup V60 Pourover", "total_minutes": 3, "total_time": "~3 min brew, drawdown finishes around 3:00", "updated": "2026-10-12", "variations": "- None recorded.", "version": 7}, "beef-stroganoff": {"active_time": "55 min (source: 10 min prep + 45 min cook)", "changes": "Compared against the Serious Eats page as updated 2025-09-26. Amounts, temperatures and times are unchanged.\n- **Steps split.** The source's 8 steps are 17 here, one action each; the noodle-water boil and gelatin bloom stay where the source puts them, at the start.\n- **Split ingredients listed by use.** Oil and paprika are listed half and half under the components that use them; the source lists each once and says \"half\" in the method.\n- **Salt and pepper made explicit.** The source lists \"kosher salt and freshly ground black pepper\" with no amount; the 1 Tbsp / 1 tsp come from its step 2.\n- **Pat dry.** From the headnotes; the source's method doesn't say it.", "cook_notes": [], "cuisine": "Russian-American", "date_added": "2026-10-12", "extra_front_matter": {}, "filename": "", "first_cooked": "not yet", "icon": "beef", "ingredient_groups": [{"items": ["4 beef tenderloin steaks, 1½–2\" thick, 6–8 oz each — see Swaps for other cuts", "1 Tbsp kosher salt", "1 tsp black pepper, freshly ground", "1 Tbsp mild paprika — half the 2 Tbsp total", "1½ Tbsp canola or vegetable oil — half the 3 Tbsp total"], "name": "Steak"}, {"items": ["1½ Tbsp canola or vegetable oil — the other half", "12 oz (340 g) button mushrooms, quartered", "8 oz (225 g) pearl onions, peeled — about 24; frozen work in a pinch", "1 Tbsp unsalted butter", "1 medium shallot, thinly sliced — about ¼ cup", "4 sprigs fresh thyme"], "name": "Mushrooms and onions"}, {"items": ["5 tsp unflavored powdered gelatin — two 0.25 oz packets", "2 cups (475 ml) low-sodium chicken stock — homemade or store-bought", "1 Tbsp mild paprika — the other half", "1 tsp soy sauce", "2 tsp Worcestershire sauce", "1 tsp fish sauce", "2 tsp Dijon mustard", "1 cup (235 ml) dry white wine", "1 cup (225 g) sour cream", "2 Tbsp unsalted butter", "Kosher salt and black pepper, to taste"], "name": "Sauce"}, {"items": ["Water, for the noodle pot — source gives no volume", "Kosher salt, for the noodle water — source gives no amount", "1 lb (455 g) dried egg noodles", "¼ cup (20 g) fresh parsley, minced — half into the noodles, half to garnish", "Sour cream, for serving — source gives no amount"], "name": "Noodles and finish"}], "intro": "Tenderloin seared whole as steaks and sliced at the table instead of cut into strips that overcook. Mushrooms quartered and browned properly, pearl onions, a white wine and umami-sauce base, and a sour cream sauce that's tempered and gelatin-backed so it can't break.", "last_cooked": "never", "method": "stovetop, one skillet plus a noodle pot", "notes": "- Gelatin plus tempering is the whole sauce trick: Kenji found gelatin alone needed about ¼ cup to survive cold sour cream hitting the pan.\n- Mushrooms need at least 10–15 min in a wide skillet on a home burner; anything much shorter leaves them pale.\n- Tenderloin is the tenderest cut and also the blandest; the sauce is built heavy to make up for it.\n- From the page's reviews, untested: one reviewer found the sauce far too salty (rub, soy, fish sauce, Worcestershire all stack); another skipped the gelatin by reducing a rich homemade beef stock.\n- **Gap:** no sear time for the steaks — temperature only, so you need an instant-read thermometer.\n- **Gap:** skillet size given only as \"large skillet or sauté pan\"; 4 thick steaks and the full vegetable load need room.\n- **Gap:** no water volume or salt amount for the noodle pot.\n- **Gap:** no time for the shallot, thyme and paprika stage in the method; the headnote says \"the last minute or so\".\n- **Gap:** no heat setting from the shallots through the heavy simmer; the source sets medium for the mushrooms and next names a heat (medium-high) for the sour cream boil.\n- **Gap:** no amount of sour cream for serving.\n- **Gap:** egg noodle shape or width not specified.", "omitted": "- Nothing — single source, taken whole.", "protein": "beef tenderloin steaks", "protein_group": "beef", "scaling": {"base": 4, "enabled": true, "unit": "servings"}, "section": "dinner", "serves": "4", "slug": "beef-stroganoff", "source": "J. Kenji López-Alt, \"The Ultimate Beef Stroganoff Recipe\", Serious Eats, updated 2025-09-26 — https://www.seriouseats.com/ultimate-beef-stroganof-recipe. Loaded from a PDF of the page (site blocked to direct fetch).", "source_comparison": "", "steps": [{"cue": "The gelatin is what keeps the sour cream sauce from breaking later.", "n": 1, "section": null, "text": "Sprinkle the gelatin over the stock in a liquid measuring cup and set aside to bloom.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Sauce::5 tsp unflavored powdered gelatin — two 0.25 oz packets", "Sauce::2 cups (475 ml) low-sodium chicken stock — homemade or store-bought"]}, {"n": 2, "section": null, "text": "Put a large pot of salted water on to boil for the noodles.", "time": "~2 min", "type": "active heat", "type_source": "guess", "uses": ["Noodles and finish::Water, for the noodle pot — source gives no volume", "Noodles and finish::Kosher salt, for the noodle water — source gives no amount"]}, {"combine": {"heat": "none", "inputs": [{"cat": "protein", "label": "Steaks"}, {"cat": "dry", "label": "Salt"}, {"cat": "aromatic", "label": "Pepper"}, {"cat": "aromatic", "label": "Paprika"}], "result": "Rubbed steaks", "vessel": "Small bowl, then board"}, "cue": "You may not need all of the rub. Dry surfaces brown; wet ones steam.", "n": 3, "section": null, "text": "Mix 1 Tbsp salt, 1 tsp pepper and 1 Tbsp paprika. Pat the steaks dry, season every side generously and press the rub on with the flat of your hand.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Steak::4 beef tenderloin steaks, 1½–2\" thick, 6–8 oz each — see Swaps for other cuts", "Steak::1 Tbsp kosher salt", "Steak::1 tsp black pepper, freshly ground", "Steak::1 Tbsp mild paprika — half the 2 Tbsp total"]}, {"cue": "Thermometer, not clock. They climb about 5°F more while resting. Lean tenderloin goes mealy past medium-rare.", "n": 4, "section": null, "text": "Heat 1½ Tbsp oil in a large skillet over high until lightly smoking. Sear the steaks, turning occasionally, until well browned and the thickest part reads 115°F for rare or 125°F for medium-rare. Move to a plate and keep the juices.", "time": "~10 min", "type": "active heat", "type_source": "guess", "uses": ["Steak::1½ Tbsp canola or vegetable oil — half the 3 Tbsp total", "Steak::4 beef tenderloin steaks, 1½–2\" thick, 6–8 oz each — see Swaps for other cuts"]}, {"cue": "The liquid lifts the browned bits off the pan. Browning only starts once it's fully evaporated.", "n": 5, "section": null, "text": "Add the remaining 1½ Tbsp oil and the mushrooms to the same pan. Medium heat, stirring and tossing often, until they've dumped their liquid and just started to brown, about 8 min.", "time": "8 min", "timer_min": 8, "type": "active heat", "type_source": "guess", "uses": ["Mushrooms and onions::1½ Tbsp canola or vegetable oil — the other half", "Mushrooms and onions::12 oz (340 g) button mushrooms, quartered"]}, {"cue": "Done mushrooms are about half their raw volume and brown — not white, not gray.", "n": 6, "section": null, "text": "Add 1 Tbsp butter and the pearl onions. Keep stirring until onions and mushrooms are softened and well browned, about 6 min more.", "time": "6 min", "timer_min": 6, "type": "active heat", "type_source": "guess", "uses": ["Mushrooms and onions::1 Tbsp unsalted butter", "Mushrooms and onions::8 oz (225 g) pearl onions, peeled — about 24; frozen work in a pinch"]}, {"combine": {"heat": "medium", "inputs": [{"cat": "aromatic", "label": "Shallot"}, {"cat": "aromatic", "label": "Thyme"}, {"cat": "aromatic", "label": "Paprika"}], "result": "Aromatic mushrooms and onions", "vessel": "Skillet"}, "cue": "About a minute — just enough to soften the shallot.", "n": 7, "section": null, "text": "Add the shallot, thyme sprigs and remaining 1 Tbsp paprika. Stir until fragrant.", "time": "~1 min", "type": "active heat", "type_source": "guess", "uses": ["Mushrooms and onions::1 medium shallot, thinly sliced — about ¼ cup", "Mushrooms and onions::4 sprigs fresh thyme", "Sauce::1 Tbsp mild paprika — the other half"]}, {"combine": {"heat": "medium", "inputs": [{"cat": "wet", "label": "Soy sauce"}, {"cat": "wet", "label": "Worcestershire"}, {"cat": "wet", "label": "Fish sauce"}, {"cat": "wet", "label": "Dijon"}], "result": "Glazed vegetables", "vessel": "Skillet"}, "n": 8, "section": null, "text": "Add the soy sauce, Worcestershire, fish sauce and mustard. Stir until mostly evaporated, about 30 sec.", "time": "30 sec", "type": "active heat", "type_source": "guess", "uses": ["Sauce::1 tsp soy sauce", "Sauce::2 tsp Worcestershire sauce", "Sauce::1 tsp fish sauce", "Sauce::2 tsp Dijon mustard"]}, {"cue": "Reduce fully before any stock goes in — that's where the wine's flavor comes from.", "n": 9, "section": null, "text": "Pour in the juices from the steak plate, then the wine. Reduce to just a few Tbsp.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Sauce::1 cup (235 ml) dry white wine"]}, {"n": 10, "section": null, "text": "Add the stock and gelatin and bring to a heavy simmer.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Sauce::2 cups (475 ml) low-sodium chicken stock — homemade or store-bought", "Sauce::5 tsp unflavored powdered gelatin — two 0.25 oz packets"]}, {"n": 11, "section": null, "text": "Carefully pour the liquid off into a heatproof measuring cup. The vegetables stay in the pan.", "time": "~2 min", "type": "prep", "type_source": "guess"}, {"cue": "This is tempering, like a custard. Cold sour cream dumped into a hot pan breaks.", "n": 12, "section": null, "text": "Put the sour cream in a medium bowl. Whisking constantly, slowly pour the hot liquid over it and whisk until completely smooth.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Sauce::1 cup (225 g) sour cream"]}, {"cue": "Tempered and gelatin-backed, it can boil without breaking.", "n": 13, "section": null, "text": "Pour the sour cream mixture back into the pan with 2 Tbsp butter. Bring to a boil over medium-high and season with salt and pepper.", "time": "~4 min", "type": "active heat", "type_source": "guess", "uses": ["Sauce::2 Tbsp unsalted butter", "Sauce::Kosher salt and black pepper, to taste"]}, {"n": 14, "section": null, "text": "Return the steaks to the pan until barely warmed through, about 1 min. Take the pan off the heat.", "time": "1 min", "timer_min": 1, "type": "active heat", "type_source": "guess", "uses": ["Steak::4 beef tenderloin steaks, 1½–2\" thick, 6–8 oz each — see Swaps for other cuts"]}, {"cue": "Package time is the clock here.", "n": 15, "section": null, "text": "Cook the noodles per the package. Scoop out 1 cup of cooking water, drain, and return the noodles to the pot.", "time": "~10 min", "type": "active heat", "type_source": "guess", "uses": ["Noodles and finish::1 lb (455 g) dried egg noodles"]}, {"combine": {"heat": "off", "inputs": [{"cat": "dry", "label": "Noodles"}, {"cat": "wet", "label": "Sauce and vegetables"}, {"cat": "wet", "label": "Pasta water"}, {"cat": "aromatic", "label": "Parsley"}], "result": "Sauced noodles", "vessel": "Noodle pot"}, "n": 16, "section": null, "text": "Move the steaks to a board. Pour the sauce, mushrooms and onions over the noodles and stir to coat, adding pasta water until loose and creamy. Stir in half the parsley.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Noodles and finish::¼ cup (20 g) fresh parsley, minced — half into the noodles, half to garnish"]}, {"cue": "Warm the bowls. Tell everyone to fish out the thyme sprigs.", "n": 17, "section": null, "text": "Slice the steaks thin. Divide the noodles among 4 hot bowls, fan the steak on top and spoon over a little extra sauce. Finish with a dollop of sour cream and the rest of the parsley.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Steak::4 beef tenderloin steaks, 1½–2\" thick, 6–8 oz each — see Swaps for other cuts", "Noodles and finish::Sour cream, for serving — source gives no amount", "Noodles and finish::¼ cup (20 g) fresh parsley, minced — half into the noodles, half to garnish"]}], "times_cooked": 0, "title": "The Ultimate Beef Stroganoff", "total_minutes": 55, "total_time": "55 min", "updated": "2026-10-12", "variations": "- **Other steak cuts**: hanger or flap meat (sold as sirloin tip in the Northeast). Cook to medium-rare, not rare.\n- **Frozen pearl onions**: fine in a pinch; fresh taste and hold up better.\n- **Peeling fresh pearl onions**: trim both ends, score a small X in one, 30 sec in boiling water, then peel under cold running water.", "version": 3}, "boiled-corn-on-the-cob": {"active_time": "5 min", "changes": "", "cook_notes": [], "cook_notes_placeholder": "_No cooks yet._", "cuisine": "American", "date_added": "2026-10-10", "extra_front_matter": {}, "filename": "boiled-corn-on-the-cob_2026-10-10_v1.md", "first_cooked": "by August 2026 (date not recorded)", "icon": "wheat", "ingredient_groups": [{"items": ["4 ears corn, shucked", "Cold water, enough to cover by about an inch — source gives no volume", "Kosher salt, to serve — source gives no amount", "Butter, to serve — source gives no amount"], "name": ""}], "intro": "Corn goes into cold water, the pot comes up to 180°F, and then the heat goes off entirely. It finishes in slowly cooling water instead of boiling, which is why it stays juicy and why the timing is forgiving.\n\nNothing about this is a boil, despite the name. 180°F is the whole recipe — hold below it and the kernels stay sweet and snapping; go past it and they turn mealy.", "last_cooked": "August 2026", "method": "stovetop, cold start to 180°F then off the heat", "notes": "- Salt goes on at the table, not in the water. The source salts at serving only.\n- Scaling changes the ear count and nothing else. 180°F and the 10–25 min stand don't move; more ears just take longer to reach temp.\n- Past roughly 8 ears you need a wider pot or a second one. That's my read, not the source's.\n- **Gap:** no ear count anywhere in the source. The base of 4 is mine.\n- **Gap:** pot size given only as \"large Dutch oven or pot\" — no diameter or capacity.\n- **Gap:** no amounts for water, salt, or butter.\n- **Gap:** no thermometer-free fallback, even though 180°F is the entire control point. Nothing in the source tells you what to look for visually at 180°F.\n- **Gap:** source doesn't say whether to cover during the heat-up. Uncovered is the reasonable read so you can watch the temperature — confirm on first cook.\n- Timing is temperature-cued, not clock-driven, right up until the stand.", "omitted": "- Nothing — single source, taken whole.", "protein": "none — vegetable side", "protein_group": "none", "scaling": {"base": 4, "enabled": false, "note": "Scaling changes the ear count and nothing else. 180°F and the 10–25 min stand don't move; more ears just take longer to reach temp.", "unit": "ears"}, "section": "sides", "serves": "source gives no count — base is 4 ears, scale by ears", "side_type": "vegetable", "slug": "boiled-corn-on-the-cob", "source": "pasted unattributed — technique matches the cold-start \"boiled\" corn method published by Serious Eats (J. Kenji López-Alt); confirm before crediting", "source_comparison": "", "steps": [{"cue": "Do the silk while it's dry — once wet it clings to the kernels and won't come away.", "n": 1, "section": null, "text": "Strip the husks and rub the silk off the ears. Snap or cut the stem ends so every ear sits below the rim of the pot.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["::4 ears corn, shucked"]}, {"n": 2, "section": null, "text": "Lay the ears in a large Dutch oven or pot and cover with cold tap water by about an inch. No salt in the water.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["::4 ears corn, shucked", "::Cold water, enough to cover by about an inch — source gives no volume"]}, {"cue": "There's no clock target — time to temp depends on ear count and water volume, so read the thermometer.", "n": 3, "section": null, "text": "Uncovered over high heat with a thermometer in the water, bring it to 180°F (82°C). Not a simmer, not a boil.", "time": "~10 min", "type": "active heat", "type_source": "guess"}, {"cue": "Off the heat and covered, the water coasts down and finishes the corn without overshooting.", "n": 4, "section": null, "text": "The second it reads 180°F, cover the pot and kill the burner. Both, immediately.", "time": "~1 min", "type": "active heat", "type_source": "guess"}, {"cue": "10 minutes is ready; 25 is the outside edge.", "n": 5, "section": null, "text": "Stand 10 to 25 minutes, lid on, burner off. Soften the butter while it sits.", "time": "10–25 min", "timer_min": 10, "type": "waiting", "type_source": "guess", "uses": ["::Butter, to serve — source gives no amount"]}, {"n": 6, "section": null, "text": "Tongs the ears out, salt and butter them, or finish however you want.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["::4 ears corn, shucked", "::Kosher salt, to serve — source gives no amount", "::Butter, to serve — source gives no amount"]}], "times_cooked": "1+ (count not recorded)", "title": "Cold-Start \"Boiled\" Corn on the Cob", "total_minutes": 45, "total_time": "25–45 min — the 10–25 min stand plus heat-up; the heat-up figure is mine, not the source's", "updated": "2026-10-12", "variations": "- The stand is a serving-time buffer, not a deadline — the covered pot holds the corn hot across the whole 10–25 minute window, so it can wait on the rest of dinner.\n- The source stops at salt and butter and explicitly leaves the finish open.", "version": 6}, "brooklyn-blackout-cake": {"active_time": "1 hr 30 min", "changes": "", "cook_notes": [{"date": "2025-10-12", "heading": "2025-10-12 — cook 1", "logged_from": "page", "text": "smaller cakes are better"}], "cook_notes_placeholder": "", "cuisine": "American", "date_added": "2026-08-14", "extra_front_matter": {}, "filename": "brooklyn-blackout-cake_2026-08-14_v1.md", "first_cooked": "2025-10-12", "icon": "cake-slice", "ingredient_groups": [{"items": ["2 cups AP flour", "½ cup cocoa powder", "1 cup sugar", "1 tsp salt", "2 tsp baking soda", "1 tsp baking powder", "2 eggs", "½ cup vegetable oil", "¼ cup sour cream", "¾ cup buttermilk", "½ cup hot water", "1 shot espresso (optional)", "½ tsp vanilla paste (optional)"], "name": "Chocolate cake"}, {"items": ["2½ cups whole milk (½ cup reserved for the slurry)", "½ cup sugar", "1 tsp salt", "2 Tbsp cornstarch", "3 Tbsp cocoa powder", "1 egg + 2 egg yolks", "5 oz bittersweet chocolate (60%), chopped", "2 Tbsp unsalted butter", "½ tsp vanilla paste (optional)"], "name": "Chocolate pudding"}, {"items": ["½ cup (1 stick) unsalted butter, room temp", "¾ cup powdered sugar", "¼ cup cocoa powder", "¾ cup heavy cream", "5 oz bittersweet chocolate (60%), chopped"], "name": "Fudge frosting"}, {"items": ["⅓ cup AP flour", "2 tsp cornstarch", "¼ cup sugar", "⅓ cup cocoa powder", "4 Tbsp melted butter"], "name": "Chocolate crumble"}], "intro": "Four layers of chocolate cake, chocolate pudding between every one, fudge frosting outside, baked chocolate crumble pressed around the sides. Home version of the Two Little Red Hens cake from the UES.\n\nFour components, all of which can be made a day ahead and refrigerated. Cocoa and chocolate appear in every single element, so the quality of both carries the whole cake. Valrhona and 60% bittersweet is what the source uses; a lower percentage or a bump in sugar shifts it sweeter.", "last_cooked": "2025-10-12", "method": "oven + stovetop", "notes": "- Cake board + turntable is what keeps the four-layer stack neat and movable.\n- Offset spatula for spreading, bench scraper for clean sides, serrated knife for the top pattern.\n- Gaps the source doesn't specify: portion count (yield is given only as \"one 6 inch cake\" — an earlier version of this file guessed 10, which was invented and has been removed); oven rack position; cake pan depth; exact cooling time before slicing (1 hr is an estimate, not from the source); crumble sheet pan size; the crumble's melted butter is listed with the dry ingredients but is clearly added after them.\n- Scaling is by whole cakes, not portions, since the source has no per-person figure. ×1 is the recipe as written.\n- Source recipe as written pours between two pans, each split in half — that's where the 4 layers come from.", "omitted": "- Nothing — single source, taken whole.", "protein": "none", "protein_group": "none", "scaling": {"base": 1, "enabled": false, "note": "Scaling is by whole cakes, not portions, since the source has no per-person figure. ×1 is the recipe as written.", "unit": "whole cakes"}, "section": "desserts", "serves": "one 6\" four-layer cake — source gives no portion count", "slug": "brooklyn-blackout-cake", "source": "The Baked Road (Emily He), \"two little red hens' brooklyn blackout cake\", 2021-06-04 — https://www.thebakedroad.com/blog/two-little-red-hens-brooklyn-blackout-cake", "source_comparison": "", "steps": [{"n": 1, "section": "Chocolate cake", "text": "Heat oven to 350°F. Butter and flour two 6\" pans, line the bottoms with parchment rounds.", "time": "~10 min", "type": "prep", "type_source": "guess"}, {"combine": {"heat": "none", "inputs": [{"cat": "dry", "label": "Flour"}, {"cat": "dry", "label": "Cocoa"}, {"cat": "sweet", "label": "Sugar"}, {"cat": "dry", "label": "Salt"}, {"cat": "dry", "label": "Baking soda"}, {"cat": "dry", "label": "Baking powder"}], "result": "Dry mix", "vessel": "Large bowl, sifted"}, "n": 2, "section": "Chocolate cake", "text": "Sift flour, cocoa, sugar, salt, baking soda and baking powder together in a large bowl. Set aside.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate cake::2 cups AP flour", "Chocolate cake::½ cup cocoa powder", "Chocolate cake::1 cup sugar", "Chocolate cake::1 tsp salt", "Chocolate cake::2 tsp baking soda", "Chocolate cake::1 tsp baking powder"]}, {"combine": {"heat": "none", "inputs": [{"cat": "protein", "label": "Eggs"}, {"cat": "fat", "label": "Oil"}, {"cat": "wet", "label": "Buttermilk"}, {"cat": "fat", "label": "Sour cream"}, {"cat": "wet", "label": "Espresso"}, {"cat": "aromatic", "label": "Vanilla"}], "result": "Wet mix", "vessel": "Bowl, whisked"}, "cue": "The espresso and vanilla aren't tastable in the finished cake — they deepen the chocolate.", "n": 3, "section": "Chocolate cake", "text": "Whisk eggs, oil, buttermilk, sour cream, espresso and vanilla together.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate cake::2 eggs", "Chocolate cake::½ cup vegetable oil", "Chocolate cake::¾ cup buttermilk", "Chocolate cake::¼ cup sour cream", "Chocolate cake::1 shot espresso (optional)", "Chocolate cake::½ tsp vanilla paste (optional)"]}, {"combine": {"heat": "none", "inputs": [{"cat": "dry", "label": "Dry mix"}, {"cat": "wet", "label": "Wet mix"}, {"cat": "wet", "label": "Hot water"}], "result": "Thin batter", "vessel": "Stand mixer, paddle, low"}, "n": 4, "section": "Chocolate cake", "text": "Paddle the dry into the wet on low. As it comes together, stream in the hot water. Mix until just combined; the batter will be thin. Divide evenly between the pans.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate cake::½ cup hot water"]}, {"n": 5, "section": "Chocolate cake", "text": "Bake ~25 min, until springy in the center and a toothpick comes out clean.", "time": "25 min", "timer_min": 25, "type": "active heat", "type_source": "guess"}, {"n": 6, "section": "Chocolate cake", "text": "Cool completely (~1 hr) before slicing — warm layers tear. Trim the domes flat with a serrated knife, wrap in plastic, refrigerate until assembly.", "time": "~1 hr", "timer_min": 60, "type": "waiting", "type_source": "guess"}, {"combine": {"heat": "none", "inputs": [{"cat": "wet", "label": "½ cup milk"}, {"cat": "dry", "label": "Cornstarch"}, {"cat": "dry", "label": "Cocoa"}], "result": "Lump-free slurry", "vessel": "Bowl, whisked"}, "n": 7, "section": "Chocolate pudding", "text": "Whisk ½ cup of the milk with the cornstarch and cocoa until no lumps remain.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate pudding::2½ cups whole milk (½ cup reserved for the slurry)", "Chocolate pudding::2 Tbsp cornstarch", "Chocolate pudding::3 Tbsp cocoa powder"]}, {"combine": {"heat": "boil", "inputs": [{"cat": "wet", "label": "Milk"}, {"cat": "sweet", "label": "Sugar"}, {"cat": "dry", "label": "Salt"}, {"cat": "wet", "label": "Slurry"}], "result": "Coats a spoon", "vessel": "Saucepan"}, "n": 8, "section": "Chocolate pudding", "text": "Bring the remaining 2 cups milk, sugar and salt to a boil, stirring to dissolve the sugar. Whisk in the slurry constantly until it thickens enough to coat the back of a spoon.", "time": "~8 min", "type": "active heat", "type_source": "guess", "uses": ["Chocolate pudding::2½ cups whole milk (½ cup reserved for the slurry)", "Chocolate pudding::½ cup sugar", "Chocolate pudding::1 tsp salt"]}, {"combine": {"heat": "moderate", "inputs": [{"cat": "protein", "label": "Egg"}, {"cat": "protein", "label": "Yolks"}, {"cat": "wet", "label": "Hot milk"}], "result": "Back to a boil", "vessel": "Heatproof bowl, then back to the pan"}, "n": 9, "section": "Chocolate pudding", "text": "Whisk the egg and yolks in a heatproof bowl. Temper in half the hot milk, return everything to the pan, and cook over moderate heat, whisking, until it comes back to a boil.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Chocolate pudding::1 egg + 2 egg yolks"]}, {"combine": {"heat": "off", "inputs": [{"cat": "sweet", "label": "Chocolate"}, {"cat": "fat", "label": "Butter"}, {"cat": "aromatic", "label": "Vanilla"}], "result": "Glossy pudding", "vessel": "Pan, off heat"}, "n": 10, "section": "Chocolate pudding", "text": "Off heat, whisk in the chocolate, butter and vanilla until melted and glossy.", "time": "~3 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate pudding::5 oz bittersweet chocolate (60%), chopped", "Chocolate pudding::2 Tbsp unsalted butter", "Chocolate pudding::½ tsp vanilla paste (optional)"]}, {"alarm": "~2 hrs", "n": 11, "section": "Chocolate pudding", "text": "Transfer to a container, press plastic wrap directly on the surface, chill ~2 hrs until set.", "time": "2 hr", "type": "waiting", "type_source": "guess"}, {"combine": {"heat": "none", "inputs": [{"cat": "fat", "label": "Butter"}, {"cat": "sweet", "label": "Powdered sugar"}, {"cat": "dry", "label": "Cocoa"}], "result": "Buttercream", "vessel": "Mixer, medium then low"}, "n": 12, "section": "Fudge frosting", "text": "Cream the butter smooth on medium. Drop to low, mix in the powdered sugar and cocoa.", "time": "~5 min", "type": "prep", "type_source": "guess", "uses": ["Fudge frosting::½ cup (1 stick) unsalted butter, room temp", "Fudge frosting::¾ cup powdered sugar", "Fudge frosting::¼ cup cocoa powder"]}, {"combine": {"heat": "none", "inputs": [{"cat": "fat", "label": "Hot cream"}, {"cat": "sweet", "label": "Chocolate"}, {"cat": "fat", "label": "Buttercream"}], "result": "Fudge frosting", "vessel": "Mixer, medium"}, "n": 13, "section": "Fudge frosting", "text": "Simmer the heavy cream and pour over the chopped chocolate. Wait 30 sec, stir to a smooth ganache, then beat into the buttercream on medium until incorporated.", "time": "~8 min", "type": "active heat", "type_source": "guess", "uses": ["Fudge frosting::¾ cup heavy cream", "Fudge frosting::5 oz bittersweet chocolate (60%), chopped"]}, {"n": 14, "section": "Fudge frosting", "text": "Refrigerate 30 min to reach spreading consistency.", "time": "30 min", "timer_min": 30, "type": "waiting", "type_source": "guess"}, {"combine": {"heat": "none", "inputs": [{"cat": "dry", "label": "Flour"}, {"cat": "dry", "label": "Cornstarch"}, {"cat": "sweet", "label": "Sugar"}, {"cat": "dry", "label": "Cocoa"}, {"cat": "fat", "label": "Melted butter"}], "result": "Clumpy crumble", "vessel": "Mixer, paddle, low"}, "n": 15, "section": "Chocolate crumble", "text": "Heat oven to 300°F. Paddle the flour, cornstarch, sugar and cocoa together on low, then add the melted butter and keep mixing until the mixture clumps.", "time": "~8 min", "type": "prep", "type_source": "guess", "uses": ["Chocolate crumble::⅓ cup AP flour", "Chocolate crumble::2 tsp cornstarch", "Chocolate crumble::¼ cup sugar", "Chocolate crumble::⅓ cup cocoa powder", "Chocolate crumble::4 Tbsp melted butter"]}, {"cue": "It comes out soft and hardens as it cools.", "n": 16, "section": "Chocolate crumble", "text": "Spread on a sheet pan, bake 20 min.", "time": "20 min", "timer_min": 20, "type": "active heat", "type_source": "guess"}, {"n": 17, "section": "Assembly", "text": "Split each cooled, trimmed cake horizontally for 4 even layers. Set a cake board on a turntable; have pudding, fudge, crumble, offset spatula and bench scraper at hand.", "time": "~10 min", "type": "prep", "type_source": "guess"}, {"n": 18, "section": "Assembly", "text": "Alternate cake and pudding — cake, pudding, cake, pudding, cake, pudding, cake. Use the leftover pudding as a thin crumb coat over the whole cake.", "time": "~15 min", "type": "prep", "type_source": "guess"}, {"cue": "Skipping this is how crumbs end up in the finish frosting.", "n": 19, "section": "Assembly", "text": "Chill 20 min so the crumb coat firms.", "time": "20 min", "timer_min": 20, "type": "waiting", "type_source": "guess"}, {"n": 20, "section": "Assembly", "text": "Frost the outside with fudge, evening the sides with the bench scraper. Drag a serrated knife lightly across the top for the pattern.", "time": "~15 min", "type": "prep", "type_source": "guess"}, {"n": 21, "section": "Assembly", "text": "Press crumble around the sides. Pipe the remaining fudge in large shells around the top edge with a large star tip.", "time": "~10 min", "type": "prep", "type_source": "guess"}], "times_cooked": 1, "title": "Brooklyn Blackout Cake (Two Little Red Hens style)", "total_minutes": 300, "total_time": "5 hr", "updated": "2026-10-12", "variations": "- **Sweeter**: lower-percentage chocolate, or more sugar in the pudding and frosting.\n- **8\" cake**: scale ×1.5. **Half batch**: 4\" cake.\n- **Make-ahead**: every component holds refrigerated. Cake layers wrapped, pudding under pressed plastic, frosting and crumble in sealed containers.", "version": 6}, "brown-butter-cornmeal-cake": {"active_time": "45 min", "changes": "", "cook_notes": [], "cook_notes_placeholder": "_None yet — not cooked._", "cuisine": "American (French financier base)", "date_added": "2026-08-14", "extra_front_matter": {}, "filename": "brown-butter-cornmeal-cake_2026-08-14_v1.md", "first_cooked": "not yet", "icon": "cake", "ingredient_groups": [{"items": ["224 g (1 cup) unsalted butter, cut into 1-inch cubes", "385 g (2 cups) turbinado sugar, for the meringue", "185 g (1¼ cups) medium-coarse cornmeal", "64 g (½ cup) cornstarch", "1 Tbsp kosher salt (Diamond Crystal)", "8 large egg whites"], "name": "Batter"}, {"items": ["125 g (1 cup) frozen sweet cherries, quartered — do not defrost", "2 Tbsp cornstarch", "¼ tsp kosher salt"], "name": "Cherry topping"}, {"items": ["1 Tbsp softened butter, for the skillet", "50 g (¼ cup) turbinado sugar, for sprinkling — 2 Tbsp up the sides, 2 Tbsp over the top", "Whipped cream or ice cream, to serve"], "name": "Skillet and finish"}], "intro": "", "last_cooked": "never", "method": "stovetop brown butter + stand mixer + cast-iron skillet, oven 375°F", "notes": "- Scaling changes amounts only. The pan stays a 10–12 inch skillet, 2 inches deep. Past roughly 14 servings you need a second skillet.\n- Egg whites don't scale cleanly — round to whole eggs.\n- **Gap:** source is silent on oven rack position. Middle rack is the reasonable read; confirm on first cook.\n- **Gap:** source gives no weight for the egg whites, only a count.\n- Timing throughout is doneness-cued rather than clock-driven. The brown butter and the final 6–10 minutes are both color calls.", "omitted": "- No ground almond. The whole point of the adaptation is cornmeal standing in for the almond flour of a classic financier.\n- No baking powder or soda. Lift comes entirely from the meringue.\n- Did not substitute granulated for turbinado. Turbinado's coarse crystals are what give the crust its crunch; grinding it is a step, not an inconvenience to route around.", "protein": "none — dessert", "protein_group": "none", "scaling": {"base_high": 12, "base_low": 10, "enabled": true, "note": "Scaling changes amounts only. The pan stays a 10–12 inch skillet, 2 inches deep. Past roughly 14 servings you need a second skillet. Egg whites don't scale cleanly — round to whole eggs.", "unit": "servings"}, "section": "desserts", "serves": "10 to 12", "slug": "brown-butter-cornmeal-cake", "source": "NYT Cooking — recipe from Kelly Mencin (Radio Bakery, Brooklyn), adapted by Yewande Komolafe, updated Jan 27 2026", "source_comparison": "", "steps": [{"cue": "Go by color and smell; the solids burn in seconds once they darken.", "n": 1, "section": "Day 1 — batter", "text": "**Brown the butter.** Melt 224 g butter in a small deep pot over medium heat until it foams at the edges, ~5 min. Keep cooking, stirring consistently, until the milk solids turn golden, 2–4 min. Then stir constantly until deep brown and nutty, 3–4 min more. Set aside to cool slightly — it must stay warm and pourable for step 5.", "time": "10–13 min", "type": "active heat", "type_source": "file", "uses": ["Batter::224 g (1 cup) unsalted butter, cut into 1-inch cubes"]}, {"cue": "Coarse bits remaining is correct — they're the crunch.", "n": 2, "section": "Day 1 — batter", "text": "**Powder the sugar.** Pulse 385 g turbinado sugar in a food processor or blender ~20 times, roughly 10 sec per pulse, until fine.", "time": "~3 min", "type": "prep", "type_source": "file", "uses": ["Batter::385 g (2 cups) turbinado sugar, for the meringue"]}, {"combine": {"heat": "none", "inputs": [{"cat": "dry", "label": "Cornmeal"}, {"cat": "dry", "label": "Cornstarch"}, {"cat": "dry", "label": "Kosher salt"}], "result": "Even dry mix", "vessel": "Medium bowl, whisked"}, "n": 3, "section": "Day 1 — batter", "text": "**Whisk the dry mix.** Combine 185 g cornmeal, 64 g cornstarch and 1 Tbsp kosher salt in a medium bowl. Whisk evenly — the cornstarch carries most of the structure, and unmixed pockets go gummy.", "time": "~2 min", "type": "prep", "type_source": "file", "uses": ["Batter::185 g (1¼ cups) medium-coarse cornmeal", "Batter::64 g (½ cup) cornstarch", "Batter::1 Tbsp kosher salt (Diamond Crystal)"]}, {"n": 4, "section": "Day 1 — batter", "text": "**Whip the meringue.** Whip 8 egg whites on medium to soft peaks, 5–6 min. Sprinkle in all the powdered turbinado one tablespoon at a time until the whites are tinged light brown, ~4 min. Whip on medium-high to medium peaks — glossy, like a Swiss meringue, 5–6 min. Scrape the bowl down.", "time": "14–16 min", "type": "prep", "type_source": "file", "uses": ["Batter::8 large egg whites"]}, {"combine": {"heat": "none", "inputs": [{"cat": "protein", "label": "Meringue"}, {"cat": "dry", "label": "Dry mix"}, {"cat": "fat", "label": "Warm brown butter"}], "result": "Fluffy, creamy batter", "vessel": "Stand mixer, paddle"}, "cue": "This is a financier — it's meant to be beaten, not folded.", "n": 5, "section": "Day 1 — batter", "text": "**Build the batter.** Switch to the paddle, drop the speed slightly, and sprinkle in the dry mix until just combined, ~3 min. Slowly stream in the warm brown butter and mix until smooth and cohesive, ~5 min. Keep mixing until fluffy and creamy, another 5 min.", "time": "13 min", "type": "prep", "type_source": "file"}, {"alarm": "12 hrs minimum, up to 3 days", "cue": "The rest hydrates the cornmeal; skipping it bakes gritty.", "n": 6, "section": "Day 1 — batter", "text": "**Rest the batter.** Transfer to an airtight container, cover, refrigerate 12 hours minimum, up to 3 days. Set a phone alarm.", "time": "12 hr+", "type": "waiting", "type_source": "file"}, {"n": 7, "section": "Day 2 — bake", "text": "**Heat the oven** to 375°F. Line a sheet pan with parchment and set out a cooling rack — both are used for the double flip in step 13.", "time": "~15 min", "type": "prep", "type_source": "file"}, {"combine": {"heat": "cold", "inputs": [{"cat": "sweet", "label": "Frozen cherries"}, {"cat": "dry", "label": "Cornstarch"}, {"cat": "dry", "label": "Salt"}], "result": "Coated cherries", "vessel": "Bowl, tossed"}, "cue": "The coat keeps their juice from sinking through the batter.", "n": 8, "section": "Day 2 — bake", "text": "**Coat the cherries.** Toss 125 g frozen cherries with 2 Tbsp cornstarch and ¼ tsp salt until fully coated. Do not defrost.", "time": "~2 min", "type": "prep", "type_source": "file", "uses": ["Cherry topping::125 g (1 cup) frozen sweet cherries, quartered — do not defrost", "Cherry topping::2 Tbsp cornstarch", "Cherry topping::¼ tsp kosher salt"]}, {"combine": {"heat": "none", "inputs": [{"cat": "fat", "label": "Softened butter"}, {"cat": "sweet", "label": "Turbinado"}, {"cat": "wet", "label": "Batter"}, {"cat": "sweet", "label": "Cherries"}], "result": "Filled skillet", "vessel": "10–12\" skillet"}, "n": 9, "section": "Day 2 — bake", "text": "**Fill the skillet.** Generously butter the base and sides of a 10- to 12-inch cast-iron or steel skillet, 2 inches deep, with 1 Tbsp softened butter. Sprinkle 2 Tbsp turbinado up along the buttered sides — this builds the crisp caramelized edge, so be generous getting it up the wall. Spread the batter flat with the back of a small offset spatula, scatter the cherries over the top, sprinkle the remaining 2 Tbsp turbinado all over.", "time": "~8 min", "type": "prep", "type_source": "file", "uses": ["Skillet and finish::1 Tbsp softened butter, for the skillet", "Skillet and finish::50 g (¼ cup) turbinado sugar, for sprinkling — 2 Tbsp up the sides, 2 Tbsp over the top"]}, {"cue": "The center should still be soft but hold a fingertip imprint. Cherries still sitting on top means it needs more time.", "n": 10, "section": "Day 2 — bake", "text": "**Bake ~30 min,** until the edges are set and the cherries have sunk into the cake.", "time": "30 min", "timer_min": 30, "type": "active heat", "type_source": "file"}, {"cue": "Done is slightly puffed in the center, golden brown on top, edges crisp and deep brown; a tester in the center comes out clean or with a few crumbs.", "n": 11, "section": "Day 2 — bake", "text": "**Rotate and finish,** another 6–10 min.", "time": "6–10 min", "timer_min": 6, "type": "active heat", "type_source": "file"}, {"cue": "Long enough to set, short enough that the sugar edge hasn't glued itself to the skillet.", "n": 12, "section": "Day 2 — bake", "text": "**Cool in the pan ~10 min.**", "time": "10 min", "timer_min": 10, "type": "waiting", "type_source": "file"}, {"n": 13, "section": "Day 2 — bake", "text": "**Double flip.** Run an offset spatula around the edge. Lay the parchment-lined sheet pan over the skillet and flip the cake onto it; lay the rack over the cake and flip again so it lands right side up. Peel off the parchment, cool completely.", "time": "~
