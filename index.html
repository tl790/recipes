at", "ingredient_groups": [{"items": ["1 cup steel cut oats", "3 cups water, boiling", "1 Tbsp butter", "Salt, a bit — added at the end"], "name": "Oatmeal"}, {"items": ["½ cup plus 1 Tbsp low-fat buttermilk — optional; half stirred in near the end, the rest on top", "1 Tbsp brown sugar — optional", "¼ tsp cinnamon — optional"], "name": "Optional finish"}], "intro": "Alton Brown's method with Bob's Red Mill ratios: toast the oats in butter, pour in boiling water, simmer without stirring, then finish by doneness. No whole milk. Buttermilk, brown sugar and cinnamon are all optional.\n\nBoth sources are 4 servings (1 cup oats, 3 cups water); 2 and 3 servings use the same ratio, scaled down.", "last_cooked": "—", "lead_ingredients": ["steel cut oats"], "method": "stovetop, one saucepot", "notes": "- Ratio is 1 part oats to 3 parts water by volume, in both sources and at every serving size.\n- Alton's timing: 2 min toast, 25 min simmer, 10 min after the dairy goes in; 45 min total. Bob's: 10–20 min simmer, a few minutes standing; 20 min total.\n- Step types (prep, waiting, active heat) are my guesses; the sources have none.\n- **Gap:** what the 10-min check is for (water level, heat, sticking) isn't recorded.\n- **Gap:** pot given only as \"large saucepot\"; no heat setting beyond \"low simmer.\"\n- **Gap:** butter and buttermilk amounts at 2 and 3 servings aren't recorded; only oats and water are.\n- **Gap:** amount of salt isn't recorded, only \"a bit\" at the end.\n- **Gap:** how long the partially covered rest runs isn't recorded; the ~2 min is Bob's \"couple of minutes.\"", "omitted": "- ½ cup whole milk — dropped from the source; I don't use it.", "protein": "none", "protein_group": "none", "ratios": [["2 servings", "½ cup oats + 1½ cups water"], ["3 servings", "¾ cup oats + 2¼ cups water"], ["4 servings", "1 cup oats + 3 cups water"]], "scaling": {"base": 4, "enabled": true, "note": "Linear: ¼ cup oats and ¾ cup water per serving. My ratios: 2 servings = ½ cup oats + 1½ cups water; 3 = ¾ cup + 2¼ cups; 4 = 1 cup + 3 cups.", "unit": "servings"}, "section": "breakfast", "serves": "2 to 4", "slug": "steel-cut-oatmeal", "source": "Method: Alton Brown, \"Steel Cut Oatmeal\", Food Network (Good Eats, \"Oat Cuisine\") — https://www.foodnetwork.com/recipes/alton-brown/steel-cut-oatmeal-recipe-1939448. Ratios: Bob's Red Mill, \"Basic Preparation Instructions for Steel Cut Oats\" — https://www.bobsredmill.com/recipes/how-to-make/basic-preparation-instructions-for-steel-cut-oats. Adapted by Tim.", "source_comparison": "Two pages for one dish: Alton Brown (Food Network) supplies the method; Bob's Red Mill, the instructions printed on its steel-cut oat bags, supplies the ratios.\n\n### What they agree on\n4 servings from 1 cup steel-cut oats and 3 cups water. Low simmer after the water is hot. Alton's pot gets milk and buttermilk; Bob's has no dairy.\n\n### The real disagreements, and why\n\n**1. Toasting.** Alton melts 1 Tbsp butter, stirs the oats in it 2 min, then adds boiling water. Bob's boils the water first and drops the oats in plain. Toasting is a flavor step; Bob's is the minimal bag version. Used Alton's.\n\n**2. Simmer time and stirring.** Alton: 25 min, no stirring, then 10 more with the dairy. Bob's: 10–20 min depending on how chewy you want them, stirring occasionally. Neither says why; Bob's window is a chew preference, Alton's longer time is what gets a creamy result. Used Alton's no-stir simmer, with a doneness-based finish.\n\n**3. Salt.** Bob's puts ½ tsp in the water at 4 servings. Alton uses none. Tim salts a bit at the end instead; amount not recorded.\n\n**4. Resting.** Bob's takes the pot off the heat and lets it stand covered a couple of minutes. Alton goes straight to the bowl. Used a rest, partially covered (Tim's change); length not recorded.\n\n### Deliberately left out\nBob's Instant Pot method (3 min high pressure, natural release).", "steps": [{"n": 1, "section": null, "text": "Bring the water to a boil: 3 cups for 4 servings, 2¼ cups for 3, 1½ cups for 2.", "time": "~5 min", "type": "active heat", "type_source": "guess", "uses": ["Oatmeal::3 cups water, boiling"]}, {"n": 2, "section": null, "text": "Melt the butter in a large saucepot, add the oats and stir for 2 min to toast. Oats: 1 cup for 4 servings, ¾ cup for 3, ½ cup for 2.", "time": "2 min", "timer_min": 2, "type": "active heat", "type_source": "file", "uses": ["Oatmeal::1 cup steel cut oats", "Oatmeal::1 Tbsp butter"]}, {"n": 3, "section": null, "text": "Pour in the boiling water and reduce the heat to a low simmer. Always 3 parts water to 1 part oats.", "time": "~1 min", "type": "active heat", "type_source": "guess", "uses": ["Oatmeal::3 cups water, boiling"]}, {"cue": "No stirring.", "n": 4, "section": null, "text": "Keep at a low simmer, without stirring, for 10 min.", "time": "10 min", "timer_min": 10, "type": "waiting", "type_source": "guess"}, {"n": 5, "section": null, "text": "Check the pot (my habit at about the 10-min mark). Then keep at a low simmer, still without stirring, 15 min more — 25 min total.", "time": "15 min", "timer_min": 15, "type": "waiting", "type_source": "guess"}, {"cue": "Done is the stop signal, not the clock. The 10 min is Alton's upper bound.", "n": 6, "section": null, "text": "If using buttermilk, stir in half of it gently. If the oats are done, stop. If they're too wet, cook a bit longer to drive off the excess water, up to 10 min.", "time": "~0–10 min", "type": "active heat", "type_source": "guess", "uses": ["Optional finish::½ cup plus 1 Tbsp low-fat buttermilk — optional; half stirred in near the end, the rest on top"]}, {"n": 7, "section": null, "text": "Take the pot off the heat and let it rest with the lid on partway.", "time": "~2 min", "type": "waiting", "type_source": "guess"}, {"n": 8, "section": null, "text": "Spoon into a bowl and add a bit of salt. Top with the rest of the buttermilk, the brown sugar and the cinnamon — whichever you're using.", "time": "~2 min", "type": "prep", "type_source": "guess", "uses": ["Oatmeal::Salt, a bit — added at the end", "Optional finish::½ cup plus 1 Tbsp low-fat buttermilk — optional; half stirred in near the end, the rest on top", "Optional finish::1 Tbsp brown sugar — optional", "Optional finish::¼ tsp cinnamon — optional"]}], "times_cooked": "many (count not recorded)", "title": "Steel-Cut Oatmeal (Alton Brown, adapted)", "total_minutes": 47, "total_time": "~47 min (source: 45 min, plus ~2 min rest)", "updated": "2026-10-15", "variations": "- **My ratios, by servings**: 2 servings — ½ cup oats, 1½ cups water. 3 servings — ¾ cup oats, 2¼ cups water. 4 servings — 1 cup oats, 3 cups water.\n- **Bare**: skip the buttermilk, brown sugar and cinnamon; all three are optional.\n- **Chewier or softer (Bob's)**: their simmer is 10–20 min, shorter for chewier, longer for softer.\n- **Salt in the water (Bob's)**: ½ tsp in the water at 4 servings, instead of salting at the end.", "version": 7}}, "coffee": {"gimme-burundi-turihamwe": {"coffee_name": "Burundi Turihamwe", "gaps": "Region, altitude, variety, process, roast level and tasting notes (none on the listing page), where and when I bought it, price paid, bag size, roast date, what I taste in the cup.", "grind": "14 on the Timemore C3S Pro", "how_i_brew": "1 Cup V60 recipe, 15 g / 250 g", "importer_and_program": "Importer JNP Coffee, with support from the International Women's Coffee Alliance. Part of JNP's Dushime Premium Program, which pays producers a second payment at the end of the harvest season. (listing)", "kind": "coffee", "listing": "https://gimmecoffee.com/products/burundi-turihamwe. Page viewed 2026-10-10 shows $27.50 for 12 oz, also sold in 2 lb and 5 lb. That's the current list price, not necessarily what I paid.", "origin": "Burundi (listing)", "producer": "Turihamwe, Burundi's first washing station built and owned exclusively by women farmers. Turihamwe means together in Kirundi. (listing)", "roaster": "Gimme! Coffee (Gimme Coffee Cooperative), Ithaca, NY", "roaster_id": "roaster-gimme", "updated": "2026-10-11"}, "oasis-alo-tim": {"altitude": "2450 m (listing)", "bought": "May 2026 at Oasis Coffee Roasting Lab (Tianmu), No. 15, 1F, Lane 14, Sec. 7, Zhongshan N Rd, Tianshan Village, Shilin District, Taipei 111. Pin: https://maps.app.goo.gl/DPr9XWcPD69hmFaw9", "coffee_name": "ALO TIM (Ethiopia, Sidama)", "gaps": "Roast date, bag size, price I actually paid (NT$700 is the archived list price), which batch (listing mentions a Sky Project and a smaller-bean Pearl batch), what I taste in the cup.", "grind": "13 on the Timemore C3S Pro (finest pour-over setting)", "how_i_brew": "1 Cup V60 recipe, 15 g / 250 g", "kind": "coffee", "listed_tasting_notes": "Bergamot, passion fruit, orange, apricot, honey (listing)", "listing": "Archived page from 2025-02-06 (saved as PDF, viewed 2026-10-10), shows NT$700. https://web.archive.org/web/20250206115104/https://www.oasiscoffeeroasters.com/zh-TW/products/alotim", "origin": "Ethiopia, Sidama (listing)", "process": "TIM (Terroir Intensified Maceration). Fermentation liquid from the previous batch is reserved to ferment the next, so the same plot's microbial cultures carry through. Listing says this gives a rounder acidity and cascara-like sweetness. (listing)", "producer": "Tamiru Tadesse (listing)", "roast_level": "Roast Level: 1 on Oasis's scale. Listing also says Gesha-Grade, as written on the page. (listing)", "roaster": "Oasis Coffee Roasters, Taipei", "roaster_brew_suggestions": "From the listing, not how I brew. Grind medium, 800-900 µm; grinder equivalents Fellow Ode 3.2, Comandante C40 25 clicks, EK43 7.5. Ratio 1:14 powder to water, about 1:11 to liquid in the cup, water 40-60 ppm. (a) Two temperatures: 15 g coffee, 210 g water. 0:00 to 45 g at 65°C, 0:20 to 105 g at 92°C, 0:40 to 180 g at 92°C, 1:00 to 210 g at 65°C. Stop at 165 g in the cup. (b) One temperature: 15 g coffee, 210 g water at 90°C. 0:00 to 70 g, 0:20 to 140 g, 0:50 to 210 g. Stop at 1 const KEY='recipe-library-local-v1';
let local={}; try{ local=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(local)); }catch(e){} };
const subs=new Map();
const cl=o=>JSON.parse(JSON.stringify(o));
const getCol=c=>{ const m=new Map(Object.entries(cl(SEED[c]||{}))); const l=local[c]||{}; for(const [k,v] of Object.entries(l)){ if(v===null) m.delete(k); else m.set(k,v); } return m; };
const mkSnap=(id,d)=>({id,exists:d!=null,data:()=>d==null?undefined:cl(d)});
const notify=c=>{ (subs.get(c)||[]).forEach(f=>f()); };
const db={
  doc(path){ const [c,id]=path.split('/'); return {
    async get(){ return mkSnap(id,getCol(c).get(id)); },
    async set(d){ (local[c]=local[c]||{})[id]=cl(d); persist(); notify(c); notify(path); },
    async update(p){ const cur=getCol(c).get(id)||{}; (local[c]=local[c]||{})[id]=Object.assign(cl(cur),cl(p)); persist(); notify(c); notify(path); },
    async delete(){ (local[c]=local[c]||{})[id]=null; persist(); notify(c); notify(path); },
    onSnapshot(ok){ const f=()=>ok(mkSnap(id,getCol(c).get(id))); (subs.get(path)||subs.set(path,[]).get(path)).push(f); setTimeout(f,0); return ()=>{}; }
  }; },
  collection(c){ return { onSnapshot(ok){ const f=()=>ok({docs:[...getCol(c).entries()].map(([id,d])=>mkSnap(id,d))}); (subs.get(c)||subs.set(c,[]).get(c)).push(f); setTimeout(f,0); return ()=>{}; } }; }
};
window.claude={ use:async n=>{ if(n==='db') return db; if(n==='user') return {isOwner:async()=>false}; return null; } };
})();

<script>

/* ---------- theme: follows the device by default; the header button overrides it on this device ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');

function toggleTheme(){ const next=effectiveTheme()==='dark'?'light':'dark'; themeOv=next===sysTheme()?'':next; try{ if(themeOv) localStorage.setItem(THEME_KEY,themeOv); else localStorage.removeItem(THEME_KEY); }catch(e){} applyTheme(); }
mq.addEventListener('change',applyTheme); applyTheme();

/* ---------- markdown (inline + light block) ---------- */
function inl(s){
  s=esc(s); const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0003'+(codes.length-1)+'\u0004';});
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/(^|[\s(])_([^_\n]+?)_(?=[\s.,;:)]|$)/g,'$1<em>$2</em>');
  s=s.replace(/\u0003(\d+)\u0004/g,(m,i)=>'<code>'+codes[i]+'</code>');
  return s.replace(/\u0001/g,'<span class="q">').replace(/\u0002/g,'</span>');
}
function md(t){
  if(!t) return ''; let h='',list=null,para=[];
  const fp=()=>{if(para.length){h+='<p>'+para.map(inl).join('<br>')+'</p>';para=[];}};
  const fl=()=>{if(list){h+='<ul>'+list.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>';list=null;}};
  for(const raw of String(t).split('\n')){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){fp();fl();continue;}
    if((m=l.match(/^#{3,4}\s+(.*)/))){fp();fl();h+='<h4>'+inl(m[1])+'</h4>';continue;}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){fp();(list=list||[]).push(m[1]);continue;}
    fl(); para.push(l.trim());
  }
  fp();fl(); return h;
}

/* ---------- shared scaling math (one implementation for every recipe) ---------- */
const FRAC={'½':1/2,'⅓':1/3,'⅔':2/3,'¼':1/4,'¾':3/4,'⅛':1/8,'⅜':3/8,'⅝':5/8,'⅞':7/8};
const FC='½⅓⅔¼¾⅛⅜⅝⅞';
const NUM=`(?:\\d+[${FC}]|\\d+(?:\\.\\d+)?|[${FC}])`;
const RANGE=`${NUM}(?:\\s*(?:–|-|to)\\s*${NUM})?`;
const UNIT='(?:kg|g|oz|lbs?|ml|l|cups?|Tbsp|tsp|cloves?|sticks?|shots?|pinch)';
const COUNT='(?:large egg whites|egg whites|egg yolks|eggs?|yolks|shiitake)';
const Q_RE=new RegExp(`(^|[^\\w.])(${RANGE})(\\s+)(${UNIT}|${COUNT})(?!\\w)(?!\\s+each)`,'g');
const LEAD_RE=new RegExp(`^(${RANGE})(?=\\s)`);
function parseNum(s){ let v=0; const m=s.match(/^(\d+(?:\.\d+)?)?([½⅓⅔¼¾⅛⅜⅝⅞])?$/); if(!m) return NaN; if(m[1]) v+=parseFloat(m[1]); if(m[2]) v+=FRAC[m[2]]; return v; }
function fmtFrac(v){
  if(v<=0) return '0';
  const w=Math.floor(v+1e-9), f=v-w;
  const opts=[[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
  let best=opts[0],bd=9; for(const o of opts){const d=Math.abs(f-o[0]); if(d<bd-1e-9){bd=d;best=o;}}
  const W=w+(best[0]===1?1:0), fs=best[0]===1?'':best[1];
  if(!W&&!fs) return '⅛';
  return (W?String(W):'')+fs;
}
function fmtQty(v,unit){
  if(/^(g|kg|ml)$/.test(unit)) return String(v>=100?Math.round(v/5)*5:Math.max(1,Math.round(v)));
  if(/egg|yolk/.test(unit)) return String(Math.max(1,Math.round(v)));
  return fmtFrac(v);
}
function scaleRange(str,f,unit){
  if(f===1) return str;
  return str.replace(new RegExp(NUM,'g'),n=>{const v=parseNum(n); return isNaN(v)?n:fmtQty(v*f,unit);});
}
/* marks quantities with \u0001…\u0002 so they render bold; f===1 leaves the numbers untouched */
function scaleText(text,f,isIngredient){
  let lead=false;
  let out=String(text).replace(Q_RE,(m,pre,num,sp,unit,off)=>{ if(off+pre.length===0) lead=true; return pre+'\u0001'+scaleRange(num,f,unit)+sp+unit+'\u0002'; });
  if(isIngredient&&!lead) out=out.replace(LEAD_RE,m=>'\u0001'+scaleRange(m,f,'')+'\u0002');
  return out;
}
function scaleInfo(r,ck){
  const s=r.scaling||{enabled:false,unit:'servings'};
  if(!s.enabled) return {f:1,enabled:false,label:'×1',sub:s.unit||'',s};
  if(s.base_low!=null){ const m=ck.mult; return {f:m,enabled:true,range:true,label:fmtFrac(s.base_low*m)+'–'+fmtFrac(s.base_high*m),sub:'serves',canDown:m>0.5,s}; }
  return {f:ck.servings/s.base,enabled:true,label:String(ck.servings),sub:'serves',canDown:ck.servings>1,s};
}

/* ---------- shared timer ---------- */
const TIMERS=new Map();
function tState(key,min){ if(!TIMERS.has(key)) TIMERS.set(key,{total:min*60000,left:min*60000,run:false,t0:0}); return TIMERS.get(key); }
function tLeft(t){ return t.run?Math.max(0,t.left-(Date.now()-t.t0)):t.left; }
function tTap(key){ const t=TIMERS.get(key); if(!t) return; const left=tLeft(t);
  if(left<=0){ t.left=t.total; t.run=false; }
  else if(t.run){ t.left=left; t.run=false; }
  else { t.t0=Date.now(); t.run=true; }
  paintTimers(); }
function mmss(ms){ const s=Math.ceil(ms/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }
function paintTimers(){
  document.querySelectorAll('[data-timer]').forEach(b=>{
    const t=TIMERS.get(b.dataset.timer); if(!t) return; const left=tLeft(t);
    if(left<=0&&t.run){ t.run=false; t.left=0; }
    b.classList.toggle('done',left<=0); b.classList.toggle('run',t.run&&left>0);
    b.querySelector('.tv').textContent=left<=0?'done':mmss(left);
    b.querySelector('small').textContent=left<=0?'tap to reset':(t.run?'tap to pause':(left===t.total?'tap to start':'paused — tap to resume'));
  });
}
setInterval(paintTimers,250);

/* ---------- state ---------- */
const st={recipes:new Map(),coffee:[],db:null,user:null,sample:null,owner:false,dbState:'loading',dbErr:'',coffeeState:'loading',
  tab:'breakfast',cgroup:LS.get('recipe-lib-coffee-group')==='origin'?'origin':'roaster',updated:'',q:'',sort:LS.get('recipe-lib-sort')||'name',filters:{cuisine:'',protein:'',type:'',method:'',cooked:'',time:''}};
const cuisineKey=c=>String(c||'').split(/[,(]/)[0].trim()||'—';
const PROT=[['chicken','Chicken'],['fish','Fish'],['other seafood','Other seafood'],['beef','Beef'],['pork','Pork'],['none','No protein']];
const protLabel=v=>(PROT.find(p=>p[0]===v)||[v,v])[1];
const SIDE=[['protein','Protein'],['vegetable','Vegetable'],['sauce','Sauce']];
const sideLabel=v=>(SIDE.find(p=>p[0]===v)||[v,v])[1];
const ICON_OK=new Set('fish fish-symbol drumstick beef ham soup salad cooking-pot utensils utensils-crossed cake-slice cake cookie croissant egg-fried egg carrot apple cherry citrus grape banana wheat bean leaf sprout sandwich pizza ice-cream-cone ice-cream-bowl popcorn coffee cup-soda milk flame chef-hat nut candy donut wine vegan hand-platter bone waves flask-conical'.split(' '));
const SEC_ICON={breakfast:'egg-fried',dinner:'utensils',sides:'salad',desserts:'cake-slice',coffee:'coffee',unsorted:'utensils'};
const recipeIcon=r=>ICON_OK.has(r.icon)?r.icon:(SEC_ICON[secOf(r)]||'utensils');
const rico=(r,cls)=>`<span class="rico ${cls||''} s-${secOf(r)}" aria-hidden="true"><i data-lucide="${recipeIcon(r)}"></i></span>`;
const tagOf=r=>{ if(secOf(r)==='sides') return r.side_type?`<span>${esc(sideLabel(r.side_type))}</span>`:''; return showProt(r)?`<span>${esc(r.protein_group?protLabel(r.protein_group):r.protein)}</span>`:''; };
const showProt=r=>r.protein_group?r.protein_group!=='none':!/^none/i.test(String(r.protein||'none'));
const methodTags=m=>['oven','stovetop','broiler'].filter(k=>String(m||'').toLowerCase().includes(k));
const isCoffeeRecipe=r=>r.section==='coffee';
const FOOD=[['breakfast','Breakfast'],['dinner','Dinner'],['sides','Sides'],['desserts','Desserts'],['unsorted','Unsorted']];
const secOf=r=>{ const k=r.section==='mains'?'dinner':r.section; return ['breakfast','dinner','sides','desserts','coffee'].includes(k)?k:'unsorted'; };
const tabName=k=>(FOOD.find(f=>f[0]===k)||[k,'Coffee'])[1];
const inSec=k=>[...st.recipes.values()].filter(r=>secOf(r)===k);

const isCooked=r=>typeof r.times_cooked==='number'?r.times_cooked>0:!/^0\b/.test(String(r.times_cooked??'0'));
const TB=[['under30','Under 30 min',30],['30to60','30–60 min',60],['1to3h','1–3 hr',180],['over3h','Over 3 hr, same day',1440],['multiday','Multi-day',Infinity]];
const tbucket=r=>{const m=r.total_minutes; if(typeof m!=='number') return ''; return TB.find(b=>m<=b[2])[0];};
const FILTERS=[
  ['cuisine','Cuisine',r=>cuisineKey(r.cuisine)],

  ['type','Type',r=>r.side_type||''],
  ['method','Method',null],

const FLAGS=[['korean','🇰🇷'],['american','🇺🇸'],['usa','🇺🇸'],['japanese','🇯🇵'],['french','🇫🇷'],['italian','🇮🇹'],['mexican','🇲🇽'],['chinese','🇨🇳'],['thai','🇹🇭'],['indian','🇮🇳'],['spanish','🇪🇸'],['greek','🇬🇷'],['vietnamese','🇻🇳'],['german','🇩🇪'],['british','🇬🇧'],['english','🇬🇧'],['russian','🇷🇺'],['brazilian','🇧🇷'],['peruvian','🇵🇪'],['turkish','🇹🇷'],['moroccan','🇲🇦'],['lebanese','🇱🇧'],['ethiopian','🇪🇹'],['taiwanese','🇹🇼'],['filipino','🇵🇭'],['indonesian','🇮🇩'],['malaysian','🇲🇾'],['singaporean','🇸🇬'],['polish','🇵🇱'],['hungarian','🇭🇺'],['swedish','🇸🇪'],['norwegian','🇳🇴'],['danish','🇩🇰'],['finnish','🇫🇮'],['irish','🇮🇪'],['cuban','🇨🇺'],['jamaican','🇯🇲'],['israeli','🇮🇱'],['portuguese','🇵🇹'],['georgian','🇬🇪'],['persian','🇮🇷'],['iranian','🇮🇷'],['argentine','🇦🇷'],['colombian','🇨🇴'],['dutch','🇳🇱'],['belgian','🇧🇪'],['swiss','🇨🇭'],['austrian','🇦🇹'],['ukrainian','🇺🇦'],['egyptian','🇪🇬'],['nigerian','🇳🇬'],['south african','🇿🇦'],['canadian','🇨🇦'],['australian','🇦🇺']];
/* flags for the cuisine named before any "(" or ","; "Russian-American" gets both */
function flagOf(c){ const part=String(c||'').toLowerCase().split(/[(,]/)[0]; const hits=FLAGS.map(([k,f])=>[part.indexOf(k),f]).filter(h=>h[0]>=0).sort((a,b)=>a[0]-b[0]); return [...new Set(hits.map(h=>h[1]))].join(''); }

/* ---------- routing ---------- */

/* ---------- render ---------- */

const fmtDateLong=d=>{ const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):String(d); };
function calcUpdated(){ let best='', lc=''; const see=o=>{ if(o&&isDate(o.updated)&&o.updated>best) best=o.updated; }; st.recipes.forEach(see); st.coffee.forEach(see); st.recipes.forEach(r=>{ if(isDate(r.last_cooked)&&r.last_cooked>lc) lc=r.last_cooked; }); st.updated=best; st.lastCooked=lc; }
function shell(active,back){
  const nC=st.coffee.filter(c=>c.kind==='coffee').length;
  const tabs=FOOD.filter(([k])=>k!=='unsorted'||inSec('unsorted').length).map(([k,l])=>`<button class="tab" role="tab" aria-selected="${active===k}" data-go="#/${k}">${l}<span class="n">${inSec(k).length}</span></button>`).join('');
  const home=active==='home', plain=home||active==='shop'||active==='recipe';
  return `<header class="head${back?' compact':''}"><div><h1><a href="#/" data-go="#/">Recipe Library</a></h1>${st.updated?`<div class="upd">Updated ${esc(fmtDateLong(st.updated))}</div>`:''}${home&&st.lastCooked?`<div class="upd">Last cooked ${esc(fmtDateLong(st.lastCooked))}</div>`:''}</div><span class="sp"></span><div class="hbtns">${back?`<button class="back" data-go="${esc(back.go)}">‹ ${esc(back.label)}</button>`:''}${home?'':`<button class="tbtn" data-go="#/" aria-label="Home"><i data-lucide="home"></i><span class="lbl">Home</span></button>`}<button class="tbtn icon" id="theme" aria-label="Switch between light and dark mode"><span class="ti-moon"><i data-lucide="moon"></i></span><span class="ti-sun"><i data-lucide="sun"></i></span></button></div></header>
  ${plain?'':`<nav class="tabs" role="tablist">${tabs}<button class="tab" role="tab" aria-selected="${active==='coffee'}" data-go="#/coffee">Coffee<span class="n" data-coffee-n>${nC}</span></button></nav>`}`;
}
function dbBanner(){
  if(st.dbState==='loading') return `<div class="status">Loading the library…</div>`;
  if(st.dbState==='nodb') return `<div class="status err">The library database isn't reachable in this view. Open the artifact from claude.ai while signed in.</div>`;
  if(st.dbState==='error') return `<div class="status err">Couldn't read the library: ${esc(st.dbErr)}</div>`;
  return '';
}
function render(){
  const r=route(); const app=$('#app'); app.classList.remove('shopwrap');
  { const rr=r.view==='r'?st.recipes.get(r.slug):null; const sec=rr?secOf(rr):(['breakfast','dinner','sides','desserts','unsorted','coffee'].includes(r.view)?r.view:'');
    app.className=app.className.replace(/\bs-\w+\b/g,'').replace(/\s+/g,' ').trim(); if(sec) app.classList.add('s-'+sec);
    const root=document.documentElement; root.className=root.className.replace(/\bth-\w+\b/g,'').replace(/\s+/g,' ').trim(); if(sec) root.classList.add('th-'+sec); }  /* each section carries its own colour */
  if(r.view==='r'&&r.slug){ if(st.lastRecipe!==r.slug){ delete rtabState[r.slug]; st.lastRecipe=r.slug; } } else st.lastRecipe='';  /* every time a recipe is opened, it starts on Notes */
  if(r.view==='r'&&r.slug){ listBuilt=false; renderRecipe(r.slug); if(r.cook) openCook(r.slug); else closeCook(); }
  else if(r.view==='coffee'){ listBuilt=false; closeCook(); if(r.slug) renderCoffeeDetail(r.slug); else renderCoffee(); }
  else if(FOOD.some(f=>f[0]===r.view)){
    if(r.view!==st.tab){ st.tab=r.view; Object.keys(st.filters).forEach(f=>st.filters[f]=''); listBuilt=false; }
    closeCook(); renderList(); }
  else if(r.view==='shop'){ listBuilt=false; closeCook(); renderShop(); }
  else { listBuilt=false; closeCook(); renderHome(); }
  paintIcons();
}

function renderList(){
  const app=$('#app');
  if(!listBuilt){
    const vals={}; FILTERS.forEach(([k,,fn])=>vals[k]=new Set());
    for(const r of recipeList()){ FILTERS.forEach(([k,,fn])=>{ if(k==='method') methodTags(r.method).forEach(t=>vals.method.add(t)); else { const v=fn(r); if(v) vals[k].add(v);} }); }
    if(st.tab==='sides') SIDE.forEach(([k])=>vals.type.add(k));  /* the Sides type filter always offers all three */
    const lab=filterLabel;
    const order=(k,arr)=>k==='time'?TB.map(b=>b[0]).filter(x=>arr.includes(x)):k==='protein'?PROT.map(p=>p[0]).filter(x=>arr.includes(x)):k==='type'?SIDE.map(p=>p[0]).filter(x=>arr.includes(x)):arr.sort();
    const shown=FILTERS.filter(([k])=>(TAB_FILTERS[st.tab]||[]).includes(k)&&vals[k].size>=2);
    app.innerHTML=shell(st.tab)+dbBanner()+`
      <input class="search" id="q" type="search" placeholder="Search names, ingredients, notes, cook notes" value="${esc(st.q)}" aria-label="Search recipes">

        ${shown.map(([k,l])=>`<label>${l}<select data-f="${k}"><option value="">All</option>${order(k,[...vals[k]]).map(v=>`<option value="${esc(v)}"${st.filters[k]===v?' selected':''}>${esc(lab(k,v))}</option>`).join('')}</select></label>`).join('')}

      <div class="grid" id="results"></div>`;
    $('#q').addEventListener('input',e=>{st.q=e.target.value;renderResults();});
    $('#sort').addEventListener('change',e=>{st.sort=e.target.value;LS.set('recipe-lib-sort',st.sort);renderResults();});
    app.querySelectorAll('[data-f]').forEach(s=>s.addEventListener('change',e=>{st.filters[s.dataset.f]=s.value;renderResults();}));

function haystack(r){
  const parts=[r.title,r.cuisine,r.protein,r.protein_group,r.side_type,r.method,r.notes,r.variations,r.omitted,r.intro];
  (r.ingredient_groups||[]).forEach(g=>{parts.push(g.name);(g.items||[]).forEach(i=>parts.push(i));});
  (r.cook_notes||[]).forEach(c=>{parts.push(c.heading,c.text);});
  return parts.join('\n').toLowerCase();
}
function renderResults(){
  const res=$('#results'); if(!res) return;
  const q=st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all=recipeList();
  let list=all.filter(r=>{
    if(q.length){ const h=haystack(r); if(!q.every(w=>h.includes(w))) return false; }
    for(const [k,,fn] of FILTERS){ const v=st.filters[k]; if(!v) continue;
      if(k==='method'){ if(!methodTags(r.method).includes(v)) return false; } else if(fn(r)!==v) return false; }
    return true;
  });
  const by={
    name:(a,b)=>a.title.localeCompare(b.title),
    last:(a,b)=>(isDate(b.last_cooked)?b.last_cooked:'').localeCompare(isDate(a.last_cooked)?a.last_cooked:'')||a.title.localeCompare(b.title),
    times:(a,b)=>((typeof b.times_cooked==='number'?b.times_cooked:(isCooked(b)?1:0))-(typeof a.times_cooked==='number'?a.times_cooked:(isCooked(a)?1:0)))||a.title.localeCompare(b.title),
    total:(a,b)=>(a.total_minutes??1e9)-(b.total_minutes??1e9),
    added:(a,b)=>String(b.date_added||'').localeCompare(String(a.date_added||''))||a.title.localeCompare(b.title)};
  list.sort(by[st.sort]||by.name);
  const act=FILTERS.filter(([k])=>st.filters[k]).map(([k,l])=>{const v=st.filters[k]; const shown=filterLabel(k,v); return `<button class="fchip" data-clear="${k}">${esc(l)}: ${esc(shown)} ×</button>`;});
  if(st.q.trim()) act.unshift(`<button class="fchip" data-clear="q">Search: “${esc(st.q.trim())}” ×</button>`);
  $('#active').innerHTML=act.length?act.join('')+`<button class="clear" data-clear="all">Clear all</button>`:'';
  $('#active').querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const k=b.dataset.clear; if(k==='all'){st.q='';Object.keys(st.filters).forEach(f=>st.filters[f]='');} else if(k==='q') st.q=''; else st.filters[k]=''; listBuilt=false; renderList();});
  $('#count').textContent=st.dbState==='ready'?`${list.length} of ${all.length} ${tabName(st.tab).toLowerCase()}`:'';
  if(st.dbState==='ready'&&!all.length){ res.innerHTML=`<div class="empty">${st.recipes.size?'No '+tabName(st.tab).toLowerCase()+' yet.':'The library is empty. Nothing has been written to the database yet.'}</div>`; return; }
  if(st.dbState==='ready'&&!list.length){ res.innerHTML=`<div class="empty">Nothing matches. Clear a filter or change the search.</div>`; return; }
  res.innerHTML=list.map(r=>`<button class="rcard" data-go="#/r/${encodeURIComponent(r.slug)}">
    <div class="rc-top">${rico(r)}<h3>${esc(r.title)}</h3></div>
    <div class="rc-tags"><span>${flagHtml(r.cuisine)}${esc(r.cuisine)}</span>${tagOf(r)}</div>
    <dl class="facts"><dt>Total</dt><dd>${esc(r.total_time)}</dd><dt>Serves</dt><dd>${esc(r.serves)}</dd></dl>
  </button>`).join(''); paintIcons();
}

/* ---------- log a cook ---------- */
function toast(msg,kind){ const t=document.createElement('div'); t.className='status toast '+(kind||'ok'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),kind==='err'?9000:4000); }
function openLog(slug){
  const r=st.recipes.get(slug); const ov=document.createElement('div'); ov.className='scrim';
  const rv=!!st.sample;
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Log a cook">
    <h2>Log a cook — ${esc(r.title)}</h2>
    <label>Date<input type="date" id="lgd" value="${todayLocal()}"></label>
    <label>What happened, in your words<textarea id="lgt" placeholder="How it went, what you changed, what to do next time. Say what should change in the method or ingredients and Claude will propose the edits."></textarea></label>
    <div id="lgs"></div>
    ${rv?`<button class="btn btn-primary" id="lgr">Save and review with Claude</button>`:''}
    <div class="row"><button class="btn" id="lgc">Cancel</button><button class="btn${rv?'':' btn-primary'}" id="lgo">Save cook</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  $('#lgc',ov).onclick=close; ov.addEventListener('click',e=>{if(e.target===ov) close();});
  const go=async(review)=>{
    const date=$('#lgd',ov).value, text=$('#lgt',ov).value.trim(), out=$('#lgs',ov), b1=$('#lgo',ov), b2=$('#lgr',ov);
    if(!isDate(date)){ out.innerHTML=`<div class="status err">Pick a date.</div>`; return; }
    if(!text){ out.innerHTML=`<div class="status err">Write a note first. The cook note is the point.</div>`; return; }
    const lab1=b1.textContent, lab2=b2&&b2.textContent; b1.disabled=true; if(b2) b2.disabled=true; (review?b2:b1).textContent='Saving…';
    try{
      const res=await saveCook(slug,date,text,review);
      close();
      if(review){ toast('Cook saved. Starting the review.','ok'); reviewCook(slug,res.idx); }
      else toast(res.numeric?`Saved. Cook ${res.n} logged for ${r.title}.`:`Saved the note for ${r.title}. Times cooked is "${res.tc}", not a number, so it wasn't changed.`,'ok');
    }catch(e){
      b1.disabled=false; b1.textContent=lab1; if(b2){ b2.disabled=false; b2.textContent=lab2; }
      out.innerHTML=`<div class="status err">Didn't save. ${esc(e&&e.code?e.code+': ':'')}${esc(e&&e.message||String(e))}</div>`;
    }
  };
  $('#lgo',ov).onclick=()=>go(false); if(rv) $('#lgr',ov).onclick=()=>go(true);
}
async function saveCook(slug,date,text,review){
  if(!st.db) throw {code:'unavailable',message:'The database isn\'t reachable in this view.'};
  const ref=st.db.doc('recipes/'+slug); const snap=await ref.get();
  if(!snap.exists) throw {code:'not_found',message:'This recipe is not in the database.'};
  const d=snap.data(); const tc=d.times_cooked; const numeric=typeof tc==='number'; const n=numeric?tc+1:null;
  const notes=JSON.parse(JSON.stringify(d.cook_notes||[]));
  notes.push(Object.assign({heading:date+' — '+(numeric?'cook '+n:'cook'),date,text,logged_from:'page'},review?{review_pending:true}:{}));
  const patch={updated:todayLocal(),cook_notes:notes,last_cooked:(isDate(d.last_cooked)&&d.last_cooked>date)?d.last_cooked:date,cook_notes_placeholder:''};
  if(numeric) patch.times_cooked=n;
  if(String(d.first_cooked).trim().toLowerCase()==='not yet') patch.first_cooked=date;
  await ref.update(patch);
  return {numeric,n,tc,idx:notes.length-1};
}

/* ---------- review a cook with Claude ---------- */
/* RVW-PURE-START */
const RVW_STEP_FIELDS=['text','cue','time','timer_min'];
const RVW_FIELD_LABEL={text:'text',cue:'doneness cue',time:'time',timer_min:'timer'};
const RVW_NOTE_FIELDS=['variations','omitted','notes'];
const RVW_NOTE_LABEL={variations:'Swaps and fixes',omitted:'Left out',notes:'Good to know'};
const RVW_TYPES=['prep','waiting','active heat'];
const ukey=(g,l)=>(g||'')+'::'+l;
const sameVal=(a,b)=>String(a==null?'':a)===String(b==null?'':b);
const rvClip=(s,n)=>{ s=String(s==null?'':s).trim(); return s.length>n?s.slice(0,n-1)+'…':s; };
function appendBullet(field,bullet){ const s=String(field||'').replace(/\s+$/,''); return (s?s+'\n':'')+'- '+bullet; }
function removeBullet(field,bullet){ const lines=String(field||'').split('\n'); const i=lines.findIndex(l=>/^\s*[-*]\s+/.test(l)&&l.replace(/^\s*[-*]\s+/,'').trim()===String(bullet).trim()); if(i<0) return null; lines.splice(i,1); return lines.join('\n'); }
function parseLoose(t){ t=String(t||'').replace(/```(?:json)?/gi,''); const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw {code:'bad_answer',message:'Claude\'s answer wasn\'t in the expected format.'}; try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw {code:'bad_answer',message:'Claude\'s answer wasn\'t in the expected format.'}; } }
function rvPrompt(d,cn,follow){
  const slim={title:d.title,serves:d.serves,scaling:d.scaling,
    ingredient_groups:d.ingredient_groups||[],
    steps:(d.steps||[]).map(s=>({n:s.n,section:s.section||null,type:s.type,time:s.time,text:s.text,cue:s.cue||'',timer_min:s.timer_min==null?null:s.timer_min,uses:s.uses||[]})),
    variations:d.variations||'',omitted:d.omitted||'',notes:d.notes||''};
  const prior=(d.cook_notes||[]).filter(c=>!(c.date===cn.date&&c.text===cn.text)).map(c=>({date:c.date,text:c.text}));
  return `You maintain Tim's personal recipe library. He just cooked "${d.title}" and wrote a cook note. Do two things: (1) summarize what happened in one or two plain sentences; (2) propose edits to the recipe ONLY where his note says, or clearly implies, that something should change in the method, ingredients, or notes.

HARD RULES
- Never invent a number, time, temperature, pan size or amount. Use only what the note states. If the note implies a change but gives no number, do not make it; put it under "questions".
- Never reword or touch the cook note itself. It is kept exactly as written.
- Smallest edit that carries the change. One edit per change. Don't re-propose anything the recipe already says, and don't propose changes from earlier cook notes (they are context only).
- Ingredient lines are "amount ingredient, short prep"; anything after " — " is an italic note. Match existing lines exactly when you refer to them.
- A step "time" is copied as stated; an estimate has "~" in front. A time he measured in this cook has no "~".
- If the note changes nothing in the recipe, return an empty "edits" list. That is a correct answer.
- If his note answers a "**Gap:**" bullet in notes, propose the edit that uses the answer AND a note_remove for that exact gap bullet.
- A needed change you cannot express with the edit kinds below (reordering steps, deleting a step, changing servings) goes in "questions", one short line each.
- Bullet formats: variations "**Label**: what to do"; omitted "Item — why it was left out"; notes are plain bullets. Never start a bullet with "Gap".

EDIT KINDS (JSON objects; every edit has a short "reason" in plain words)
{"kind":"step","n":<step number>,"field":"text"|"cue"|"time"|"timer_min","to":<new value; timer_min is minutes as a number, or null>,"reason":"..."}
{"kind":"ingredient_edit","group":"<group name, \\"\\" if none>","line":"<exact existing line>","to":"<new line>","reason":"..."}
{"kind":"ingredient_add","group":"<existing group name>","line":"<new line>","step_n":<step that adds it, or null>,"reason":"..."}
{"kind":"ingredient_remove","group":"<group name>","line":"<exact existing line>","reason":"..."}
{"kind":"step_insert","after_n":<0 to put it first, else the step it follows>,"type":"prep"|"waiting"|"active heat","time":"<e.g. ~5 min>","text":"...","cue":"<doneness cue or \\"\\">","timer_min":<number or null>,"uses":["<group name>::<exact ingredient line>"],"reason":"..."}
{"kind":"note_add","field":"variations"|"omitted"|"notes","bullet":"<one bullet, no leading dash>","reason":"..."}
{"kind":"note_remove","field":"variations"|"omitted"|"notes","bullet":"<exact existing bullet text, no leading dash>","reason":"..."}

Answer with JSON only, no prose and no code fences:
{"summary":"...","edits":[...],"questions":["..."]}

RECIPE (current state)
${JSON.stringify(slim)}

EARLIER COOK NOTES (context only)
${JSON.stringify(prior)}

THE COOK NOTE TO REVIEW (${cn.date})
${cn.text}${follow?`

FOLLOW-UP FROM TIM (he answered your earlier questions and/or added notes; treat his answers as part of the cook note, same rules, no invented numbers)
Your previous proposed edits: ${JSON.stringify(follow.prevEdits)}
His answers to your questions: ${JSON.stringify(follow.answers)}
His additional notes: ${JSON.stringify(follow.notes)}
Give a fresh, complete answer in the same JSON format. Keep earlier edits that still hold, revise or drop any his answers change, and add the edits his answers call for. Do not ask a question he already answered; ask only genuinely new ones.`:''}`;
}
function buildProposals(d,resp,date){
  const items=[]; let dropped=0, seq=0;
  const steps=d.steps||[], groups=d.ingredient_groups||[];
  const stepBy=n=>steps.find(s=>s.n===Number(n));
  const groupBy=nm=>groups.find(g=>(g.name||'')===(nm||''));
  const edits=Array.isArray(resp&&resp.edits)?resp.edits:[];
  const when='(after the '+fmtDate(date)+' cook)';
  const push=o=>{ o.id='e'+(seq++); items.push(o); };
  edits.forEach(e=>{
    try{
      if(!e||typeof e!=='object') throw 0;
      const why=rvClip(e.reason||'',300);
      const rec=(label)=>'**'+label+'.** '+(why||'Changed from the cook note.')+' '+when;
      if(e.kind==='step'){
        const s=stepBy(e.n); if(!s||!RVW_STEP_FIELDS.includes(e.field)) throw 0;
        const f=e.field; let to=e.to;
        if(f==='timer_min'){ if(to===null||to==='') to=null; else { to=Number(to); if(!isFinite(to)||to<=0) throw 0; } }
        else { to=String(to==null?'':to).trim(); if(f!=='cue'&&!to) throw 0; }
        const from=s[f]==null?'':s[f]; if(sameVal(from,to)) throw 0;
        const label='Step '+s.n+' '+RVW_FIELD_LABEL[f];
        push({kind:'step',label,why,before:String(from===''?'(empty)':from),after:String(to===null||to===''?'(empty)':to),record:rec(label),
          apply:x=>{ const t=x.steps.find(q=>q.n===s.n); if(!t||!sameVal(t[f],from)) throw new Error('Step '+s.n+' changed since the review started.'); t[f]=to; }});
      }else if(e.kind==='ingredient_edit'){
        const g=groupBy(e.group); const to=String(e.to||'').trim(); const line=String(e.line||'');
        if(!g||!g.items.includes(line)||!to||to===line) throw 0;
        const gn=g.name||''; const label='Ingredient'+(gn?' · '+gn:'');
        push({kind:'ing',label,why,before:line,after:to,record:rec(label),
          apply:x=>{ const gg=x.ingredient_groups.find(q=>(q.name||'')===gn); const i=gg?gg.items.indexOf(line):-1; if(i<0) throw new Error('"'+line+'" changed since the review started.'); gg.items[i]=to; x.steps.forEach(s=>{ if(Array.isArray(s.uses)) s.uses=s.uses.map(u=>u===ukey(gn,line)?ukey(gn,to):u); }); }});
      }else if(e.kind==='ingredient_add'){
        const g=groupBy(e.group); const line=String(e.line||'').trim();
        if(!g||!line||g.items.includes(line)) throw 0;
        let sn=null; if(e.step_n!=null&&e.step_n!==''){ const s=stepBy(e.step_n); if(!s) throw 0; sn=s.n; }
        const gn=g.name||''; const label='Add ingredient'+(gn?' · '+gn:'');
        push({kind:'ing',label,why,before:'',after:line+(sn?'   (used in step '+sn+')':''),record:rec(label),
          apply:x=>{ const gg=x.ingredient_groups.find(q=>(q.name||'')===gn); if(!gg) throw new Error('Group "'+gn+'" changed since the review started.'); gg.items.push(line); if(sn){ const t=x.steps.find(q=>q.n===sn); if(t){ t.uses=Array.isArray(t.uses)?t.uses:[]; t.uses.push(ukey(gn,line)); } } }});
      }else if(e.kind==='ingredient_remove'){
        const g=groupBy(e.group); const line=String(e.line||'');
        if(!g||!g.items.includes(line)) throw 0;
        const gn=g.name||''; const label='Remove ingredient'+(gn?' · '+gn:'');
        push({kind:'ing',label,why,before:line,after:'(removed)',record:rec(label),
          apply:x=>{ const gg=x.ingredient_groups.find(q=>(q.name||'')===gn); const i=gg?gg.items.indexOf(line):-1; if(i<0) throw new Error('"'+line+'" changed since the review started.'); gg.items.splice(i,1); x.steps.forEach(s=>{ if(Array.isArray(s.uses)) s.uses=s.uses.filter(u=>u!==ukey(gn,line)); }); }});
      }else if(e.kind==='step_insert'){
        const after=Number(e.after_n); if(!Number.isInteger(after)||after<0||after>steps.length) throw 0;
        const text=String(e.text||'').trim(), time=String(e.time||'').trim();
        if(!text||!time||!RVW_TYPES.includes(e.type)) throw 0;
        let tm=e.timer_min; if(tm===null||tm===undefined||tm==='') tm=null; else { tm=Number(tm); if(!isFinite(tm)||tm<=0) throw 0; }
        const uses=(Array.isArray(e.uses)?e.uses:[]).map(String); const valid=new Set(); groups.forEach(g=>g.items.forEach(l=>valid.add(ukey(g.name,l))));
        if(uses.some(u=>!valid.has(u))) throw 0;
        const nb=steps[after-1]||steps[0]; const section=nb&&nb.section?nb.section:null;
        const label='New step after '+(after===0?'the start':'step '+after);
        push({kind:'step_insert',label,why,before:'',after:text+'\n('+e.type+' · '+time+')',record:rec(label),
          apply:x=>{ if(x.steps.length!==steps.length) throw new Error('The steps changed since the review started.'); const ns={n:0,section,type:e.type,type_source:'guess',time,text,cue:String(e.cue||'').trim(),timer_min:tm,uses}; x.steps.splice(after,0,ns); x.steps.forEach((s,i)=>{ s.n=i+1; }); }});
      }else if(e.kind==='note_add'){
        const f=e.field, b=String(e.bullet||'').trim().replace(/^[-*]\s+/,'');
        if(!RVW_NOTE_FIELDS.includes(f)||!b||b.length>500||/^\W*gap\b/i.test(b)) throw 0;
        if(bulletsOf(d[f]).includes(b)) throw 0;
        push({kind:'note',label:'Add to '+RVW_NOTE_LABEL[f],why,before:'',after:b,record:'',
          apply:x=>{ x[f]=appendBullet(x[f],b); }});
      }else if(e.kind==='note_remove'){
        const f=e.field, b=String(e.bullet||'').trim().replace(/^[-*]\s+/,'');
        if(!RVW_NOTE_FIELDS.includes(f)||!b||removeBullet(d[f],b)===null) throw 0;
        push({kind:'note',label:'Remove from '+RVW_NOTE_LABEL[f],why,before:b,after:'(removed)',record:'',
          apply:x=>{ const r=removeBullet(x[f],b); if(r===null) throw new Error('That note changed since the review started.'); x[f]=r; }});
      }else throw 0;
    }catch(err){ dropped++; }
  });
  const questions=(Array.isArray(resp&&resp.questions)?resp.questions:[]).map(q=>rvClip(q,240)).filter(Boolean).slice(0,6);
  return {items,dropped,questions,summary:rvClip(resp&&resp.summary||'',600)};
}
function applyChosen(f,chosen,today,cn){
  const x={steps:JSON.parse(JSON.stringify(f.steps||[])),ingredient_groups:JSON.parse(JSON.stringify(f.ingredient_groups||[])),variations:f.variations||'',omitted:f.omitted||'',notes:f.notes||'',changes:f.changes||''};
  chosen.forEach(it=>it.apply(x));
  chosen.forEach(it=>{ if(it.record) x.changes=appendBullet(x.changes,it.record); });
  const patch={updated:today};
  const cnotes=JSON.parse(JSON.stringify(f.cook_notes||[])); const ni=cnotes.findIndex(c=>c.date===cn.date&&c.text===cn.text);
  if(ni>=0){ cnotes[ni].reviewed=today; cnotes[ni].applied=chosen.length; delete cnotes[ni].review_pending; patch.cook_notes=cnotes; }
  if(chosen.length) Object.assign(patch,x,{version:(Number(f.version)||0)+1});
  return patch;
}

const RVW_ERR={
  not_granted:'Claude access was declined for this page, so no review ran.',
  rate_limited:'Too many requests right now. Give it a minute and try again.',
  truncated:'Claude\'s answer got cut off. Try the review again.'
};
async function reviewCook(slug,idx){
  if(!st.sample||!st.db){ toast('Claude review isn\'t available in this view.','err'); return; }
  let d;
  try{ const snap=await st.db.doc('recipes/'+slug).get(); if(!snap.exists) throw new Error('That recipe isn\'t in the library.'); d=snap.data(); }
  catch(e){ toast('Couldn\'t open the recipe: '+((e&&e.message)||e),'err'); return; }
  const cn=(d.cook_notes||[])[idx]; if(!cn){ toast('Couldn\'t find that cook note.','err'); return; }
  const baseVersion=d.version;
  const ctl=new AbortController(); const ov=document.createElement('div'); ov.className='scrim';
  ov.innerHTML=`<div class="sheet rvw" role="dialog" aria-modal="true" aria-label="Claude review">
    <h2>Review — ${esc(d.title)}</h2>
    <div id="rvb"></div><div id="rvs"></div><div class="rv-act" id="rva"></div></div>`;
  document.body.appendChild(ov);
  const hasTyped=()=>[...ov.querySelectorAll('textarea')].some(t=>t.value.trim());
  const close=()=>{ ctl.abort(); ov.remove(); };
  ov.addEventListener('click',e=>{ if(e.target===ov&&!hasTyped()) close(); });
  const follow={prevEdits:[],answers:[],notes:[]};
  let plan=null, checked=new Set();
  const fail=(e)=>{
    if(!ov.isConnected||(e&&e.code==='cancelled')) return;
    const msg=RVW_ERR[e&&e.code]||((e&&e.code?e.code+': ':'')+((e&&e.message)||String(e)));
    $('#rvb',ov).innerHTML=`<div class="status err">${esc(msg)} Your cook note is saved. You can run the review again from the Cook log.</div>`;
    $('#rva',ov).innerHTML=`<div class="row"><button class="btn" id="rvx2">Close</button>${e&&e.code==='not_granted'?'':'<button class="btn btn-primary" id="rvr">Try again</button>'}</div>`;
    $('#rvx2',ov).onclick=close; const rr=$('#rvr',ov); if(rr) rr.onclick=()=>run();
  };
  const paint=()=>{
    const n=checked.size, btn=$('#rvo',ov), u=$('#rvu',ov); if(!btn) return;
    const typed=hasTyped(); u.hidden=!typed; btn.disabled=typed;
    btn.textContent=typed?'Update review first':(plan.items.length?(n?`Apply ${n} change${n===1?'':'s'}`:'Mark reviewed, no changes'):'Mark reviewed');
  };
  const render=()=>{
    const {items,dropped,questions,summary}=plan; checked=new Set(items.map(i=>i.id));
    const itemHtml=items.map(it=>`<label class="rv-item"><input type="checkbox" data-rv="${it.id}" checked><div><div class="rv-lbl">${esc(it.label)}</div>${it.why?`<div class="rv-why">${esc(it.why)}</div>`:''}${it.before?`<div class="rv-b">${esc(it.before)}</div>`:''}<div class="rv-a">${esc(it.after)}</div></div></label>`).join('');
    $('#rvb',ov).innerHTML=
      (summary?`<p class="rv-sum">${esc(summary)}</p>`:'')+
      (items.length?`<div class="rv-list">${itemHtml}</div>`:`<div class="status">Nothing in the recipe needs to change from this note.</div>`)+
      (questions.length?`<div class="rv-q"><b>Needs your call</b>${questions.map((q,i)=>`<label class="rv-qa">${esc(q)}<textarea data-qa="${i}" placeholder="Your answer"></textarea></label>`).join('')}</div>`:'')+
      `<label class="rv-more">${questions.length?'Anything else to change or add?':'Add a note or ask for another change'}<textarea data-more placeholder="Anything you type here is saved with the cook and Claude re-reviews with it"></textarea></label>`+
      (dropped?`<p class="rv-why">${dropped} suggestion${dropped===1?'':'s'} didn't match the recipe and ${dropped===1?'was':'were'} left out.</p>`:'');
    $('#rvs',ov).innerHTML='';
    $('#rva',ov).innerHTML=`<button class="btn" id="rvu" hidden>Update review with my answers</button><div class="row"><button class="btn" id="rvk">Not now</button><button class="btn btn-primary" id="rvo"></button></div>`;
    $('#rvk',ov).onclick=close; $('#rvu',ov).onclick=update; $('#rvo',ov).onclick=apply; paint();
  };
  const run=async()=>{
    $('#rvb',ov).innerHTML=`<div class="status">Claude is reading your note against the recipe. This can take up to a minute.</div>`;
    $('#rvs',ov).innerHTML=''; $('#rva',ov).innerHTML=`<div class="row"><button class="btn" id="rvx">Stop</button></div>`; $('#rvx',ov).onclick=close;
    let resp;
    try{
      const withFollow=follow.answers.length||follow.notes.length;
      const out=await st.sample(rvPrompt(d,cn,withFollow?follow:null),{modelTier:'complex',cache:false,signal:ctl.signal});
      if(!ov.isConnected) return;
      if(out.truncated) throw {code:'truncated'};
      resp=parseLoose(out.text); plan=buildProposals(d,resp,cn.date);
    }catch(e){ fail(e); return; }
    follow.prevEdits=Array.isArray(resp.edits)?resp.edits:[]; follow.lastQuestions=plan.questions;
    render();
  };
  const update=async()=>{
    const ans=[...ov.querySelectorAll('[data-qa]')].map(t=>({q:plan.questions[Number(t.dataset.qa)],a:t.value.trim()})).filter(x=>x.a);
    const mt=ov.querySelector('[data-more]'), more=mt?mt.value.trim():'';
    if(!ans.length&&!more) return;
    const fu=ans.slice(); if(more) fu.push({q:'',a:more});
    const u=$('#rvu',ov); u.disabled=true; u.textContent='Saving…';
    try{ await saveFollowUps(slug,cn,fu); }
    catch(e){ u.disabled=false; u.textContent='Update review with my answers'; $('#rvs',ov).innerHTML=`<div class="status err">Didn't save your answers. ${esc(e&&e.code?e.code+': ':'')}${esc(e&&e.message||String(e))}</div>`; return; }
    follow.answers.push(...ans); if(more) follow.notes.push(more);
    run();
  };
  const apply=async()=>{
    const btn=$('#rvo',ov), chosen=plan.items.filter(i=>checked.has(i.id)); const label=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
    try{
      const res=await applyReview(slug,baseVersion,chosen,cn);
      close(); toast(chosen.length?`Applied ${chosen.length} change${chosen.length===1?'':'s'} to ${d.title}. Now v${res.version}.`:`Marked reviewed. ${d.title} unchanged.`,'ok');
    }catch(e){
      btn.disabled=false; btn.textContent=label;
      $('#rvs',ov).innerHTML=`<div class="status err">Didn't save. ${esc(e&&e.code?e.code+': ':'')}${esc(e&&e.message||String(e))}</div>`;
    }
  };
  ov.addEventListener('change',e=>{ const c=e.target.closest('[data-rv]'); if(!c) return; if(c.checked) checked.add(c.dataset.rv); else checked.delete(c.dataset.rv); paint(); });
  ov.addEventListener('input',e=>{ if(e.target.matches('textarea')) paint(); });
  run();
}
async function saveFollowUps(slug,cn,fu){
  const ref=st.db.doc('recipes/'+slug); const snap=await ref.get();
  if(!snap.exists) throw {code:'not_found',message:'This recipe is not in the database.'};
  const f=snap.data(); const notes=JSON.parse(JSON.stringify(f.cook_notes||[]));
  const ni=notes.findIndex(c=>c.date===cn.date&&c.text===cn.text);
  if(ni<0) throw {code:'not_found',message:'That cook note is no longer in the recipe.'};
  const today=todayLocal();
  notes[ni].follow_ups=(notes[ni].follow_ups||[]).concat(fu.map(x=>({q:x.q||'',a:x.a,date:today})));
  await ref.update({cook_notes:notes,updated:today});
}
async function applyReview(slug,baseVersion,chosen,cn){
  const ref=st.db.doc('recipes/'+slug); const snap=await ref.get();
  if(!snap.exists) throw {code:'not_found',message:'This recipe is not in the database.'};
  const f=snap.data();
  if(chosen.length&&Number(f.version||0)!==Number(baseVersion||0)) throw {code:'changed',message:'This recipe changed while you were reviewing. Run the review again.'};
  const patch=applyChosen(f,chosen,todayLocal(),cn);
  await ref.update(patch);
  const back=await ref.get();
  if(!back.exists||(chosen.length&&Number(back.data().version)!==patch.version)) throw {code:'verify',message:'The save didn\'t read back. Check the recipe before trying again.'};
  return {version:patch.version||f.version};
}

/* ---------- cooking widget (one template for every recipe) ---------- */
const ck={slug:null,page:0,servings:0,mult:1};
const wide=matchMedia('(min-width:600px)');
wide.addEventListener('change',()=>{ if(ck.slug) drawCook(); });
function openCook(slug){
  const r=st.recipes.get(slug); if(!r) return;
  if(ck.slug!==slug){ ck.slug=slug; ck.page=0; ck.mult=1; ck.servings=(r.scaling&&r.scaling.base)||1; }

}
function closeCook(){ if(ck.slug){ ck.slug=null; $('#overlay').innerHTML=''; document.body.style.overflow=''; } }
function pagesFor(r){ const p=[{k:'ing'}]; (r.steps||[]).forEach(s=>p.push({k:'step',s})); if(wide.matches) p.push({k:'ref'}); return p; }
function combineHtml(c){
  const heat=c.heat==='cold'?`${ic('snowflake')} cold`:c.heat==='off'?'off heat':(c.heat&&c.heat!=='none')?`${ic('flame')} ${esc(c.heat)}`:'';

    <div class="carrow">${ic('down')}</div>
    <span class="chip result">${esc(c.result)}</span></div>`;

function drawCook(){
  const r=st.recipes.get(ck.slug); if(!r){ closeCook(); return; }
  const pages=pagesFor(r); if(ck.page>=pages.length) ck.page=pages.length-1;
  const P=pages[ck.page], S=scaleInfo(r,ck), f=S.f;
  const nSteps=(r.steps||[]).filter(x=>typeof x.n==='number').length;
  const prog=P.k==='ing'?'Ingredients':P.k==='ref'?'Reference':(typeof P.s.n==='number'?`Step ${P.s.n} of ${nSteps}`:'Before you start');
  const pct=pages.length>1?Math.round(ck.page/(pages.length-1)*100):100;
  const hasLongTimer=(r.steps||[]).some(s=>s.timer_min>5);
  let body='';
  if(P.k==='ing'){
    body=`${!S.enabled?`<div class="scale-note">Scales by ${esc(S.s.unit||'—')}, so the stepper is off. ${inl(S.s.note||'')}</div>`:(S.s.note?`<div class="scale-note">${inl(S.s.note)}</div>`:'')}
      <div class="ck-ing">${(r.ingredient_groups||[]).map(g=>`${g.name?`<h3>${esc(g.name)}</h3>`:''}<ul>${g.items.map(i=>`<li>${ingHtml(i,f)}</li>`).join('')}</ul>`).join('')}</div>
      ${hasLongTimer?`<p class="tnote">Timers stop if you switch apps or lock the phone, and they make no sound.</p>`:''}`;
  } else if(P.k==='step'){
    const s=P.s; let tm='';
    if(s.alarm) tm=`<div class="alarm">${ic('clock')}<span>Set a phone alarm — ${esc(s.alarm)}</span></div>`;
    else if(s.timer_min){ const key=r.slug+':'+s.n; tState(key,s.timer_min); tm=`<button class="tmr" data-timer="${key}" aria-label="Timer for step ${s.n}">${ic('clock')}<span class="tv"></span><small></small></button>`; }
    body=`${chapBar(r,s)}${badge(s.type,s.time)}
      ${s.combine?combineHtml(s.combine):''}
      ${usesHtml(r,s,f)}
      <div class="ck-text">${md(scaleText(s.text,f,false))}</div>
      ${s.cue?`<div class="cue">${inl(s.cue)}</div>`:''}${tm}`;
  } else {
    const sec=(t,b)=>b?`<details class="sec" open><summary>${t}</summary><div class="body">${b}</div></details>`:'';
    body=`<div class="ck-sect">Reference</div>${sec('Source',`<p>${inl(r.source)}</p>`)}${sec('Variations',md(r.variations))}${sec('Deliberately left out',md(r.omitted))}${sec('Changes from the original',md(r.changes))}${sec('Notes and gaps',md(r.notes))}${r.source_comparison?`<details class="sec"><summary>Source comparison</summary><div class="body">${md(r.source_comparison)}</div></details>`:''}`;

const AISLES=[['produce','Produce'],['meat','Meat & seafood'],['dairy','Dairy & eggs'],['pantry','Pantry'],['spices','Spices & seasonings'],['baking','Baking'],['frozen','Frozen'],['other','Other']];
const singW=w=>w.replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^s])s$/,'$1');
function ingKey(name){ return name.toLowerCase().replace(/\b(unsalted|salted|large|medium|small|fresh|freshly|ground|whole|finely|thinly|neutral)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').map(singW).join(' '); }
function aisleOf(k){
  if(/\bfrozen\b/.test(k)) return 'frozen';
  if(/\b(flour|sugar|cocoa|cornstarch|cornmeal|baking|vanilla|chocolate|powdered)\b/.test(k)) return 'baking';
  if(/\b(salt|gochugaru|paprika|cumin|cinnamon|nutmeg|oregano|cayenne|turmeric)\b|black pepper|ground pepper|white pepper|pepper flake|perilla seed|dried\b.*\b(chili|chile)\b/.test(k)) return 'spices';
  if(/\b(dried|paste|sauce|powder|seed|vinegar|oil|miso|doenjang|gochujang|stock|broth|mirin|sake|wine|spray|rice|caper|olive|pickle|mustard|honey|ketchup|mayo|jam|syrup|molasses|espresso|coffee|water)\b/.test(k)) return 'pantry';
  if(/\b(butter|buttermilk|milk|cream|egg|yolk|cheese|yogurt)\b/.test(k)) return 'dairy';
  if(/\b(pork|bacon|bone|chicken|beef|steak|sausage|ham|cod|sablefish|skate|salmon|fish|shrimp|fillet|lamb|turkey)\b/.test(k)) return 'meat';
  if(/\b(poblano|jalapeno|serrano|chili|chile|pepper|scallion|onion|shallot|garlic|ginger|cabbage|potato|corn|cherry|parsley|lemon|lime|leaf|leave|sprout|tomato|cilantro|basil|carrot|celery|mushroom|shiitake|spinach|lettuce|cucumber|herb|thyme|rosemary)\b/.test(k)) return 'produce';
  return 'other';
}
const SHOP_UNIT=UNIT.replace(/\)$/,'|ears?|heads?|bunch(?:es)?|cans?|bottles?|slices?|sprigs?|sheets?)');
const ING_RE=new RegExp('^('+RANGE+')\\s*(?:('+SHOP_UNIT+')(?![A-Za-z]))?\\s*(.*)$');
const cleanName=n=>n.replace(/\b(melted|softened|chopped|minced|sliced|diced|grated|crushed|toasted)\b/gi,' ').replace(/\s+/g,' ').trim();
const unitStr=(v,u)=>/^cups?$/i.test(u)?(v>1.0001?'cups':'cup'):u;
function splitIng(line){ const raw=String(line||''); const i=raw.indexOf(' — '); if(i<0) return {main:raw,note:''};
  let main=raw.slice(0,i).trim(), note=raw.slice(i+3).trim(); const m=note.match(/^optional\b[;:,.]?\s*(.*)$/i);
  if(m){ main+=' — optional'; note=m[1].trim(); } return {main,note}; }
function ingHtml(line,f){ const {main,note}=splitIng(line); return inl(scaleText(main,f,true))+(note?`<div class="inote">${inl(note)}</div>`:''); }
function ingBrief(line,f){ const {main}=splitIng(line); return inl(scaleText(main,f,true)); }
function parseIng(line){
  const raw=String(line||''); const head=raw.split(' — ')[0].trim();
  const optional=/\boptional\b/i.test(raw);
  const m=head.match(ING_RE); let qty='',unit='',rest=head;
  if(m){ qty=m[1]; unit=m[2]||''; rest=m[3]; }
  const name=rest.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').split(',')[0].replace(/\.$/,'').trim();
  const comment=rest.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').split(',').slice(1).join(',').replace(/\.$/,'').trim();
  return {qty,unit,name:cleanName(name),optional,comment};
}
function qtyVal(qty,f){ if(!qty) return null; const parts=qty.split(/\s*(?:–|-|to)\s*/).map(x=>parseNum(x.trim())); if(!parts.length||parts.some(x=>isNaN(x))) return null; return {vals:parts.map(v=>v*f),range:parts.length>1}; }
const fmtAmt=(v,unit)=>unit?fmtQty(v,unit):String(Math.max(1,Math.ceil(v-1e-9)));
const cap=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;
/* merges every ingredient line of the picked recipes into one row per item; sums only when the unit is the same, never converts units */
function buildItems(picks){
  const map=new Map(), used=new Set();
  for(const p of picks){ const r=st.recipes.get(p.slug); if(!r) continue;
    for(const g of (r.ingredient_groups||[])){ if(/equipment/i.test(g.name||'')) continue;
      for(const line of (g.items||[])){ if(!pickHas(p,g.name||'',line)) continue; const e=parseIng(line); if(!e.name) continue; const k=ingKey(e.name); if(!k||isWater(k)) continue;
        let it=map.get(k);
        if(!it){ let id=k.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item'; while(used.has(id)) id+='x'; used.add(id); it={id,key:k,name:e.name,ents:[],recipes:[],optional:true}; map.set(k,it); }
        if(e.name.length>it.name.length) it.name=e.name;
        it.ents.push({q:qtyVal(e.qty,p.mult),unit:e.unit,uk:singW(e.unit.toLowerCase())});
        if(!it.recipes.includes(r.title)) it.recipes.push(r.title);
        if(!e.optional) it.optional=false; } } }
  const order=AISLES.map(a=>a[0]);
  return [...map.values()].map(it=>{
    const sums=new Map(), ranges=[];
    for(const en of it.ents){ if(!en.q) continue;
      if(en.q.range) ranges.push(en.q.vals.map(v=>fmtAmt(v,en.unit)).join('–')+(en.unit?' '+unitStr(en.q.vals[en.q.vals.length-1],en.unit):''));
      else { const sm=sums.get(en.uk)||{v:0,unit:en.unit}; sm.v+=en.q.vals[0]; sums.set(en.uk,sm); } }
    const amount=[...sums.values()].map(sm=>fmtAmt(sm.v,sm.unit)+(sm.unit?' '+unitStr(sm.v,sm.unit):'')).concat(ranges).join(' + ');
    return {id:it.id,name:it.name,amount,aisle:aisleOf(it.key),recipes:it.recipes,optional:it.optional,have:false,done:false};
  }).sort((a,b)=>order.indexOf(a.aisle)-order.indexOf(b.aisle)||a.name.localeCompare(b.name));
}
const isWater=k=>/^(cold |hot |warm |boiling |tap )?water$/.test(k);

function saveDoc(key,getRef,getObj){

/* ---------- tabbed recipe page (prototype: gamjatang only) ---------- */

/* one row per ingredient across every section; repeated ingredients list each amount in italics */

const fmtMins=m=>typeof m!=='number'?'':m>=1440?Math.round(m/1440)+' days':(m>=60?Math.floor(m/60)+' hr'+(m%60?' '+(m%60)+' min':''):m+' min');

  if(e.target.closest('[data-addall]')){ setLines(slug,shoppableLines(r).map(l=>l.key)); paintShopUI(r); return; }
});

/* ---------- boot: db + user ---------- */
render();
(async()=>{
  try{
    if(!window.claude||typeof claude.use!=='function'){ st.dbState='nodb'; st.coffeeState='nodb'; render(); return; }
    const [db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample').catch(()=>null)]);
    st.user=user; st.sample=sample||null; st.owner=user?await user.isOwner():false;
    if(!db){ st.dbState='nodb'; render(); return; }
    st.db=db;
    db.collection('recipes').onSnapshot(snap=>{
      st.recipes=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,Object.assign({slug:d.id},d.data())]));
      st.dbState='ready'; calcUpdated(); listBuilt=false; const r=route(); if(r.cook&&ck.slug) drawCook(); render();
    },e=>{ st.dbState='error'; st.dbErr=(e&&e.code||'error')+': '+(e&&e.message||''); render(); });
    shop.ref=db.doc('shopping/draft');
    shop.ref.onSnapshot(snap=>{
      shop.dReady=true; if(saving('draft')) return;
      const incoming=snap.exists?snap.data():null; const sig=incoming?stable(incoming):'';
      if(shop.seen&&sig===shop.last.draft) return;
      shop.seen=true; shop.last.draft=sig; shop.doc=incoming?clone(incoming):null;
      if(shop.doc&&shop.doc.items) shop.doc.items=shop.doc.items.filter(i=>!WATER_ID.test(i.id));
      const v=route().view; if(v==='shop'||v==='') render();
    },e=>{ shop.dReady=true; toast('Draft list unavailable: '+((e&&e.message)||''),'err'); });
    db.collection('lists').onSnapshot(snap=>{
      let changed=!shop.lReady; shop.lReady=true; const present=new Set();
      snap.docs.forEach(x=>{ if(!x.exists) return; present.add(x.id); shop.seenIds.add(x.id); const key='l:'+x.id; if(saving(key)) return; const data=x.data(), sig=stable(data); if(shop.last[key]===sig&&shop.lists.has(x.id)) return; shop.last[key]=sig; shop.lists.set(x.id,clone(data)); changed=true; });
      for(const id of [...shop.lists.keys()]){ if(shop.seenIds.has(id)&&!present.has(id)&&!saving('l:'+id)){ shop.lists.delete(id); shop.seenIds.delete(id); changed=true; } }
      if(changed){ const v=route().view; if(v==='shop'||v==='') render(); }
    },e=>{ shop.lReady=true; toast('Lists unavailable: '+((e&&e.message)||''),'err'); });
    db.collection('coffee').onSnapshot(snap=>{
      st.coffee=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())); st.coffeeState='ready'; calcUpdated();
      render();
    },e=>{ st.coffeeState='error'; });
  }catch(e){ st.dbState='error'; st.dbErr=(e&&e.message)||String(e); render(); }
})();
</script>
